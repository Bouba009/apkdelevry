          // -------------------------------------------------------------
          // MAPLIBRE MAP VIEW (MapLibre Native GL implementation)
          // -------------------------------------------------------------
          @Composable
          fun MapLibreTrackingView(
              centerLat: Double,
              centerLng: Double,
              destinationLat: Double,
              destinationLng: Double,
              modifier: Modifier = Modifier
          ) {
              val context = LocalContext.current
              var roadWaypoints by remember { mutableStateOf<List<LatLng>>(emptyList()) }

              LaunchedEffect(centerLat, centerLng, destinationLat, destinationLng) {
                  roadWaypoints = MapUtils.fetchOsrmRoadPath(centerLat, centerLng, destinationLat, destinationLng)
              }

              AndroidView(
                  modifier = modifier.fillMaxSize(),
                  factory = { ctx ->
                      MapView(ctx).apply {
                          onCreate(null)
                          getMapAsync { map ->
                              map.setStyle("https://demotiles.maplibre.org/style.json") { _ ->
                                  map.cameraPosition = CameraPosition.Builder()
                                      .target(LatLng(centerLat, centerLng))
                                      .zoom(14.5)
                                      .build()
                              }
                          }
                      }
                  },
                  update = { mapView ->
                      mapView.getMapAsync { map ->
                          map.clear()

                          val iconFactory = IconFactory.getInstance(context)
                          val userPin = MapUtils.createCustomBitmap(android.graphics.Color.parseColor("#1E2024"), "🏠")
                          val storePin = MapUtils.createCustomBitmap(android.graphics.Color.parseColor("#FF5E00"), "🍴")
                          val bikePin = MapUtils.createCustomBitmap(android.graphics.Color.parseColor("#FF5E00"), "🛵")

                          // User Marker
                          map.addMarker(
                              MarkerOptions()
                                  .position(LatLng(centerLat, centerLng))
                                  .title("Vous")
                                  .icon(iconFactory.fromBitmap(userPin))
                          )

                          // Store Marker
                          map.addMarker(
                              MarkerOptions()
                                  .position(LatLng(destinationLat, destinationLng))
                                  .title("Store")
                                  .icon(iconFactory.fromBitmap(storePin))
                          )

                          // Real Road-Follow Polyline
                          if (roadWaypoints.isNotEmpty()) {
                              map.addPolyline(
                                  PolylineOptions()
                                      .addAll(roadWaypoints)
                                      .color(android.graphics.Color.parseColor("#FF5E00"))
                                      .width(6f)
                              )

                              // Courier Midpoint Marker
                              val mid = roadWaypoints[roadWaypoints.size / 2]
                              map.addMarker(
                                  MarkerOptions()
                                      .position(mid)
                                      .title("Livreur")
                                      .icon(iconFactory.fromBitmap(bikePin))
                              )
                          }
                      }
                  }
              )
          }

