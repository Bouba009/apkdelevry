          @Composable
          fun BeautifulVoyagerRoadMap(
              centerLat: Double,
              centerLng: Double,
              destinationLat: Double,
              destinationLng: Double,
              modifier: Modifier = Modifier
          ) {
              val context = LocalContext.current
              var roadWaypoints by remember { mutableStateOf<List<GeoPoint>>(emptyList()) }
              var useOsmTileLayer by remember { mutableStateOf(false) }

              val infiniteTransition = rememberInfiniteTransition(label = "MarkerPulse")
              val animatedScale by infiniteTransition.animateFloat(
                  initialValue = 0.90f,
                  targetValue = 1.12f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(1200, easing = FastOutSlowInEasing),
                      repeatMode = RepeatMode.Reverse
                  ),
                  label = "MarkerScale"
              )

              LaunchedEffect(centerLat, centerLng, destinationLat, destinationLng) {
                  roadWaypoints = MapUtils.fetchOsrmRoadPath(centerLat, centerLng, destinationLat, destinationLng)
              }

              Box(modifier = modifier.fillMaxSize()) {
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          MapView(ctx).apply {
                              setTileSource(if (useOsmTileLayer) MapUtils.OsmStandardSource else MapUtils.CartoVoyagerPublicSource)
                              setMultiTouchControls(true)
                              isTilesScaledToDpi = true
                              controller.setZoom(15.2)
                              controller.setCenter(GeoPoint(centerLat, centerLng))
                          }
                      },
                      update = { mapView ->
                          mapView.setTileSource(if (useOsmTileLayer) MapUtils.OsmStandardSource else MapUtils.CartoVoyagerPublicSource)
                          mapView.overlays.clear()

                          val userPin = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#1E2024"), "🏠")
                          val storePin = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF5E00"), "🍴")
                          val bikePin = MapUtils.createCustomPin(
                              context,
                              android.graphics.Color.parseColor("#FF5E00"),
                              "🛵",
                              (114 * animatedScale).toInt().coerceAtLeast(80)
                          )

                          val userMarker = Marker(mapView).apply {
                              position = GeoPoint(centerLat, centerLng)
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = "Vous"
                              icon = userPin
                          }
                          mapView.overlays.add(userMarker)

                          val storeMarker = Marker(mapView).apply {
                              position = GeoPoint(destinationLat, destinationLng)
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = "Magasin"
                              icon = storePin
                          }
                          mapView.overlays.add(storeMarker)

                          if (roadWaypoints.isNotEmpty()) {
                              val glowPolyline = Polyline(mapView).apply {
                                  roadWaypoints.forEach { addPoint(it) }
                                  outlinePaint.color = android.graphics.Color.parseColor("#40FF5E00")
                                  outlinePaint.strokeWidth = 22f
                              }
                              val corePolyline = Polyline(mapView).apply {
                                  roadWaypoints.forEach { addPoint(it) }
                                  outlinePaint.color = android.graphics.Color.parseColor("#FF5E00")
                                  outlinePaint.strokeWidth = 11f
                              }
                              mapView.overlays.add(glowPolyline)
                              mapView.overlays.add(corePolyline)

                              val midPoint = roadWaypoints[roadWaypoints.size / 2]
                              val bikeMarker = Marker(mapView).apply {
                                  position = midPoint
                                  setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                                  title = "Livreur"
                                  icon = bikePin
                              }
                              mapView.overlays.add(bikeMarker)
                          }
                          mapView.invalidate()
                      }
                  )

                  IconButton(
                      onClick = { useOsmTileLayer = !useOsmTileLayer },
                      modifier = Modifier
                          .align(Alignment.TopEnd)
                          .padding(top = 100.dp, end = 16.dp)
                          .size(40.dp)
                          .clip(CircleShape)
                          .background(Color.White)
                          .shadow(4.dp, CircleShape)
                  ) {
                      Icon(Icons.Default.Layers, contentDescription = "Layers", tint = QdOrange)
                  }
              }
          }

