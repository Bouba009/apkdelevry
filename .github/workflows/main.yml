          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/MapUtils.kt
          package com.elaffroun.delivery

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.drawable.BitmapDrawable
          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.osmdroid.util.GeoPoint
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          object MapUtils {
              fun createCustomPinDrawable(
                  context: Context,
                  bgColor: Int,
                  symbol: String,
                  sizePx: Int = 110
              ): BitmapDrawable {
                  val bitmap = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)

                  val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.parseColor("#40000000")
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f + 4f, sizePx / 2f - 6f, shadowPaint)

                  val outerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f, sizePx / 2f - 6f, outerCirclePaint)

                  val innerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = bgColor
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f, sizePx / 2f - 14f, innerCirclePaint)

                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                      textSize = sizePx * 0.42f
                      textAlign = Paint.Align.CENTER
                  }
                  val yPos = (canvas.height / 2f) - ((textPaint.descent() + textPaint.ascent()) / 2f)
                  canvas.drawText(symbol, sizePx / 2f, yPos, textPaint)

                  return BitmapDrawable(context.resources, bitmap)
              }

              suspend fun fetchOsrmRoadPath(
                  startLat: Double, startLng: Double,
                  endLat: Double, endLng: Double
              ): List<GeoPoint> = withContext(Dispatchers.IO) {
                  val points = mutableListOf<GeoPoint>()
                  try {
                      val urlString = "https://router.project-osrm.org/route/v1/driving/$startLng,$startLat;$endLng,$endLat?overview=full&geometries=geojson"
                      val url = URL(urlString)
                      val connection = url.openConnection() as HttpURLConnection
                      connection.connectTimeout = 6000
                      connection.readTimeout = 6000
                      connection.requestMethod = "GET"

                      if (connection.responseCode == HttpURLConnection.HTTP_OK) {
                          val reader = BufferedReader(InputStreamReader(connection.inputStream))
                          val response = reader.use { it.readText() }
                          val json = JSONObject(response)
                          val routes = json.optJSONArray("routes")
                          if (routes != null && routes.length() > 0) {
                              val geometry = routes.getJSONObject(0).getJSONObject("geometry")
                              val coords = geometry.getJSONArray("coordinates")
                              for (i in 0 until coords.length()) {
                                  val pair = coords.getJSONArray(i)
                                  val lng = pair.getDouble(0)
                                  val lat = pair.getDouble(1)
                                  points.add(GeoPoint(lat, lng))
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // Fallback straight path
                      points.clear()
                      points.add(GeoPoint(startLat, startLng))
                      points.add(GeoPoint(endLat, endLng))
                  }

                  if (points.isEmpty()) {
                      points.add(GeoPoint(startLat, startLng))
                      points.add(GeoPoint(endLat, endLng))
                  }
                  points
              }
          }
