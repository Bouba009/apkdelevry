          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/MapUtils.kt
          package com.elaffroun.delivery

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.drawable.BitmapDrawable
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.GeoPoint
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          object MapUtils {
              val FreeOfficialMapnikTileSource = TileSourceFactory.MAPNIK

              fun createCustomPin(context: Context, bgColor: Int, symbol: String, sizePx: Int = 114): BitmapDrawable {
                  val bitmap = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)

                  val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = android.graphics.Color.parseColor("#45000000") }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f + 4f, sizePx / 2f - 4f, shadowPaint)

                  val outerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = android.graphics.Color.WHITE }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 6f, outerCirclePaint)

                  val innerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = bgColor }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 14f, innerCirclePaint)

                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                      textSize = sizePx * 0.44f
                      textAlign = Paint.Align.CENTER
                  }
                  val yPos = (canvas.height / 2f - 4f) - ((textPaint.descent() + textPaint.ascent()) / 2f)
                  canvas.drawText(symbol, sizePx / 2f, yPos, textPaint)

                  return BitmapDrawable(context.resources, bitmap)
              }

              suspend fun fetchOsrmRoadPath(startLat: Double, startLng: Double, endLat: Double, endLng: Double): List<GeoPoint> = withContext(Dispatchers.IO) {
                  val servers = listOf("https://router.project-osrm.org", "https://routing.openstreetmap.de/routed-car")
                  for (baseUrl in servers) {
                      val points = mutableListOf<GeoPoint>()
                      try {
                          val url = URL("$baseUrl/route/v1/driving/$startLng,$startLat;$endLng,$endLat?overview=full&geometries=geojson")
                          val connection = url.openConnection() as HttpURLConnection
                          connection.connectTimeout = 7000
                          connection.readTimeout = 7000
                          connection.requestMethod = "GET"
                          connection.setRequestProperty("User-Agent", "QuickDeliver-App/18.0")

                          if (connection.responseCode == HttpURLConnection.HTTP_OK) {
                              val response = BufferedReader(InputStreamReader(connection.inputStream)).use { it.readText() }
                              val json = JSONObject(response)
                              val routes = json.optJSONArray("routes")
                              if (routes != null && routes.length() > 0) {
                                  val coords = routes.getJSONObject(0).getJSONObject("geometry").getJSONArray("coordinates")
                                  for (i in 0 until coords.length()) {
                                      val pair = coords.getJSONArray(i)
                                      points.add(GeoPoint(pair.getDouble(1), pair.getDouble(0)))
                                  }
                                  if (points.isNotEmpty()) return@withContext points
                              }
                          }
                      } catch (e: Exception) {
                          // Handled
                      }
                  }
                  listOf(GeoPoint(startLat, startLng), GeoPoint((startLat + endLat) / 2.0, (startLng + endLng) / 2.0), GeoPoint(endLat, endLng))
              }
          }
