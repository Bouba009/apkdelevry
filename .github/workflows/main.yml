          @Composable
          fun AuthScreen(
              role: UserRole,
              onLoginSuccess: (name: String, phone: String, uid: String) -> Unit,
              onCancel: () -> Unit
          ) {
              val context = LocalContext.current
              val auth = Firebase.auth
              val db = Firebase.firestore
              val scope = rememberCoroutineScope()

              var isRegisterMode by remember { mutableStateOf(false) }
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var confirmPassword by remember { mutableStateOf("") }
              var termsAccepted by remember { mutableStateOf(false) }
              var ageAccepted by remember { mutableStateOf(false) }
              var errorMessage by remember { mutableStateOf("") }
              var isLoading by remember { mutableStateOf(false) }

              // Google Sign-In setup
              val googleSignInLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      val task = GoogleSignIn.getSignedInAccountFromIntent(result.data)
                      try {
                          val account = task.getResult(ApiException::class.java)
                          val idToken = account.idToken
                          if (idToken != null) {
                              isLoading = true
                              val credential = GoogleAuthProvider.getCredential(idToken, null)
                              auth.signInWithCredential(credential)
                                  .addOnSuccessListener { authResult ->
                                      val user = authResult.user
                                      val uid = user?.uid ?: ""
                                      val userMap = hashMapOf(
                                          "name" to (account.displayName ?: "زبون Google"),
                                          "email" to (account.email ?: ""),
                                          "phoneNumber" to "",
                                          "role" to "customer",
                                          "blocked" to false,
                                          "approved" to true,
                                          "debt" to 0
                                      )
                                      db.collection("users").document(uid).set(userMap)
                                          .addOnSuccessListener {
                                              isLoading = false
                                              onLoginSuccess(account.displayName ?: "زبون Google", "", uid)
                                          }
                                  }
                                  .addOnFailureListener { e ->
                                      isLoading = false
                                      errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول بـ Google"
                                  }
                          }
                      } catch (e: Exception) {
                          errorMessage = "فشل المصادقة عبر Google"
                      }
                  }
              }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  item {
                      Text(
                          text = if (role == UserRole.ADMIN) "تسجيل دخول الإدارة"
                          else if (isRegisterMode) "إنشاء حساب جديد" else "تسجيل الدخول",
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Black,
                          color = PrimaryColor
                      )

                      Text(
                          text = when (role) {
                              UserRole.CUSTOMER -> "بوابة الزبائن - تسجيل سريع وآمن"
                              UserRole.DRIVER -> "بوابة عمال التوصيل"
                              UserRole.ADMIN -> "تحقق رقمي محمي للإدارة"
                          },
                          fontSize = 12.sp,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f),
                          modifier = Modifier.padding(top = 4.dp, bottom = 16.dp)
                      )

                      if (role == UserRole.CUSTOMER) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              OutlinedButton(
                                  onClick = {
                                      val gso = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                                          .requestIdToken(context.getString(R.string.default_web_client_id))
                                          .requestEmail()
                                          .build()
                                      val client = GoogleSignIn.getClient(context, gso)
                                      googleSignInLauncher.launch(client.signInIntent)
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Icon(imageVector = Icons.Default.Mail, contentDescription = null, tint = AccentRed)
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text("Google", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }

                              OutlinedButton(
                                  onClick = {
                                      val provider = OAuthProvider.newBuilder("facebook.com")
                                      val activity = context as Activity
                                      auth.startActivityForSignInWithProvider(activity, provider.build())
                                          .addOnSuccessListener { authResult ->
                                              val user = authResult.user
                                              val uid = user?.uid ?: ""
                                              val fbName = user?.displayName ?: "زبون Facebook"
                                              onLoginSuccess(fbName, "", uid)
                                          }
                                          .addOnFailureListener { e ->
                                              errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول بـ Facebook"
                                          }
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Icon(imageVector = Icons.Default.Share, contentDescription = null, tint = AccentBlue)
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text("Facebook", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }

                          Spacer(modifier = Modifier.height(14.dp))

                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Divider(modifier = Modifier.weight(1f))
                              Text(
                                  text = " أو عبر البريد الإلكتروني ",
                                  fontSize = 11.sp,
                                  color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.5f)
                              )
                              Divider(modifier = Modifier.weight(1f))
                          }

                          Spacer(modifier = Modifier.height(14.dp))
                      }

                      if (isRegisterMode) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("الاسم الكامل") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = phone,
                              onValueChange = { phone = it },
                              label = { Text("رقم الهاتف") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                      }

                      OutlinedTextField(
                          value = email,
                          onValueChange = { email = it },
                          label = { Text(if (role == UserRole.ADMIN) "اسم المستخدم" else "البريد الإلكتروني") },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedTextField(
                          value = password,
                          onValueChange = { password = it },
                          label = { Text("كلمة المرور") },
                          visualTransformation = PasswordVisualTransformation(),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      if (isRegisterMode) {
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = confirmPassword,
                              onValueChange = { confirmPassword = it },
                              label = { Text("تأكيد كلمة المرور") },
                              visualTransformation = PasswordVisualTransformation(),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(14.dp))

                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Checkbox(checked = termsAccepted, onCheckedChange = { termsAccepted = it })
                              Text(
                                  text = "أوافق على سياسة الاستخدام والأسعار (50 دج / 500م)",
                                  fontSize = 11.sp,
                                  lineHeight = 16.sp
                              )
                          }

                          if (role == UserRole.DRIVER) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Checkbox(checked = ageAccepted, onCheckedChange = { ageAccepted = it })
                                  Text(
                                      text = "أصرح أن عمري فوق 18 سنة وألتزم بسداد ديون المنصة",
                                      fontSize = 11.sp,
                                      lineHeight = 16.sp
                                  )
                              }
                          }
                      }

                      if (errorMessage.isNotEmpty()) {
                          Text(
                              text = errorMessage,
                              color = AccentRed,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(vertical = 8.dp)
                          )
                      }

                      Spacer(modifier = Modifier.height(18.dp))

                      Button(
                          onClick = {
                              errorMessage = ""
                              if (role == UserRole.ADMIN) {
                                  if (email == "admin009" && password == "abobob123") {
                                      onLoginSuccess("المسؤول العام", "0555000000", "admin_static_uid")
                                  } else {
                                      errorMessage = "بيانات الإدارة غير صحيحة"
                                  }
                                  return@Button
                              }

                              if (isRegisterMode) {
                                  if (name.isBlank() || phone.isBlank() || email.isBlank() || password.isBlank()) {
                                      errorMessage = "يرجى ملء جميع الحقول المطلوبة"
                                      return@Button
                                  }
                                  if (password != confirmPassword) {
                                      errorMessage = "كلمتا المرور غير متطابقتين"
                                      return@Button
                                  }
                                  if (!termsAccepted) {
                                      errorMessage = "يجب الموافقة على شروط الاستخدام"
                                      return@Button
                                  }
                                  if (role == UserRole.DRIVER && !ageAccepted) {
                                      errorMessage = "يجب تأكيد السن فوق 18 سنة"
                                      return@Button
                                  }

                                  isLoading = true
                                  auth.createUserWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          val userMap = hashMapOf(
                                              "name" to name.trim(),
                                              "phoneNumber" to phone.trim(),
                                              "email" to email.trim(),
                                              "role" to (if (role == UserRole.DRIVER) "driver" else "customer"),
                                              "blocked" to false,
                                              "approved" to (role != UserRole.DRIVER),
                                              "debt" to 0
                                          )
                                          db.collection("users").document(uid).set(userMap)
                                              .addOnSuccessListener {
                                                  isLoading = false
                                                  onLoginSuccess(name.trim(), phone.trim(), uid)
                                              }
                                              .addOnFailureListener { e ->
                                                  isLoading = false
                                                  errorMessage = e.localizedMessage ?: "حدث خطأ أثناء حفظ الملف"
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "فشل إنشاء الحساب"
                                      }
                              } else {
                                  if (email.isBlank() || password.isBlank()) {
                                      errorMessage = "يرجى إدخال البريد وكلمة المرور"
                                      return@Button
                                  }
                                  isLoading = true
                                  auth.signInWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          db.collection("users").document(uid).get()
                                              .addOnSuccessListener { snap ->
                                                  isLoading = false
                                                  val fetchedName = snap.getString("name") ?: "مستخدم"
                                                  val fetchedPhone = snap.getString("phoneNumber") ?: ""
                                                  onLoginSuccess(fetchedName, fetchedPhone, uid)
                                              }
                                              .addOnFailureListener {
                                                  isLoading = false
                                                  onLoginSuccess("مستخدم", "", uid)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول"
                                      }
                              }
                          },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(50.dp),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = PrimaryColor),
                          enabled = !isLoading
                      ) {
                          if (isLoading) {
                              CircularProgressIndicator(color = Color.White, modifier = Modifier.size(24.dp))
                          } else {
                              Text(
                                  text = if (isRegisterMode) "تسجيل حساب جديد" else "تسجيل الدخول",
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 14.sp
                              )
                          }
                      }

                      if (role != UserRole.ADMIN) {
                          TextButton(onClick = { isRegisterMode = !isRegisterMode }) {
                              Text(
                                  text = if (isRegisterMode) "لديك حساب بالفعل؟ سجل دخولك" else "ليس لديك حساب؟ أنشئ حسابك الآن",
                                  fontSize = 12.sp,
                                  color = PrimaryColor
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedButton(
                          onClick = onCancel,
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Text(text = "إلغاء والعودة للرئيسية", fontSize = 13.sp)
                      }
                  }
              }
          }

          @Composable
          fun CustomerDashboard(
              userName: String,
              userLat: Double,
              userLng: Double,
              activeOrders: List<Order>,
              onOpenNewOrder: () -> Unit,
              onOpenHistory: () -> Unit,
              onOpenChat: (String) -> Unit,
              onConfirmDelivered: (Order) -> Unit,
