          @Composable
          fun AdminPanelScreen(
              stores: List<StoreItem>,
              orders: List<Order>,
              onAddStore: (name: String, lat: Double, lng: Double) -> Unit,
              onBackToHome: () -> Unit
          ) {
              var newStoreName by remember { mutableStateOf("") }
              var newStoreLat by remember { mutableStateOf("36.4686") }
              var newStoreLng by remember { mutableStateOf("2.6288") }

              val totalVolume = orders.filter { it.status == "completed" }.sumOf { it.price }
              val commission = (totalVolume * 0.20).roundToInt()

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text(text = "لوحة الإدارة والرقابة 🛡️", fontWeight = FontWeight.Black, fontSize = 18.sp, color = PrimaryColor)
                              Text(text = "إدارة المتاجر وحساب العمولات", fontSize = 11.sp, color = Color.Gray)
                          }
                          Button(
                              onClick = onBackToHome,
                              shape = RoundedCornerShape(10.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color.Gray.copy(alpha = 0.2f))
                          ) {
                              Text(text = "خروج", fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurface)
                          }
                      }
                  }

                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          StatCard(
                              title = "إجمالي التداولات",
                              value = "$totalVolume دج",
                              color = PrimaryColor,
                              icon = Icons.Default.TrendingUp,
                              modifier = Modifier.weight(1f)
                          )
                          StatCard(
                              title = "عمولة التطبيق (20%)",
                              value = "$commission دج",
                              color = AccentGreen,
                              icon = Icons.Default.PieChart,
                              modifier = Modifier.weight(1f)
                          )
                          StatCard(
                              title = "الطلبات المكتملة",
                              value = "${orders.count { it.status == "completed" }}",
                              color = AccentBlue,
                              icon = Icons.Default.ShoppingBag,
                              modifier = Modifier.weight(1f)
                          )
                      }
                  }

                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(16.dp),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text(text = "إضافة متجر جديد لقائمة العفرون", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Spacer(modifier = Modifier.height(10.dp))
                              OutlinedTextField(
                                  value = newStoreName,
                                  onValueChange = { newStoreName = it },
                                  label = { Text("اسم المتجر أو المطعم") },
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(10.dp)
                              )
                              Spacer(modifier = Modifier.height(8.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  OutlinedTextField(
                                      value = newStoreLat,
                                      onValueChange = { newStoreLat = it },
                                      label = { Text("Latitude") },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp)
                                  )
                                  OutlinedTextField(
                                      value = newStoreLng,
                                      onValueChange = { newStoreLng = it },
                                      label = { Text("Longitude") },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp)
                                  )
                              }
                              Spacer(modifier = Modifier.height(12.dp))
                              Button(
                                  onClick = {
                                      val lat = newStoreLat.toDoubleOrNull() ?: 36.4686
                                      val lng = newStoreLng.toDoubleOrNull() ?: 2.6288
                                      if (newStoreName.isNotBlank()) {
                                          onAddStore(newStoreName.trim(), lat, lng)
                                          newStoreName = ""
                                      }
                                  },
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(10.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = PrimaryColor)
                              ) {
                                  Text(text = "حفظ المتجر", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              }
                          }
                      }
                  }

                  item {
                      Text(text = "قائمة المتاجر المسجلة حالياً:", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                  }

                  items(stores) { s ->
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(text = s.name, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              Text(text = "${s.lat}, ${s.lng}", fontSize = 10.sp, color = Color.Gray)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
