          import androidx.compose.ui.graphics.drawscope.Fill
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import coil.compose.AsyncImage

          const val UNIFIED_BRAND_IMAGE_URL = "https://i.ibb.co/cVrbF2M/splash.png"

          @Composable
          fun QuickDeliverAppLogo(size: Dp = 46.dp) {
              AsyncImage(
                  model = UNIFIED_BRAND_IMAGE_URL,
                  contentDescription = "QuickDeliver Logo",
                  contentScale = ContentScale.Fit,
                  modifier = Modifier
                      .size(size)
                      .clip(RoundedCornerShape(size * 0.24f))
              )
          }

          @Composable
          fun GoogleOfficialLogo(size: Dp = 22.dp) {
              Canvas(modifier = Modifier.size(size)) {
                  val w = this.size.width
                  val h = this.size.height
                  val center = Offset(w / 2f, h / 2f)
                  val radius = w * 0.44f

                  drawArc(color = Color(0xFFEA4335.toInt()), startAngle = 180f, sweepAngle = 90f, useCenter = true, size = Size(radius * 2f, radius * 2f), topLeft = Offset(center.x - radius, center.y - radius))
                  drawArc(color = Color(0xFFFBBC05.toInt()), startAngle = 90f, sweepAngle = 90f, useCenter = true, size = Size(radius * 2f, radius * 2f), topLeft = Offset(center.x - radius, center.y - radius))
                  drawArc(color = Color(0xFF34A853.toInt()), startAngle = 0f, sweepAngle = 90f, useCenter = true, size = Size(radius * 2f, radius * 2f), topLeft = Offset(center.x - radius, center.y - radius))
                  drawArc(color = Color(0xFF4285F4.toInt()), startAngle = 270f, sweepAngle = 90f, useCenter = true, size = Size(radius * 2f, radius * 2f), topLeft = Offset(center.x - radius, center.y - radius))

                  drawCircle(color = Color.White, radius = radius * 0.58f, center = center)
                  drawRect(color = Color(0xFF4285F4.toInt()), topLeft = Offset(center.x, center.y - (radius * 0.22f)), size = Size(radius * 0.95f, radius * 0.44f))
              }
          }

          @Composable
          fun FacebookOfficialLogo(size: Dp = 22.dp) {
              Canvas(modifier = Modifier.size(size)) {
                  val w = this.size.width
                  val h = this.size.height
                  drawCircle(color = Color(0xFF1877F2.toInt()), radius = w / 2f)

                  val path = Path().apply {
                      moveTo(w * 0.58f, h * 0.90f)
                      lineTo(w * 0.58f, h * 0.54f)
                      lineTo(w * 0.70f, h * 0.54f)
                      lineTo(w * 0.72f, h * 0.40f)
                      lineTo(w * 0.58f, h * 0.40f)
                      lineTo(w * 0.58f, h * 0.31f)
                      cubicTo(w * 0.58f, h * 0.24f, w * 0.61f, h * 0.20f, w * 0.72f, h * 0.20f)
                      lineTo(w * 0.72f, h * 0.08f)
                      cubicTo(w * 0.64f, h * 0.07f, w * 0.54f, h * 0.07f, w * 0.47f, h * 0.14f)
                      cubicTo(w * 0.40f, h * 0.20f, w * 0.42f, h * 0.29f, w * 0.42f, h * 0.40f)
                      lineTo(w * 0.32f, h * 0.40f)
                      lineTo(w * 0.32f, h * 0.54f)
                      lineTo(w * 0.42f, h * 0.54f)
                      lineTo(w * 0.42f, h * 0.90f)
                      close()
                  }
                  drawPath(path = path, color = Color.White, style = Fill)
              }
          }
          EOF

