              val firebaseBom = platform("com.google.firebase:firebase-bom:32.8.0")
              implementation(firebaseBom)
              implementation("com.google.firebase:firebase-auth-ktx")
              implementation("com.google.firebase:firebase-firestore-ktx")

              implementation("com.google.android.gms:play-services-auth:21.0.0")
              implementation("com.google.android.gms:play-services-location:21.2.0")
              implementation("org.osmdroid:osmdroid-android:6.1.18")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

      - name: Scaffold Manifest and Receiver
        run: |
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.QuickDeliver">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:theme="@style/Theme.QuickDeliver">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".NotificationActionReceiver" android:exported="false" />
              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/java/com/elaffroun/delivery
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/NotificationActionReceiver.kt
          package com.elaffroun.delivery

          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.google.firebase.auth.ktx.auth
          import com.google.firebase.firestore.ktx.firestore
          import com.google.firebase.ktx.Firebase

          class NotificationActionReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val orderId = intent.getStringExtra("order_id") ?: return
                  val action = intent.action
                  val notificationId = intent.getIntExtra("notification_id", 1001)

                  val notificationManager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  notificationManager.cancel(notificationId)

                  if (action == "ACTION_ACCEPT_ORDER") {
                      val auth = Firebase.auth
                      val db = Firebase.firestore
                      val currentUid = auth.currentUser?.uid ?: ""

                      if (currentUid.isNotEmpty()) {
                          db.collection("users").document(currentUid).get().addOnSuccessListener { doc ->
                              val dName = doc.getString("name") ?: "عامل توصيل معتمد"
                              val dPhone = doc.getString("phoneNumber") ?: ""
                              db.collection("orders").document(orderId).update(
                                  mapOf(
                                      "status" to "accepted",
                                      "driverName" to dName,
                                      "driverPhone" to dPhone
                                  )
                              )
                          }
                      }

                      val launchIntent = Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("open_order_id", orderId)
                      }
                      context.startActivity(launchIntent)
                  }
              }
          }
          EOF

      - name: Scaffold Soft Audio and MapUtils
        run: |
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/SoundHelper.kt
          package com.elaffroun.delivery

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlin.math.exp
          import kotlin.math.sin

          object SoundHelper {
              fun triggerBackgroundNotification(
                  context: Context,
                  orderId: String,
                  restaurant: String,
                  goodsPrice: Int,
                  deliveryFee: Int,
                  distanceKm: Double,
                  address: String
              ) {
                  val channelId = "quickdeliver_channel_urgent"
                  val notificationManager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "طلب توصيل متاح",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "إشعارات الطلبات لعمال التوصيل"
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 300, 150, 300)
                      }
                      notificationManager.createNotificationChannel(channel)
                  }

                  val notifId = (orderId.hashCode() and 0xfffffff)

                  val contentIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      putExtra("open_order_id", orderId)
                  }
                  val contentPendingIntent = PendingIntent.getActivity(
                      context, notifId, contentIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val acceptIntent = Intent(context, NotificationActionReceiver::class.java).apply {
                      action = "ACTION_ACCEPT_ORDER"
                      putExtra("order_id", orderId)
                      putExtra("notification_id", notifId)
                  }
                  val acceptPendingIntent = PendingIntent.getBroadcast(
                      context, notifId + 1, acceptIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val cancelIntent = Intent(context, NotificationActionReceiver::class.java).apply {
                      action = "ACTION_DISMISS_ORDER"
                      putExtra("order_id", orderId)
                      putExtra("notification_id", notifId)
                  }
                  val cancelPendingIntent = PendingIntent.getBroadcast(
                      context, notifId + 2, cancelIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val totalAmount = goodsPrice + deliveryFee
                  val distanceFormatted = "%.1f".format(distanceKm)
                  val detailedText = "المتجر: $restaurant\nالوجهة: $address\nالمسافة: $distanceFormatted كم\nسعر التوصيل: $deliveryFee DA | الطلبات: $goodsPrice DA\nالمجموع: $totalAmount DA"

                  val notification = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("🛵 طلب توصيل جديد • ربحك: $deliveryFee DA")
                      .setContentText("$restaurant ($distanceFormatted كم)")
                      .setStyle(NotificationCompat.BigTextStyle().bigText(detailedText))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setContentIntent(contentPendingIntent)
                      .setAutoCancel(true)
                      .addAction(android.R.drawable.checkbox_on_background, "✔ قبول الطلب (أخضر)", acceptPendingIntent)
                      .addAction(android.R.drawable.ic_delete, "✖ رفض الطلب (أحمر)", cancelPendingIntent)
                      .build()

                  notificationManager.notify(notifId, notification)
              }

              fun playSoftPleasantTone() {
                  CoroutineScope(Dispatchers.IO).launch {
                      playHarmonicChime(523.25, 200)
                      delay(60)
                      playHarmonicChime(659.25, 200)
                      delay(60)
                      playHarmonicChime(783.99, 220)
                      delay(80)
                      playHarmonicChime(1046.50, 450)
                  }
              }

              fun playArrivalTone() {
                  CoroutineScope(Dispatchers.IO).launch {
                      playHarmonicChime(587.33, 150)
                      delay(40)
                      playHarmonicChime(880.00, 300)
                  }
              }

              private fun playHarmonicChime(freqOfTone: Double, durationMs: Int) {
                  try {
                      val sampleRate = 44100
                      val numSamples = durationMs * sampleRate / 1000
                      val soundData = DoubleArray(numSamples)
                      val generatedSnd = ByteArray(2 * numSamples)

                      for (i in 0 until numSamples) {
                          val t = i.toDouble() / sampleRate
                          val decay = exp(-2.8 * t / (durationMs / 1000.0))
                          val wave = sin(2.0 * Math.PI * freqOfTone * t) + 0.15 * sin(4.0 * Math.PI * freqOfTone * t)
                          soundData[i] = wave * decay * 0.65
                      }

                      var idx = 0
                      for (dVal in soundData) {
                          val valShort = (dVal.coerceIn(-1.0, 1.0) * 32767).toInt().toShort()
                          generatedSnd[idx++] = (valShort.toInt() and 0x00ff).toByte()
                          generatedSnd[idx++] = ((valShort.toInt() and 0xff00) ushr 8).toByte()
                      }

                      val audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build()
                          )
                          .setBufferSizeInBytes(generatedSnd.size)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      audioTrack.write(generatedSnd, 0, generatedSnd.size)
                      audioTrack.play()
                  } catch (e: Exception) {
                      // Handled
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/MapUtils.kt
          package com.elaffroun.delivery

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.drawable.BitmapDrawable
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.GeoPoint
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          object MapUtils {
              val FreeOfficialMapnikTileSource = TileSourceFactory.MAPNIK

              fun createCustomPin(context: Context, bgColor: Int, symbol: String, sizePx: Int = 114): BitmapDrawable {
                  val bitmap = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)

                  val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = android.graphics.Color.parseColor("#40000000") }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f + 4f, sizePx / 2f - 4f, shadowPaint)

                  val outerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = android.graphics.Color.WHITE }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 6f, outerCirclePaint)

                  val innerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = bgColor }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 14f, innerCirclePaint)

                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                      textSize = sizePx * 0.44f
                      textAlign = Paint.Align.CENTER
                  }
                  val yPos = (canvas.height / 2f - 4f) - ((textPaint.descent() + textPaint.ascent()) / 2f)
                  canvas.drawText(symbol, sizePx / 2f, yPos, textPaint)

                  return BitmapDrawable(context.resources, bitmap)
              }

              suspend fun fetchOsrmRoadPath(startLat: Double, startLng: Double, endLat: Double, endLng: Double): List<GeoPoint> = withContext(Dispatchers.IO) {
                  val servers = listOf("https://router.project-osrm.org", "https://routing.openstreetmap.de/routed-car")
                  for (baseUrl in servers) {
                      val points = mutableListOf<GeoPoint>()
                      try {
                          val url = URL("$baseUrl/route/v1/driving/$startLng,$startLat;$endLng,$endLat?overview=full&geometries=geojson")
                          val connection = url.openConnection() as HttpURLConnection
                          connection.connectTimeout = 7000
                          connection.readTimeout = 7000
                          connection.requestMethod = "GET"
                          connection.setRequestProperty("User-Agent", "QuickDeliver-App/22.0")

                          if (connection.responseCode == HttpURLConnection.HTTP_OK) {
                              val response = BufferedReader(InputStreamReader(connection.inputStream)).use { it.readText() }
                              val json = JSONObject(response)
                              val routes = json.optJSONArray("routes")
                              if (routes != null && routes.length() > 0) {
                                  val coords = routes.getJSONObject(0).getJSONObject("geometry").getJSONArray("coordinates")
                                  for (i in 0 until coords.length()) {
                                      val pair = coords.getJSONArray(i)
                                      points.add(GeoPoint(pair.getDouble(1), pair.getDouble(0)))
                                  }
                                  if (points.isNotEmpty()) return@withContext points
                              }
                          }
                      } catch (e: Exception) {
                          // Handled
                      }
                  }
                  listOf(GeoPoint(startLat, startLng), GeoPoint((startLat + endLat) / 2.0, (startLng + endLng) / 2.0), GeoPoint(endLat, endLng))
              }
          }
          EOF

      - name: Scaffold BrandLogos and LanguageManager
        run: |
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/BrandLogos.kt
          package com.elaffroun.delivery

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
