          @Composable
          fun FilterTab(label: String, selected: Boolean, onClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) { onClick() }
              ) {
                  Text(
                      text = label,
                      fontSize = 13.sp,
                      fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium,
                      color = if (selected) QdOrange else QdTextMuted
                  )
                  Spacer(modifier = Modifier.height(6.dp))
                  Box(
                      modifier = Modifier
                          .width(36.dp)
                          .height(3.dp)
                          .background(if (selected) QdOrange else Color.Transparent, RoundedCornerShape(2.dp))
                  )
              }
          }

