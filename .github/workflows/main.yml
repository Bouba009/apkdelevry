          // -------------------------------------------------------------
          // 2. SCREEN: AUTH FLOW (REAL GOOGLE & FACEBOOK LOGIN)
          // -------------------------------------------------------------
          @Composable
          fun AuthScreen(
              userType: AuthUserType,
              onSuccess: (name: String, phone: String, uid: String, isDriver: Boolean) -> Unit,
              onCancel: () -> Unit
          ) {
              val context = LocalContext.current
              val auth = Firebase.auth
              val db = Firebase.firestore

              var isRegisterMode by remember { mutableStateOf(userType == AuthUserType.DRIVER) }
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var termsAccepted by remember { mutableStateOf(false) }
              var ageAccepted by remember { mutableStateOf(false) }
              var errorMessage by remember { mutableStateOf("") }
              var isLoading by remember { mutableStateOf(false) }

              // Genuine Google Sign-In with real Firebase credential verification
              val googleSignInLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      val task = GoogleSignIn.getSignedInAccountFromIntent(result.data)
                      try {
                          val account = task.getResult(ApiException::class.java)
                          val idToken = account.idToken
                          if (idToken != null) {
                              isLoading = true
                              val credential = GoogleAuthProvider.getCredential(idToken, null)
                              auth.signInWithCredential(credential)
                                  .addOnSuccessListener { authResult ->
                                      val user = authResult.user
                                      val uid = user?.uid ?: ""
                                      val userMap = hashMapOf(
                                          "name" to (account.displayName ?: "زبون Google"),
                                          "email" to (account.email ?: ""),
                                          "phoneNumber" to "",
                                          "role" to "customer",
                                          "debt" to 0
                                      )
                                      db.collection("users").document(uid).set(userMap)
                                          .addOnSuccessListener {
                                              isLoading = false
                                              onSuccess(account.displayName ?: "زبون Google", "", uid, false)
                                          }
                                  }
                                  .addOnFailureListener { e ->
                                      isLoading = false
                                      errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول عبر Google"
                                  }
                          }
                      } catch (e: Exception) {
                          errorMessage = "فشل التحقق من حساب Google"
                      }
                  }
              }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  item {
                      Text(
                          text = if (isRegisterMode) "Créer un compte" else "Connexion",
                          fontSize = 24.sp,
                          fontWeight = FontWeight.Black,
                          color = QdOrange
                      )

                      Text(
                          text = when (userType) {
                              AuthUserType.DRIVER -> "بوابة عمال التوصيل - العفرون"
                              AuthUserType.ADMIN -> "بوابة الإدارة المركزية"
                              AuthUserType.CUSTOMER -> "تسجيل دخول حقيقي وآمن"
                          },
                          fontSize = 12.sp,
                          color = QdTextMuted,
                          modifier = Modifier.padding(top = 4.dp, bottom = 20.dp)
                      )

                      if (userType == AuthUserType.CUSTOMER && !isRegisterMode) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              // Real Google Button with Official Multi-Color Logo
                              Button(
                                  onClick = {
                                      val gso = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                                          .requestIdToken(context.getString(R.string.default_web_client_id))
                                          .requestEmail()
                                          .build()
                                      val client = GoogleSignIn.getClient(context, gso)
                                      googleSignInLauncher.launch(client.signInIntent)
                                  },
                                  modifier = Modifier
                                      .weight(1f)
                                      .height(48.dp)
                                      .border(1.dp, QdBorder, RoundedCornerShape(12.dp)),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color.White)
                              ) {
                                  GoogleOfficialIcon(size = 20.dp)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("Google", fontSize = 12.sp, fontWeight = FontWeight.Bold, color = QdTextDark)
                              }

                              // Real Facebook Button with Official Brand Logo
                              Button(
                                  onClick = {
                                      val provider = OAuthProvider.newBuilder("facebook.com")
                                      val activity = context as Activity
                                      auth.startActivityForSignInWithProvider(activity, provider.build())
                                          .addOnSuccessListener { authResult ->
                                              val user = authResult.user
                                              val uid = user?.uid ?: ""
                                              val fbName = user?.displayName ?: "زبون Facebook"
                                              onSuccess(fbName, "", uid, false)
                                          }
                                          .addOnFailureListener { e ->
                                              errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول عبر Facebook"
                                          }
                                  },
                                  modifier = Modifier
                                      .weight(1f)
                                      .height(48.dp)
                                      .border(1.dp, QdBorder, RoundedCornerShape(12.dp)),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color.White)
                              ) {
                                  FacebookOfficialIcon(size = 20.dp)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("Facebook", fontSize = 12.sp, fontWeight = FontWeight.Bold, color = QdTextDark)
                              }
                          }
                          Spacer(modifier = Modifier.height(14.dp))
                          Divider(color = QdBorder)
                          Spacer(modifier = Modifier.height(14.dp))
                      }

                      if (isRegisterMode) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("الاسم الكامل") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = phone,
                              onValueChange = { phone = it },
                              label = { Text("رقم الهاتف") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                      }

                      OutlinedTextField(
                          value = email,
                          onValueChange = { email = it },
                          label = { Text("البريد الإلكتروني") },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedTextField(
                          value = password,
                          onValueChange = { password = it },
                          label = { Text("كلمة المرور") },
                          visualTransformation = PasswordVisualTransformation(),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      if (isRegisterMode) {
                          Spacer(modifier = Modifier.height(12.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = termsAccepted, onCheckedChange = { termsAccepted = it })
                              Text("أوافق على سياسة الاستخدام والأسعار (50 دج / 500م)", fontSize = 11.sp, color = QdTextDark)
                          }
                          if (userType == AuthUserType.DRIVER) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(checked = ageAccepted, onCheckedChange = { ageAccepted = it })
                                  Text("أصرح أن عمري فوق 18 سنة وألتزم بديون المنصة (10دج/كم)", fontSize = 11.sp, color = QdTextDark)
                              }
                          }
                      }

                      if (errorMessage.isNotEmpty()) {
                          Text(errorMessage, color = QdRed, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                      }

                      Spacer(modifier = Modifier.height(18.dp))

                      Button(
                          onClick = {
                              errorMessage = ""
                              if (email.isBlank() || password.isBlank()) {
                                  errorMessage = "يرجى ملء كافة الحقول"
                                  return@Button
                              }
                              isLoading = true
                              val isDriver = (userType == AuthUserType.DRIVER)
                              if (isRegisterMode) {
                                  auth.createUserWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          val userMap = hashMapOf(
                                              "name" to name.trim(),
                                              "phoneNumber" to phone.trim(),
                                              "email" to email.trim(),
                                              "role" to if (isDriver) "driver" else "customer",
                                              "debt" to 0
                                          )
                                          db.collection("users").document(uid).set(userMap)
                                              .addOnSuccessListener {
                                                  isLoading = false
                                                  onSuccess(name.trim(), phone.trim(), uid, isDriver)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "حدث خطأ أثناء التسجيل"
                                      }
                              } else {
                                  auth.signInWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          db.collection("users").document(uid).get()
                                              .addOnSuccessListener { snap ->
                                                  isLoading = false
                                                  val fetchedName = snap.getString("name") ?: "مستخدم"
                                                  val fetchedPhone = snap.getString("phoneNumber") ?: "0555555555"
                                                  val role = snap.getString("role") ?: "customer"
                                                  onSuccess(fetchedName, fetchedPhone, uid, role == "driver")
                                              }
                                              .addOnFailureListener {
                                                  isLoading = false
                                                  onSuccess("مستخدم", "0555555555", uid, false)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول"
                                      }
                              }
                          },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrange),
                          enabled = !isLoading
                      ) {
                          if (isLoading) {
                              CircularProgressIndicator(color = Color.White, modifier = Modifier.size(24.dp))
                          } else {
                              Text(if (isRegisterMode) "S'inscrire" else "Se connecter", fontWeight = FontWeight.Bold, fontSize = 15.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(10.dp))
                      TextButton(onClick = { isRegisterMode = !isRegisterMode }) {
                          Text(if (isRegisterMode) "لديك حساب بالفعل؟ تسجيل الدخول" else "ليس لديك حساب؟ إنشاء حساب جديد", color = QdOrange, fontSize = 12.sp)
                      }
                      OutlinedButton(onClick = onCancel, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp)) {
                          Text("Annuler", color = QdTextDark)
                      }
                  }
              }
          }

          // -------------------------------------------------------------
          // 3. SCREEN: HOME EXPLORE (WORKING SEARCH & DYNAMIC CATEGORIES)
          // -------------------------------------------------------------
          @Composable
          fun HomeScreen(
              selectedCity: String,
              stores: List<StoreModel>,
              searchQuery: String,
              onSearchChange: (String) -> Unit,
              selectedCategory: String,
              onSelectCategory: (String) -> Unit,
              onSelectStore: (StoreModel) -> Unit,
              onOrderBannerClick: () -> Unit
          ) {
              // Real Filtering logic by search and category
              val filteredStores = stores.filter { item ->
                  val matchesCategory = (selectedCategory == "الكل" || item.category == selectedCategory)
                  val matchesSearch = (searchQuery.isBlank() ||
                          item.name.contains(searchQuery, ignoreCase = true) ||
                          item.category.contains(searchQuery, ignoreCase = true))
                  matchesCategory && matchesSearch
              }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(QdBackground)
                      .padding(horizontal = 18.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  item {
                      Spacer(modifier = Modifier.height(8.dp))
                      // Working Search Bar
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp)
                              .clip(RoundedCornerShape(16.dp))
                              .background(Color.White)
                              .border(1.dp, QdBorder, RoundedCornerShape(16.dp))
                              .padding(horizontal = 12.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
