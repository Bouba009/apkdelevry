          package com.elaffroun.delivery

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.drawable.BitmapDrawable
          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.osmdroid.util.GeoPoint
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          object MapUtils {
              fun createCustomPin(
                  context: Context,
                  bgColor: Int,
                  symbol: String,
                  sizePx: Int = 110
              ): BitmapDrawable {
                  val bitmap = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)

                  val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.parseColor("#33000000")
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f + 4f, sizePx / 2f - 4f, shadowPaint)

                  val outerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 6f, outerCirclePaint)

                  val innerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = bgColor
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 14f, innerCirclePaint)

                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                      textSize = sizePx * 0.44f
                      textAlign = Paint.Align.CENTER
                  }
                  val yPos = (canvas.height / 2f - 4f) - ((textPaint.descent() + textPaint.ascent()) / 2f)
                  canvas.drawText(symbol, sizePx / 2f, yPos, textPaint)

                  return BitmapDrawable(context.resources, bitmap)
              }

              suspend fun fetchOsrmRoadPath(
                  startLat: Double, startLng: Double,
                  endLat: Double, endLng: Double
              ): List<GeoPoint> = withContext(Dispatchers.IO) {
                  val servers = listOf(
                      "https://router.project-osrm.org",
                      "https://routing.openstreetmap.de/routed-car"
                  )

                  for (baseUrl in servers) {
                      val points = mutableListOf<GeoPoint>()
                      try {
                          val urlString = "$baseUrl/route/v1/driving/$startLng,$startLat;$endLng,$endLat?overview=full&geometries=geojson"
                          val url = URL(urlString)
                          val connection = url.openConnection() as HttpURLConnection
                          connection.connectTimeout = 7000
                          connection.readTimeout = 7000
                          connection.requestMethod = "GET"
                          connection.setRequestProperty("User-Agent", "QuickDeliver/3.0")

                          if (connection.responseCode == HttpURLConnection.HTTP_OK) {
                              val reader = BufferedReader(InputStreamReader(connection.inputStream))
                              val response = reader.use { it.readText() }
                              val json = JSONObject(response)
                              val routes = json.optJSONArray("routes")
                              if (routes != null && routes.length() > 0) {
                                  val geometry = routes.getJSONObject(0).getJSONObject("geometry")
                                  val coords = geometry.getJSONArray("coordinates")
                                  for (i in 0 until coords.length()) {
                                      val pair = coords.getJSONArray(i)
                                      val lng = pair.getDouble(0)
                                      val lat = pair.getDouble(1)
                                      points.add(GeoPoint(lat, lng))
                                  }
                                  if (points.isNotEmpty()) {
                                      return@withContext points
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // Try mirror
                      }
                  }

                  val fallback = mutableListOf<GeoPoint>()
                  fallback.add(GeoPoint(startLat, startLng))
                  fallback.add(GeoPoint((startLat + endLat) / 2.0, (startLng + endLng) / 2.0))
                  fallback.add(GeoPoint(endLat, endLng))
                  fallback
              }
          }
