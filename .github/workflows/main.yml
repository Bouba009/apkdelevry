          @Composable
          fun PolicyInfoDialog(
              type: String,
              lang: Language,
              onDismiss: () -> Unit
          ) {
              val (title, text) = when (type) {
                  "privacy" -> AppStrings.get("privacy_policy", lang) to (if (lang == Language.AR) "نحن نلتزم بحماية بياناتك وموقعك الجغرافي واستخدامه حصراً لتوجيه مسار التوصيل بينك وبين المطعم والسائق." else "Nous nous engageons à protéger vos données et votre position GPS uniquement pour assurer la livraison.")
                  "about" -> AppStrings.get("about_us", lang) to (if (lang == Language.AR) "منصة رقمية لتسهيل وتنسيق طلبات التوصيل السريع بين الزبائن والمطاعم وعمال التوصيل في العفرون وضواحيها." else "Plateforme intelligente pour la livraison rapide à El Affroun et ses environs.")
                  "contact" -> AppStrings.get("contact_us", lang) to (if (lang == Language.AR) "الهاتف: 0555-555-555\nالبريد: support@quickdeliver.com" else "Tél : 0555-555-555\nEmail : support@quickdeliver.com")
                  else -> AppStrings.get("shipping_policy", lang) to (if (lang == Language.AR) "تسعيرة التوصيل: 50 دج لكل 500 متر بناءً على المسار الحقيقي على الخارطة." else "Tarification de livraison : 50 DA par tranche de 500 mètres selon le trajet réel.")
              }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text(title, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = QdOrange)
                          Text(text, fontSize = 13.sp, color = QdTextDark, lineHeight = 20.sp)
                          Button(
                              onClick = onDismiss,
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text("OK")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickDeliver-MapLibre-Bilingual-APK
          path: app/build/outputs/apk/debug/app-debug.apk
