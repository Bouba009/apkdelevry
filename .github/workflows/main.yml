          // -------------------------------------------------------------
          // 10. SCREEN: DRIVER DASHBOARD
          // -------------------------------------------------------------
          @Composable
          fun DriverDashboardScreen(
              driverName: String,
              earnings: Int,
              completedCount: Int,
              debt: Int,
              activeOrders: List<ActiveOrder>,
              onUpdateStatus: (ActiveOrder, String) -> Unit,
              onFinishOrder: (ActiveOrder) -> Unit,
              onOpenChat: () -> Unit,
              onSwitchToCustomer: () -> Unit
          ) {
              val currentDelivery = activeOrders.firstOrNull { it.status in listOf("accepted", "to_store", "received") }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(QdBackground)
                      .padding(18.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text("لوحة قيادة السائق 🛵", fontWeight = FontWeight.Black, fontSize = 18.sp)
                          Text("كابتن $driverName - العفرون", fontSize = 12.sp, color = QdTextMuted)
                      }
                      Button(
                          onClick = onSwitchToCustomer,
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrangeSoft),
                          shape = RoundedCornerShape(10.dp),
                          contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp)
                      ) {
                          Text("Mode Client", color = QdOrange, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(14.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("الأرباح", fontSize = 11.sp, color = QdTextMuted)
                              Text("$earnings DA", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = QdGreen)
                          }
                      }
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(14.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("المكتملة", fontSize = 11.sp, color = QdTextMuted)
                              Text("$completedCount", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = QdOrange)
                          }
                      }
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(14.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("دين المنصة", fontSize = 10.sp, color = QdTextMuted)
                              Text("$debt DA", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = QdRed)
                          }
                      }
                  }

                  if (debt >= 1000) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = QdRed.copy(alpha = 0.12f)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Text(
                              text = "⚠️ تنبيه : تجاوز دينك حد 1000 دج. يرجى تسديد مستحقات المنصة للإدارة حتى لا يتم تجميد الحساب تلقائياً.",
                              color = QdRed,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(12.dp)
                          )
                      }
                  }

                  Text("الطلب الجاري توصيله :", fontWeight = FontWeight.Bold, fontSize = 15.sp)

                  if (currentDelivery != null) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(16.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text(currentDelivery.restaurant, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                              Text("العنوان : ${currentDelivery.address}", fontSize = 12.sp, color = QdTextMuted)
                              Text("السعر : ${currentDelivery.price} DA", fontWeight = FontWeight.Bold, color = QdOrange)

                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(
                                      onClick = { onUpdateStatus(currentDelivery, "to_store") },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = if (currentDelivery.status == "to_store") QdOrange else Color.LightGray.copy(alpha = 0.4f)
                                      )
                                  ) {
                                      Text("للمحل", fontSize = 10.sp)
                                  }
                                  Button(
                                      onClick = { onUpdateStatus(currentDelivery, "received") },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = if (currentDelivery.status == "received") QdOrange else Color.LightGray.copy(alpha = 0.4f)
                                      )
                                  ) {
                                      Text("استلمت", fontSize = 10.sp)
                                  }
                                  Button(
                                      onClick = { onFinishOrder(currentDelivery) },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(containerColor = QdGreen)
                                  ) {
                                      Text("سلمت", fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                  }
                              }

                              Button(
                                  onClick = onOpenChat,
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(10.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                              ) {
                                  Icon(Icons.Default.Chat, contentDescription = null, modifier = Modifier.size(16.dp))
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text("محادثة الزبون مباشرة", fontSize = 12.sp)
                              }
                          }
                      }
                  } else {
                      Card(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(120.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(16.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("لا توجد طلبات جارية الآن. أنت جاهز لاستقبال العروض!", color = QdTextMuted, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

