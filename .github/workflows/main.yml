                          ) { Text("مطعم", fontSize = 10.sp) }
                          Button(
                              onClick = { newStoreCategory = "بقالة" },
                              colors = ButtonDefaults.buttonColors(containerColor = if (newStoreCategory == "بقالة") QdOrange else Color.LightGray)
                          ) { Text("بقالة", fontSize = 10.sp) }
                          Button(
                              onClick = { newStoreCategory = "صيدليات" },
                              colors = ButtonDefaults.buttonColors(containerColor = if (newStoreCategory == "صيدليات") QdOrange else Color.LightGray)
                          ) { Text("صيدلية", fontSize = 10.sp) }
                          Button(
                              onClick = { newStoreCategory = "سلع وبضائع" },
                              colors = ButtonDefaults.buttonColors(containerColor = if (newStoreCategory == "سلع وبضائع") QdOrange else Color.LightGray)
                          ) { Text("بضائع", fontSize = 10.sp) }
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(
                              value = newStoreLat,
                              onValueChange = { newStoreLat = it },
                              label = { Text("Lat") },
                              modifier = Modifier.weight(1f),
                              shape = RoundedCornerShape(12.dp)
                          )
                          OutlinedTextField(
                              value = newStoreLng,
                              onValueChange = { newStoreLng = it },
                              label = { Text("Lng") },
                              modifier = Modifier.weight(1f),
                              shape = RoundedCornerShape(12.dp)
                          )
                          OutlinedTextField(
                              value = newStoreBasePrice,
                              onValueChange = { newStoreBasePrice = it },
                              label = { Text("السعر") },
                              modifier = Modifier.weight(1f),
                              shape = RoundedCornerShape(12.dp)
                          )
                      }
                      Spacer(modifier = Modifier.height(10.dp))
                      Button(
                          onClick = {
                              if (newStoreName.isNotBlank()) {
                                  val lat = newStoreLat.toDoubleOrNull() ?: 36.4686
                                  val lng = newStoreLng.toDoubleOrNull() ?: 2.6288
                                  val price = newStoreBasePrice.toIntOrNull() ?: 50
                                  val emoji = when (newStoreCategory) {
                                      "صيدليات" -> "💊"
                                      "بقالة" -> "🧺"
                                      "سلع وبضائع" -> "📦"
                                      else -> "🍲"
                                  }
                                  onAddStore(
                                      StoreModel(
                                          id = System.currentTimeMillis().toString(),
                                          name = newStoreName.trim(),
                                          category = newStoreCategory,
                                          rating = "4.8",
                                          time = "20-30 min",
                                          emoji = emoji,
                                          lat = lat,
                                          lng = lng,
                                          basePrice = price
                                      )
                                  )
                                  newStoreName = ""
                              }
                          },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                      ) {
                          Text("حفظ ونشر على التطبيق", fontWeight = FontWeight.Bold)
                      }
                  }

                  item {
                      Text("إدارة المتاجر الحالية (حذف / تعديل) :", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                  }

                  items(stores) { store ->
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .border(1.dp, QdBorder, RoundedCornerShape(12.dp))
                              .padding(12.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text(store.name, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Text("${store.category} • سعر أساسي: ${store.basePrice} DA", fontSize = 11.sp, color = QdTextMuted)
                          }
                          IconButton(onClick = { onDeleteStore(store.id) }) {
                              Icon(Icons.Default.Delete, contentDescription = "Delete", tint = QdRed)
                          }
                      }
                  }
              }
          }

