          // 6. SCREEN: MES COMMANDES
          // -------------------------------------------------------------
          @Composable
          fun OrdersListScreen(
              lang: Language,
              orders: List<ActiveOrder>,
              onSelectOrder: () -> Unit
          ) {
              var selectedFilter by remember { mutableStateOf(0) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(horizontal = 20.dp)
              ) {
                  Spacer(modifier = Modifier.height(14.dp))
                  Text(text = AppStrings.get("my_orders", lang), fontSize = 20.sp, fontWeight = FontWeight.Black)
                  Spacer(modifier = Modifier.height(14.dp))

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceAround
                  ) {
                      FilterTab(label = AppStrings.get("filter_running", lang), selected = selectedFilter == 0, onClick = { selectedFilter = 0 })
                      FilterTab(label = AppStrings.get("filter_completed", lang), selected = selectedFilter == 1, onClick = { selectedFilter = 1 })
                      FilterTab(label = AppStrings.get("filter_cancelled", lang), selected = selectedFilter == 2, onClick = { selectedFilter = 2 })
                  }

                  Divider(color = QdBorder, modifier = Modifier.padding(top = 10.dp))
                  Spacer(modifier = Modifier.height(14.dp))

                  val filtered = when (selectedFilter) {
                      0 -> orders.filter { it.status in listOf("pending", "accepted", "to_store", "received", "delivered") }
                      1 -> orders.filter { it.status == "completed" }
                      else -> emptyList()
                  }

                  LazyColumn(
                      verticalArrangement = Arrangement.spacedBy(14.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      if (filtered.isEmpty()) {
                          item {
                              Box(modifier = Modifier.fillMaxWidth().padding(top = 40.dp), contentAlignment = Alignment.Center) {
                                  Text("Aucune commande", color = QdTextMuted, fontSize = 13.sp)
                              }
                          }
                      } else {
                          items(filtered) { ord ->
                              OrderListItem(
                                  name = ord.restaurant,
                                  date = "ID #${ord.id.takeLast(4)}",
                                  price = "${ord.price} DA",
                                  status = ord.status,
                                  statusColor = if (ord.status == "completed") QdGreen else QdOrange,
                                  emoji = "🍕",
                                  onClick = onSelectOrder
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun FilterTab(label: String, selected: Boolean, onClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) { onClick() }
              ) {
                  Text(
                      text = label,
                      fontSize = 13.sp,
                      fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium,
                      color = if (selected) QdOrange else QdTextMuted
                  )
                  Spacer(modifier = Modifier.height(6.dp))
                  Box(
                      modifier = Modifier
                          .width(36.dp)
                          .height(3.dp)
                          .background(if (selected) QdOrange else Color.Transparent, RoundedCornerShape(2.dp))
                  )
              }
          }

