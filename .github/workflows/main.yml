                                          selectedIconColor = QdOrange,
                                          selectedTextColor = QdOrange,
                                          unselectedIconColor = QdTextMuted,
                                          unselectedTextColor = QdTextMuted,
                                          indicatorColor = Color.Transparent
                                      )
                                  )
                                  NavigationBarItem(
                                      selected = (currentScreen == AppScreen.PROFILE),
                                      onClick = {
                                          currentScreen = AppScreen.PROFILE
                                          bottomTab = 3
                                      },
                                      icon = { Icon(Icons.Default.Person, contentDescription = "Profil") },
                                      label = { Text("Profil", fontSize = 11.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = QdOrange,
                                          selectedTextColor = QdOrange,
                                          unselectedIconColor = QdTextMuted,
                                          unselectedTextColor = QdTextMuted,
                                          indicatorColor = Color.Transparent
                                      )
                                  )
                              }
                          }
                      }
                  ) { padding ->
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(padding)
                      ) {
                          when (currentScreen) {
                              AppScreen.SPLASH_ONBOARDING -> {
                                  SplashScreen(
                                      onStart = { currentScreen = AppScreen.HOME_EXPLORE },
                                      onLogin = { currentScreen = AppScreen.HOME_EXPLORE }
                                  )
                              }
                              AppScreen.HOME_EXPLORE -> {
                                  HomeScreen(
                                      selectedCity = "Alger",
                                      onSelectRestaurant = { rest ->
                                          selectedRestaurant = rest
                                          currentScreen = AppScreen.CONFIRM_ORDER
                                      },
                                      onOrderBannerClick = {
                                          currentScreen = AppScreen.CONFIRM_ORDER
                                      }
                                  )
                              }
                              AppScreen.CONFIRM_ORDER -> {
                                  ConfirmOrderScreen(
                                      restaurant = selectedRestaurant,
                                      address = selectedAddress,
                                      onChangeAddress = { currentScreen = AppScreen.CHOOSE_ADDRESS },
                                      onBack = { currentScreen = AppScreen.HOME_EXPLORE },
                                      onConfirmOrder = {
                                          SoundHelper.playNotificationTone()
                                          currentScreen = AppScreen.ORDER_TRACKING
                                      }
                                  )
                              }
                              AppScreen.ORDER_TRACKING -> {
                                  OrderTrackingScreen(
                                      restaurant = selectedRestaurant,
                                      driverLat = driverLat,
                                      driverLng = driverLng,
                                      userLat = userLat,
                                      userLng = userLng,
                                      onBack = { currentScreen = AppScreen.HOME_EXPLORE }
                                  )
                              }
                              AppScreen.ORDERS_LIST -> {
                                  OrdersListScreen(
                                      onSelectOrder = { currentScreen = AppScreen.ORDER_TRACKING }
                                  )
                              }
                              AppScreen.CHOOSE_ADDRESS -> {
                                  ChooseAddressScreen(
                                      currentSelected = selectedAddress,
                                      onSelect = {
                                          selectedAddress = it
                                          currentScreen = AppScreen.CONFIRM_ORDER
                                      },
                                      onBack = { currentScreen = AppScreen.CONFIRM_ORDER }
                                  )
                              }
                              AppScreen.PROFILE -> {
                                  ProfileScreen(
                                      onBecomeDriver = { currentScreen = AppScreen.BECOME_DRIVER },
                                      onLogout = { currentScreen = AppScreen.SPLASH_ONBOARDING }
                                  )
                              }
                              AppScreen.BECOME_DRIVER -> {
                                  BecomeDriverScreen(
                                      onBack = { currentScreen = AppScreen.PROFILE },
                                      onRegister = { currentScreen = AppScreen.HOME_EXPLORE }
                                  )
                              }
                          }
                      }
                  }
              }
          }

