          package com.elaffroun.delivery

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import androidx.core.app.NotificationCompat

          object DeliveryNotificationHelper {
              const val CHANNEL_ORDERS_ID = "elaffroun_orders_channel"
              const val CHANNEL_STATUS_ID = "elaffroun_status_channel"

              fun initChannels(context: Context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      val audioAttr = AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .build()

                      val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                      val orderChannel = NotificationChannel(
                          CHANNEL_ORDERS_ID,
                          "تنبيهات الطلبات العاجلة",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "إشعارات بالصوت والاهتزاز عند تلقي طلب توصيل جديد"
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 500, 200, 500)
                          setSound(soundUri, audioAttr)
                      }

                      val statusChannel = NotificationChannel(
                          CHANNEL_STATUS_ID,
                          "متابعة حالة التوصيل الحية",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "إشعارات تحديث مسار ووصول السائق"
                          enableVibration(true)
                          setSound(soundUri, audioAttr)
                      }

                      manager.createNotificationChannel(orderChannel)
                      manager.createNotificationChannel(statusChannel)
                  }
              }

              fun sendOrderAlert(context: Context, title: String, message: String, notificationId: Int = 1001) {
                  val intent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  val notification = NotificationCompat.Builder(context, CHANNEL_ORDERS_ID)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle(title)
                      .setContentText(message)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(message))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setSound(soundUri)
                      .setVibrate(longArrayOf(0, 500, 200, 500))
                      .setAutoCancel(true)
                      .setContentIntent(pendingIntent)
                      .build()

                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.notify(notificationId, notification)
              }
          }
