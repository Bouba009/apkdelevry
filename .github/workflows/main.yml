          package com.elaffroun.delivery

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.RingtoneManager
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlin.math.sin

          object SoundHelper {
              fun playNotificationTone(context: Context) {
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      val r = RingtoneManager.getRingtone(context, uri)
                      r.play()
                  } catch (e: Exception) {
                      generateToneBeep(880.0, 300)
                  }
              }

              fun playArrivalTone() {
                  generateToneBeep(1200.0, 450)
              }

              private fun generateToneBeep(freqOfTone: Double, durationMs: Int) {
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val sampleRate = 8000
                          val numSamples = durationMs * sampleRate / 1000
                          val soundData = DoubleArray(numSamples)
                          val generatedSnd = ByteArray(2 * numSamples)

                          for (i in 0 until numSamples) {
                              soundData[i] = sin(2.0 * Math.PI * i.toDouble() / (sampleRate / freqOfTone))
                          }

                          var idx = 0
                          for (dVal in soundData) {
                              val valShort = (dVal * 32767).toInt().toShort()
                              generatedSnd[idx++] = (valShort.toInt() and 0x00ff).toByte()
                              generatedSnd[idx++] = ((valShort.toInt() and 0xff00) ushr 8).toByte()
                          }

                          val audioTrack = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(generatedSnd.size)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()

                          audioTrack.write(generatedSnd, 0, generatedSnd.size)
                          audioTrack.play()
                      } catch (e: Exception) {
                          // Handle safely
                      }
                  }
              }
          }
