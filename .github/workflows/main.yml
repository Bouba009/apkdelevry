          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun CreateOrderDialog(
              stores: List<StoreItem>,
              userLat: Double,
              userLng: Double,
              onDismiss: () -> Unit,
              onSubmitOrder: (Map<String, Any>) -> Unit
          ) {
              var selectedStore by remember { mutableStateOf(stores.firstOrNull()) }
              var customerAddress by remember { mutableStateOf("العفرون") }
              var note by remember { mutableStateOf("") }
              val products = remember { mutableStateListOf(OrderProduct("وجبة طعام", 1)) }

              val dist = remember(selectedStore, userLat, userLng) {
                  val s = selectedStore
                  if (s != null) getDistanceInKm(s.lat, s.lng, userLat, userLng) else 1.0
              }
              val calculatedPrice = remember(dist) { calculateDeliveryPrice(dist) }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .fillMaxHeight(0.88f),
                      shape = RoundedCornerShape(24.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                  ) {
                      LazyColumn(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(20.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          item {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      text = "إنشاء طلب توصيل جديد",
                                      fontWeight = FontWeight.Black,
                                      fontSize = 16.sp,
                                      color = PrimaryColor
                                  )
                                  IconButton(onClick = onDismiss) {
                                      Icon(imageVector = Icons.Default.Close, contentDescription = "Close")
                                  }
                              }
                          }

                          item {
                              Text(text = "اختر المتجر أو المطعم:", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                              Spacer(modifier = Modifier.height(8.dp))
                              LazyRow(
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  items(stores) { store ->
                                      val isSelected = selectedStore?.id == store.id
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(12.dp))
                                              .background(if (isSelected) PrimaryColor else Color.Gray.copy(alpha = 0.15f))
                                              .clickable { selectedStore = store }
                                              .padding(horizontal = 14.dp, vertical = 10.dp)
                                      ) {
                                          Text(
                                              text = store.name,
                                              fontSize = 12.sp,
                                              fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal,
                                              color = if (isSelected) Color.White else MaterialTheme.colorScheme.onSurface
                                          )
                                      }
                                  }
                              }
                          }

                          item {
                              OutlinedTextField(
                                  value = customerAddress,
                                  onValueChange = { customerAddress = it },
                                  label = { Text("عنوان التوصيل الخاص بك") },
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(12.dp)
                              )
                          }

                          item {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(text = "الوجبات والمنتجات المطلوبة:", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                  TextButton(onClick = { products.add(OrderProduct("", 1)) }) {
                                      Text(text = "+ منتج إضافي", fontSize = 11.sp, color = PrimaryColor)
                                  }
                              }
                          }

                          items(products.indices.toList()) { index ->
                              val p = products[index]
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  OutlinedTextField(
                                      value = p.name,
                                      onValueChange = { newName ->
                                          products[index] = p.copy(name = newName)
                                      },
                                      placeholder = { Text("اسم الوجبة", fontSize = 11.sp) },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp)
                                  )
                                  OutlinedTextField(
                                      value = p.qty.toString(),
                                      onValueChange = { newQty ->
                                          val q = newQty.toIntOrNull() ?: 1
                                          products[index] = p.copy(qty = q)
                                      },
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                      modifier = Modifier.width(60.dp),
                                      shape = RoundedCornerShape(10.dp)
                                  )
                                  if (products.size > 1) {
                                      IconButton(onClick = { products.removeAt(index) }) {
                                          Icon(imageVector = Icons.Default.Delete, contentDescription = null, tint = AccentRed)
                                      }
                                  }
                              }
                          }

                          item {
                              OutlinedTextField(
                                  value = note,
                                  onValueChange = { note = it },
                                  label = { Text("ملاحظة لعامل التوصيل (اختياري)") },
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(12.dp)
                              )
                          }

                          item {
                              Card(
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(14.dp),
                                  colors = CardDefaults.cardColors(containerColor = PrimaryColor.copy(alpha = 0.1f))
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(14.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column {
                                          Text(text = "سعر التوصيل المقدر:", fontSize = 11.sp, color = Color.Gray)
                                          Text(
                                              text = "المسافة التقريبية: ${"%.2f".format(dist)} كم",
                                              fontSize = 10.sp,
                                              color = Color.Gray
                                          )
                                      }
                                      Text(
                                          text = "$calculatedPrice دج",
                                          fontSize = 17.sp,
                                          fontWeight = FontWeight.Black,
                                          color = PrimaryColor
                                      )
                                  }
                              }
                          }

                          item {
                              Button(
                                  onClick = {
                                      val validStore = selectedStore ?: stores.first()
                                      val orderMap = mapOf(
                                          "restaurant" to validStore.name,
                                          "storeLat" to validStore.lat,
                                          "storeLng" to validStore.lng,
                                          "customerAddress" to customerAddress,
                                          "lat" to userLat,
                                          "lng" to userLng,
                                          "price" to calculatedPrice,
                                          "items" to products.filter { it.name.isNotBlank() }.map {
                                              mapOf("name" to it.name, "qty" to it.qty)
                                          },
                                          "note" to note
                                      )
                                      onSubmitOrder(orderMap)
                                  },
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .height(50.dp),
                                  shape = RoundedCornerShape(14.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = PrimaryColor)
                              ) {
                                  Text(text = "تأكيد وإرسال الطلب", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChatDialog(
              senderRole: String,
              messages: List<ChatMessage>,
              onSendMessage: (String) -> Unit,
              onDismiss: () -> Unit
          ) {
              var inputMessage by remember { mutableStateOf("") }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .fillMaxHeight(0.7f),
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(16.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(text = "محادثة الطلب الفورية", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              IconButton(onClick = onDismiss) {
                                  Icon(imageVector = Icons.Default.Close, contentDescription = "Close")
                              }
                          }

                          LazyColumn(
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxWidth(),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              if (messages.isEmpty()) {
                                  item {
                                      Box(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .padding(top = 40.dp),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(
                                              text = "لا توجد رسائل سابقة. ابدأ المحادثة الآن!",
                                              fontSize = 11.sp,
                                              color = Color.Gray
                                          )
                                      }
                                  }
                              }
                              items(messages) { msg ->
                                  val isMe = (msg.sender == "customer" && senderRole == "الزبون") ||
                                          (msg.sender == "driver" && senderRole == "السائق")
                                  Column(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalAlignment = if (isMe) Alignment.End else Alignment.Start
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(12.dp))
                                              .background(if (isMe) PrimaryColor else Color.Gray.copy(alpha = 0.2f))
                                              .padding(horizontal = 12.dp, vertical = 8.dp)
                                      ) {
                                          Text(
                                              text = msg.text,
                                              fontSize = 12.sp,
                                              color = if (isMe) Color.White else MaterialTheme.colorScheme.onSurface
                                          )
                                      }
                                  }
                              }
                          }

                          Spacer(modifier = Modifier.height(8.dp))

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              OutlinedTextField(
                                  value = inputMessage,
                                  onValueChange = { inputMessage = it },
                                  placeholder = { Text("اكتب رسالتك...", fontSize = 11.sp) },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              )
                              IconButton(
                                  onClick = {
                                      if (inputMessage.isNotBlank()) {
                                          onSendMessage(inputMessage.trim())
                                          inputMessage = ""
                                      }
                                  }
                              ) {
                                  Icon(imageVector = Icons.Default.Send, contentDescription = "Send", tint = PrimaryColor)
                              }
                          }
                      }
                  }
              }
          }

