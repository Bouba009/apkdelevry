          package com.elaffroun.delivery

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlin.math.exp
          import kotlin.math.sin

          object SoundHelper {
              fun triggerBackgroundNotification(
                  context: Context,
                  orderId: String,
                  restaurant: String,
                  goodsPrice: Int,
                  deliveryFee: Int,
                  distanceKm: Double,
                  address: String
              ) {
                  val channelId = "quickdeliver_channel_urgent"
                  val notificationManager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "طلب توصيل عاجل",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "طلبات التوصيل الجديدة"
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 500, 200, 500)
                      }
                      notificationManager.createNotificationChannel(channel)
                  }

                  val notifId = (orderId.hashCode() and 0xfffffff)

                  val contentIntent = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      putExtra("open_order_id", orderId)
                  }
                  val contentPendingIntent = PendingIntent.getActivity(
                      context, notifId, contentIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val acceptIntent = Intent(context, NotificationActionReceiver::class.java).apply {
                      action = "ACTION_ACCEPT_ORDER"
                      putExtra("order_id", orderId)
                      putExtra("notification_id", notifId)
                  }
                  val acceptPendingIntent = PendingIntent.getBroadcast(
                      context, notifId + 1, acceptIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val cancelIntent = Intent(context, NotificationActionReceiver::class.java).apply {
                      action = "ACTION_DISMISS_ORDER"
                      putExtra("order_id", orderId)
                      putExtra("notification_id", notifId)
                  }
                  val cancelPendingIntent = PendingIntent.getBroadcast(
                      context, notifId + 2, cancelIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val totalAmount = goodsPrice + deliveryFee
                  val distanceFormatted = "%.1f".format(distanceKm)
                  val detailedText = "المحل: $restaurant\nالوجهة: $address\nالمسافة: $distanceFormatted كم\nربح التوصيل: $deliveryFee DA | الطلبات: $goodsPrice DA\nالمجموع الكلي: $totalAmount DA"

                  val notification = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("🛵 طلب جديد • ربح التوصيل: $deliveryFee DA")
                      .setContentText("$restaurant ($distanceFormatted كم)")
                      .setStyle(NotificationCompat.BigTextStyle().bigText(detailedText))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setContentIntent(contentPendingIntent)
                      .setAutoCancel(true)
                      .addAction(android.R.drawable.ic_menu_send, "✔ قبول الطلب", acceptPendingIntent)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "✖ تجاهل", cancelPendingIntent)
                      .build()

                  notificationManager.notify(notifId, notification)
              }

              fun playUrgentIphoneLikeTone() {
                  CoroutineScope(Dispatchers.IO).launch {
                      val startTime = System.currentTimeMillis()
                      while (System.currentTimeMillis() - startTime < 3000) {
                          playHarmonicChime(784.0, 180)
                          delay(30)
                          playHarmonicChime(1046.5, 180)
                          delay(30)
                          playHarmonicChime(1318.5, 320)
                          delay(220)
                      }
                  }
              }

              fun playArrivalTone() {
                  CoroutineScope(Dispatchers.IO).launch {
                      playHarmonicChime(880.00, 110)
                      delay(25)
                      playHarmonicChime(1174.66, 110)
                      delay(25)
                      playHarmonicChime(1760.00, 300)
                  }
              }

              private fun playHarmonicChime(freqOfTone: Double, durationMs: Int) {
                  try {
                      val sampleRate = 44100
                      val numSamples = durationMs * sampleRate / 1000
                      val soundData = DoubleArray(numSamples)
                      val generatedSnd = ByteArray(2 * numSamples)

                      for (i in 0 until numSamples) {
                          val t = i.toDouble() / sampleRate
                          val decay = exp(-3.8 * t / (durationMs / 1000.0))
                          val wave = sin(2.0 * Math.PI * freqOfTone * t) + 0.30 * sin(4.0 * Math.PI * freqOfTone * t)
                          soundData[i] = wave * decay * 0.85
                      }

                      var idx = 0
                      for (dVal in soundData) {
                          val valShort = (dVal.coerceIn(-1.0, 1.0) * 32767).toInt().toShort()
                          generatedSnd[idx++] = (valShort.toInt() and 0x00ff).toByte()
                          generatedSnd[idx++] = ((valShort.toInt() and 0xff00) ushr 8).toByte()
                      }

                      val audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build()
                          )
                          .setBufferSizeInBytes(generatedSnd.size)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      audioTrack.write(generatedSnd, 0, generatedSnd.size)
                      audioTrack.play()
                  } catch (e: Exception) {
                      // Handled
                  }
              }
          }
