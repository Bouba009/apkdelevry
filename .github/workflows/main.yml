          @Composable
          fun ConfirmOrderScreen(
              lang: Language,
              restaurant: RestaurantItem,
              address: String,
              meals: List<OrderProduct>,
              userLat: Double,
              userLng: Double,
              onAddMeal: () -> Unit,
              onChangeAddress: () -> Unit,
              onBack: () -> Unit,
              onConfirmOrder: (deliveryFee: Int, note: String) -> Unit
          ) {
              var orderNote by remember { mutableStateOf("") }
              val distanceKm = remember(restaurant, userLat, userLng) {
                  getDistanceInKm(restaurant.lat, restaurant.lng, userLat, userLng).coerceAtLeast(0.5)
              }
              val deliveryFee = remember(distanceKm) {
                  calculateDeliveryFee(distanceKm)
              }
              val foodSubtotal = 450
              val totalAmount = foodSubtotal + deliveryFee

              Scaffold(
                  bottomBar = {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color.White)
                              .border(1.dp, QdBorder)
                              .padding(18.dp)
                      ) {
                          Button(
                              onClick = { onConfirmOrder(deliveryFee, orderNote) },
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(54.dp),
                              shape = RoundedCornerShape(16.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text(text = "${AppStrings.get("confirm_command", lang)} ($totalAmount DA)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
                          }
                      }
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
