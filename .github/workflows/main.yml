          @Composable
          fun QuickDeliverLogoGraphic(size: Dp = 90.dp) {
              Canvas(modifier = Modifier.size(size)) {
                  val w = this.size.width
                  val h = this.size.height
                  val primaryOrange = Color(0xFFFF5E00.toInt())

                  drawCircle(
                      color = primaryOrange,
                      radius = w * 0.45f,
                      center = Offset(w * 0.55f, h * 0.48f)
                  )

                  drawRoundRect(
                      color = primaryOrange,
                      topLeft = Offset(w * 0.05f, h * 0.32f),
                      size = Size(w * 0.22f, h * 0.06f)
                  )
                  drawRoundRect(
                      color = primaryOrange,
                      topLeft = Offset(w * 0.02f, h * 0.45f),
                      size = Size(w * 0.25f, h * 0.06f)
                  )
                  drawRoundRect(
                      color = primaryOrange,
                      topLeft = Offset(w * 0.08f, h * 0.58f),
                      size = Size(w * 0.19f, h * 0.06f)
                  )

                  val p = Path().apply {
                      addOval(Rect(w * 0.52f, h * 0.24f, w * 0.64f, h * 0.36f))
                  }
                  drawPath(p, Color.White, style = Fill)

                  drawCircle(color = Color.White, radius = w * 0.09f, center = Offset(w * 0.42f, h * 0.65f))
                  drawCircle(color = Color.White, radius = w * 0.09f, center = Offset(w * 0.72f, h * 0.65f))

                  val bodyPath = Path().apply {
                      moveTo(w * 0.42f, h * 0.65f)
                      lineTo(w * 0.54f, h * 0.48f)
                      lineTo(w * 0.66f, h * 0.48f)
                      lineTo(w * 0.72f, h * 0.65f)
                      close()
                  }
                  drawPath(bodyPath, Color.White, style = Fill)
              }
          }
