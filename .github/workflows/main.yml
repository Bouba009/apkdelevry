                                  .fillMaxWidth()
                                  .height(54.dp),
                              shape = RoundedCornerShape(16.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text(text = "Ajouter une nouvelle adresse", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color.White)
                          }
                      }
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.White)
                          .padding(padding)
                          .padding(horizontal = 20.dp),
                      verticalArrangement = Arrangement.spacedBy(18.dp)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(top = 10.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onBack) {
                              Icon(Icons.Default.ArrowBack, contentDescription = "Retour")
                          }
                          Spacer(modifier = Modifier.width(8.dp))
                          Text(text = "Choisir une adresse", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      }

                      // Search address field
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(50.dp)
                              .clip(RoundedCornerShape(16.dp))
                              .background(QdBackground)
                              .padding(horizontal = 14.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Icon(Icons.Default.Search, contentDescription = null, tint = QdTextMuted)
                          Text(text = "Rechercher une adresse", color = QdTextMuted, fontSize = 13.sp)
                      }

                      // My current GPS position button
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clickable { onSelect("Ma position actuelle (GPS)") }
                              .padding(vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          Icon(Icons.Default.NearMe, contentDescription = null, tint = QdOrange, modifier = Modifier.size(24.dp))
                          Column {
                              Text(text = "Ma position actuelle", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              Text(text = "Prendre ma position sur la carte", fontSize = 11.sp, color = QdTextMuted)
                          }
                      }

                      Text(text = "Mes adresses enregistrées", fontWeight = FontWeight.Bold, fontSize = 15.sp)

                      addresses.forEach { addr ->
                          val isSelected = (currentSelected == addr)
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .border(1.dp, if (isSelected) QdOrange else QdBorder, RoundedCornerShape(14.dp))
                                  .clickable { onSelect(addr) }
                                  .padding(14.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              Icon(Icons.Default.Home, contentDescription = null, tint = QdOrange, modifier = Modifier.size(22.dp))
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(text = addr, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                              }
                              RadioButton(
                                  selected = isSelected,
                                  onClick = { onSelect(addr) },
                                  colors = RadioButtonDefaults.colors(selectedColor = QdOrange)
                              )
                          }
                      }
                  }
              }
          }

