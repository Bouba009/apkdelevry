          @Composable
          fun OrderTrackingScreen(lang: Language, order: ActiveOrder, onBack: () -> Unit, onOpenChat: () -> Unit, onConfirmDelivered: () -> Unit, onCancelOrder: () -> Unit) {
              val context = LocalContext.current
              Box(modifier = Modifier.fillMaxSize()) {
                  BeautifulVoyagerRoadMap(order.custLat, order.custLng, order.storeLat, order.storeLng)
                  Column(modifier = Modifier.fillMaxWidth().padding(16.dp)) {
                      IconButton(onClick = onBack, modifier = Modifier.shadow(4.dp, CircleShape).clip(CircleShape).background(Color.White)) { Icon(Icons.Default.ArrowBack, null, tint = QdTextDark) }
                      Spacer(modifier = Modifier.height(10.dp))
                      Card(modifier = Modifier.fillMaxWidth().shadow(6.dp, RoundedCornerShape(18.dp)), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                          Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text(if (order.driverName.isNotBlank()) AppStrings.get("order_on_the_way", lang) else AppStrings.get("order_waiting_driver", lang), fontWeight = FontWeight.Black, fontSize = 15.sp)
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("المسافة: ${"%.1f".format(order.distanceKm)} كم", fontSize = 12.sp, color = QdTextMuted)
                                  Text("التوصيل: ${order.deliveryFee} DA", fontSize = 12.sp, color = QdOrange, fontWeight = FontWeight.Bold)
                                  Text("الإجمالي: ${order.totalPrice} DA", fontSize = 13.sp, fontWeight = FontWeight.Black)
                              }
                              if (order.status == "received" || order.status == "delivered") {
                                  Button(onClick = onConfirmDelivered, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = QdGreen), shape = RoundedCornerShape(12.dp)) { Text(AppStrings.get("received", lang), fontWeight = FontWeight.Bold) }
                              } else if (order.status == "pending") {
                                  TextButton(onClick = onCancelOrder, modifier = Modifier.fillMaxWidth()) { Text(AppStrings.get("cancel", lang), color = QdRed, fontWeight = FontWeight.Bold) }
                              }
                          }
                      }
                  }
                  if (order.driverName.isNotBlank()) {
                      Card(modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().padding(16.dp).shadow(8.dp, RoundedCornerShape(20.dp)), colors = CardDefaults.cardColors(containerColor = Color.White)) {
