          @Composable
          fun ProfileScreen(
              lang: Language,
              name: String,
              phone: String,
              onBecomeDriver: () -> Unit,
              onOpenPolicy: (String) -> Unit,
              onOpenReport: () -> Unit,
              onLogout: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(horizontal = 20.dp, vertical = 16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text(text = AppStrings.get("my_profile", lang), fontSize = 20.sp, fontWeight = FontWeight.Black)

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      Box(
                          modifier = Modifier
                              .size(64.dp)
                              .clip(CircleShape)
                              .background(QdOrange.copy(alpha = 0.15f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(Icons.Default.Person, contentDescription = null, tint = QdOrange, modifier = Modifier.size(38.dp))
                      }
                      Column {
                          Text(text = name, fontWeight = FontWeight.Bold, fontSize = 17.sp)
                          Text(text = phone, fontSize = 12.sp, color = QdTextMuted)
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  ProfileMenuRow(icon = Icons.Default.TwoWheeler, title = AppStrings.get("become_driver", lang), onClick = onBecomeDriver)
                  ProfileMenuRow(icon = Icons.Default.VerifiedUser, title = AppStrings.get("privacy_policy", lang), onClick = { onOpenPolicy("privacy") })
                  ProfileMenuRow(icon = Icons.Default.LocalShipping, title = AppStrings.get("shipping_policy", lang), onClick = { onOpenPolicy("shipping") })
                  ProfileMenuRow(icon = Icons.Default.ReportProblem, title = AppStrings.get("report_problem", lang), onClick = onOpenReport)

                  Spacer(modifier = Modifier.weight(1f))

                  OutlinedButton(
                      onClick = onLogout,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(52.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.outlinedButtonColors(contentColor = QdOrange),
                      border = androidx.compose.foundation.BorderStroke(1.5.dp, QdOrange)
                  ) {
                      Text(text = AppStrings.get("logout", lang), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                  }
                  Spacer(modifier = Modifier.height(10.dp))
              }
          }

          @Composable
          fun ProfileMenuRow(icon: ImageVector, title: String, onClick: () -> Unit) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable { onClick() }
                      .padding(vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Icon(icon, contentDescription = null, tint = QdTextDark, modifier = Modifier.size(20.dp))
                      Text(text = title, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                  }
                  Icon(Icons.Default.ChevronRight, contentDescription = null, tint = QdTextMuted, modifier = Modifier.size(20.dp))
              }
          }

          // -------------------------------------------------------------
          // 9. SCREEN: DRIVER DASHBOARD
          // -------------------------------------------------------------
          @Composable
          fun DriverDashboardScreen(
              lang: Language,
              driverName: String,
              earnings: Int,
              completedCount: Int,
              debt: Int,
              activeOrders: List<ActiveOrder>,
              onUpdateStatus: (ActiveOrder, String) -> Unit,
              onFinishOrder: (ActiveOrder) -> Unit,
              onOpenChat: () -> Unit,
              onSwitchToCustomer: () -> Unit
          ) {
              val currentDelivery = activeOrders.firstOrNull { it.status in listOf("accepted", "to_store", "received") }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(QdBackground)
                      .padding(18.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text(AppStrings.get("driver_dashboard", lang), fontWeight = FontWeight.Black, fontSize = 18.sp)
                          Text("Livreur : $driverName", fontSize = 12.sp, color = QdTextMuted)
                      }
                      Button(
                          onClick = onSwitchToCustomer,
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrangeSoft),
                          shape = RoundedCornerShape(10.dp),
                          contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp)
                      ) {
                          Text("Mode Client", color = QdOrange, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(14.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(AppStrings.get("earnings", lang), fontSize = 11.sp, color = QdTextMuted)
                              Text("$earnings DA", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = QdGreen)
                          }
                      }
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(14.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(AppStrings.get("completed", lang), fontSize = 11.sp, color = QdTextMuted)
                              Text("$completedCount", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = QdOrange)
                          }
                      }
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(14.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(AppStrings.get("platform_debt", lang), fontSize = 9.sp, color = QdTextMuted)
                              Text("$debt DA", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = QdRed)
                          }
                      }
                  }

                  if (debt >= 1000) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = QdRed.copy(alpha = 0.12f)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Text(
                              text = AppStrings.get("debt_warning", lang),
                              color = QdRed,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(12.dp)
                          )
                      }
                  }

                  Text(AppStrings.get("active_delivery", lang), fontWeight = FontWeight.Bold, fontSize = 15.sp)

                  if (currentDelivery != null) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(16.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text(currentDelivery.restaurant, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                              Text("Destination : ${currentDelivery.address}", fontSize = 12.sp, color = QdTextMuted)
                              Text("Prix : ${currentDelivery.price} DA", fontWeight = FontWeight.Bold, color = QdOrange)

                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(
                                      onClick = { onUpdateStatus(currentDelivery, "to_store") },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = if (currentDelivery.status == "to_store") QdOrange else Color.LightGray.copy(alpha = 0.4f)
                                      )
                                  ) {
                                      Text(AppStrings.get("status_to_store", lang), fontSize = 9.sp)
                                  }
                                  Button(
                                      onClick = { onUpdateStatus(currentDelivery, "received") },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = if (currentDelivery.status == "received") QdOrange else Color.LightGray.copy(alpha = 0.4f)
                                      )
                                  ) {
                                      Text(AppStrings.get("status_received", lang), fontSize = 9.sp)
                                  }
                                  Button(
                                      onClick = { onFinishOrder(currentDelivery) },
                                      modifier = Modifier.weight(1f),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(containerColor = QdGreen)
                                  ) {
                                      Text(AppStrings.get("status_delivered", lang), fontSize = 9.sp, fontWeight = FontWeight.Bold)
                                  }
                              }

                              Button(
                                  onClick = onOpenChat,
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(10.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                              ) {
                                  Icon(Icons.Default.Chat, contentDescription = null, modifier = Modifier.size(16.dp))
                                  Spacer(modifier = Modifier.width(6.dp))
                                  Text(AppStrings.get("chat", lang), fontSize = 12.sp)
                              }
                          }
                      }
                  } else {
                      Card(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(120.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(16.dp),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("En attente de commandes...", color = QdTextMuted, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          // -------------------------------------------------------------
          // DIALOGS: INCOMING ORDER, CHAT, RATINGS, ADD MEAL, REPORT & POLICY
          // -------------------------------------------------------------
          @Composable
          fun DriverIncomingOrderDialog(
              lang: Language,
              order: ActiveOrder,
              onAccept: () -> Unit,
              onReject: () -> Unit
          ) {
              Dialog(onDismissRequest = onReject) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("🛵 Nouvelle commande !", fontWeight = FontWeight.Black, fontSize = 17.sp, color = QdOrange)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text("Restaurant : ${order.restaurant}", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                          Text("Adresse : ${order.address}", fontSize = 12.sp, color = QdTextMuted)
                          Text("Montant : ${order.price} DA", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = QdGreen)
                          Spacer(modifier = Modifier.height(16.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              OutlinedButton(onClick = onReject, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp)) {
                                  Text(AppStrings.get("cancel", lang), color = QdRed)
                              }
                              Button(onClick = onAccept, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                                  Text("Accepter", fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChatModalDialog(
              messages: List<ChatMessage>,
              onSendMessage: (String) -> Unit,
              onDismiss: () -> Unit
          ) {
              var textInput by remember { mutableStateOf("") }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .fillMaxHeight(0.72f),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("Discussion en direct", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              IconButton(onClick = onDismiss) {
                                  Icon(Icons.Default.Close, contentDescription = "Fermer")
                              }
                          }

                          LazyColumn(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(messages) { msg ->
                                  val isMe = msg.sender == "customer"
                                  Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = if (isMe) Alignment.End else Alignment.Start) {
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(12.dp))
                                              .background(if (isMe) QdOrange else Color(0xFFF1F2F4.toInt()))
                                              .padding(horizontal = 12.dp, vertical = 8.dp)
                                      ) {
                                          Text(msg.text, color = if (isMe) Color.White else QdTextDark, fontSize = 12.sp)
                                      }
                                      Text(msg.time, fontSize = 9.sp, color = QdTextMuted, modifier = Modifier.padding(horizontal = 4.dp))
                                  }
                              }
                          }

                          Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = textInput,
                                  onValueChange = { textInput = it },
                                  placeholder = { Text("Écrire...", fontSize = 11.sp) },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              )
                              IconButton(
                                  onClick = {
                                      if (textInput.isNotBlank()) {
                                          onSendMessage(textInput.trim())
                                          textInput = ""
                                      }
                                  }
                              ) {
                                  Icon(Icons.Default.Send, contentDescription = "Envoyer", tint = QdOrange)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RatingModalDialog(
              onDismiss: () -> Unit,
              onRated: () -> Unit
          ) {
              var stars by remember { mutableStateOf(5) }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("Évaluation de la livraison", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                          Spacer(modifier = Modifier.height(16.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              for (i in 1..5) {
                                  IconButton(onClick = { stars = i }) {
                                      Icon(
                                          if (i <= stars) Icons.Default.Star else Icons.Default.StarBorder,
                                          contentDescription = null,
                                          tint = Color(0xFFFBBF24.toInt()),
                                          modifier = Modifier.size(34.dp)
                                      )
                                  }
                              }
                          }
                          Spacer(modifier = Modifier.height(18.dp))
                          Button(
                              onClick = onRated,
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text("Confirmer", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun AddMealModalDialog(
              onDismiss: () -> Unit,
              onAddMeal: (String, Int) -> Unit
          ) {
              var mealName by remember { mutableStateOf("") }
              var qty by remember { mutableStateOf(1) }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text("Ajouter un plat / منتج", fontWeight = FontWeight.Bold, fontSize = 16.sp)

                          OutlinedTextField(
                              value = mealName,
                              onValueChange = { mealName = it },
                              label = { Text("Nom / الاسم") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Quantité : $qty", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  IconButton(onClick = { if (qty > 1) qty-- }) {
                                      Icon(Icons.Default.Remove, contentDescription = null)
                                  }
                                  IconButton(onClick = { qty++ }) {
                                      Icon(Icons.Default.Add, contentDescription = null)
                                  }
                              }
                          }

                          Button(
                              onClick = {
                                  if (mealName.isNotBlank()) {
                                      onAddMeal(mealName.trim(), qty)
                                  }
                              },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text("Ajouter", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ReportIncidentDialog(
