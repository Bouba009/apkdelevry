          // -------------------------------------------------------------
          // 4. SCREEN: SUIVI DE LA COMMANDE (Screen 4 in mockup)
          // -------------------------------------------------------------
          @Composable
          fun OrderTrackingScreen(
              restaurant: RestaurantItem,
              driverLat: Double,
              driverLng: Double,
              userLat: Double,
              userLng: Double,
              onBack: () -> Unit
          ) {
              val context = LocalContext.current
              var roadWaypoints by remember { mutableStateOf<List<GeoPoint>>(emptyList()) }

              LaunchedEffect(Unit) {
                  roadWaypoints = MapUtils.fetchOsrmRoadPath(restaurant.lat, restaurant.lng, userLat, userLng)
              }

              Box(modifier = Modifier.fillMaxSize()) {
                  // Interactive Real Road Map (OSMDroid)
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          MapView(ctx).apply {
                              setTileSource(TileSourceFactory.MAPNIK)
                              setMultiTouchControls(true)
                              controller.setZoom(15.0)
                              controller.setCenter(GeoPoint(userLat, userLng))
                          }
                      },
                      update = { mapView ->
                          mapView.overlays.clear()

                          // User Marker (Vous)
                          val userMarker = Marker(mapView).apply {
                              position = GeoPoint(userLat, userLng)
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = "Vous"
                              icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#1E2024"), "🏠")
                          }
                          mapView.overlays.add(userMarker)

                          // Restaurant Marker
                          val restMarker = Marker(mapView).apply {
                              position = GeoPoint(restaurant.lat, restaurant.lng)
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = restaurant.name
                              icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF5E00"), "🍴")
                          }
                          mapView.overlays.add(restMarker)

                          // Real Road-Follow Polyline in Brand Orange
                          if (roadWaypoints.isNotEmpty()) {
                              val polyline = Polyline(mapView).apply {
                                  roadWaypoints.forEach { addPoint(it) }
                                  outlinePaint.color = android.graphics.Color.parseColor("#FF5E00")
                                  outlinePaint.strokeWidth = 14f
                              }
                              mapView.overlays.add(polyline)

                              // Driver Marker on path
                              val midPoint = roadWaypoints[roadWaypoints.size / 2]
                              val driverMarker = Marker(mapView).apply {
                                  position = midPoint
                                  setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                                  title = "Livreur"
                                  icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF5E00"), "🛵")
                              }
                              mapView.overlays.add(driverMarker)
                          }
                          mapView.invalidate()
                      }
                  )

                  // Top Status Float Card
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 20.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(
                              onClick = onBack,
                              modifier = Modifier
                                  .size(40.dp)
                                  .clip(CircleShape)
                                  .background(Color.White)
                                  .shadow(4.dp, CircleShape)
                          ) {
                              Icon(Icons.Default.ArrowBack, contentDescription = "Retour", tint = QdTextDark)
                          }
                          Spacer(modifier = Modifier.width(12.dp))
                          Text(text = "Suivi de la commande", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = QdTextDark)
                      }

                      Spacer(modifier = Modifier.height(14.dp))

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(18.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          elevation = CardDefaults.cardElevation(6.dp)
                      ) {
