          @Composable
          fun RealtimeMapView(
              centerLat: Double,
              centerLng: Double,
              destinationLat: Double? = null,
              destinationLng: Double? = null,
              modifier: Modifier = Modifier
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var roadWaypoints by remember { mutableStateOf<List<GeoPoint>>(emptyList()) }

              LaunchedEffect(centerLat, centerLng, destinationLat, destinationLng) {
                  if (destinationLat != null && destinationLng != null) {
                      roadWaypoints = MapUtils.fetchOsrmRoadPath(
                          centerLat, centerLng,
                          destinationLat, destinationLng
                      )
                  } else {
                      roadWaypoints = emptyList()
                  }
              }

              AndroidView(
                  modifier = modifier.fillMaxSize(),
                  factory = { ctx ->
                      MapView(ctx).apply {
                          setTileSource(TileSourceFactory.MAPNIK)
                          setMultiTouchControls(true)
                          controller.setZoom(15.5)
                          controller.setCenter(GeoPoint(centerLat, centerLng))
                      }
                  },
                  update = { mapView ->
                      mapView.overlays.clear()
                      val centerPoint = GeoPoint(centerLat, centerLng)
                      val centerMarker = Marker(mapView).apply {
                          position = centerPoint
                          setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                          title = "الموقع الحالي"
                          icon = MapUtils.createCustomPinDrawable(
                              context,
                              android.graphics.Color.parseColor("#3B82F6"),
                              "📍"
                          )
                      }
                      mapView.overlays.add(centerMarker)

                      if (destinationLat != null && destinationLng != null) {
                          val destPoint = GeoPoint(destinationLat, destinationLng)
                          val destMarker = Marker(mapView).apply {
                              position = destPoint
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = "المقصد / المطعم"
                              icon = MapUtils.createCustomPinDrawable(
                                  context,
                                  android.graphics.Color.parseColor("#FF7E00"),
                                  "🍲"
                              )
                          }
                          mapView.overlays.add(destMarker)

                          if (roadWaypoints.isNotEmpty()) {
                              val line = Polyline(mapView).apply {
                                  roadWaypoints.forEach { addPoint(it) }
                                  outlinePaint.color = android.graphics.Color.parseColor("#FF7E00")
                                  outlinePaint.strokeWidth = 14f
                              }
                              mapView.overlays.add(line)
                          }
                      }
                      mapView.invalidate()
                  }
              )
          }

