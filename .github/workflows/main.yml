                              note = doc.getString("note") ?: "",
                              storeLat = doc.getDouble("storeLat") ?: 36.4690,
                              storeLng = doc.getDouble("storeLng") ?: 2.6295,
                              custLat = doc.getDouble("lat") ?: 36.4686,
                              custLng = doc.getDouble("lng") ?: 2.6288
                          )
                          activeOrders.add(order)

                          if (isDriverSession && incomingDriverAlertOrder?.id == order.id && order.status != "pending") {
                              incomingDriverAlertOrder = null
                          }

                          if (isDriverSession && order.status == "pending" && incomingDriverAlertOrder == null) {
                              incomingDriverAlertOrder = order
                              SoundHelper.triggerBackgroundNotification(context, order.id, order.restaurant, order.goodsPrice, order.deliveryFee, order.distanceKm, order.address)
                              SoundHelper.playSoftPleasantTone()
                          }
                          if (!isDriverSession && order.status == "received") SoundHelper.playArrivalTone()
                      }

                      if (isDriverSession) {
                          val completed = activeOrders.filter { it.driverPhone.isNotBlank() && it.driverPhone == currentUserPhone && (it.status == "delivered" || it.status == "completed") }
                          driverCompletedCount = completed.size
                          driverEarnings = completed.sumOf { it.deliveryFee }
                          driverDebt = (completed.sumOf { it.distanceKm } * 10.0).roundToInt()
                      }
                  }
                  onDispose { listener?.remove() }
              }

              DisposableEffect(currentChatOrderId) {
                  var chatListener: ListenerRegistration? = null
                  if (currentChatOrderId.isNotBlank()) {
                      chatListener = db.collection("orders").document(currentChatOrderId).collection("messages").orderBy("timestamp")
                          .addSnapshotListener { snap, _ ->
                              if (snap != null) {
                                  liveChatMessages.clear()
                                  for (mDoc in snap.documents) {
                                      liveChatMessages.add(ChatMessage(mDoc.getString("sender") ?: "", mDoc.getString("senderName") ?: "", mDoc.getString("text") ?: "", mDoc.getString("time") ?: ""))
                                  }
                              }
                          }
                  }
                  onDispose { chatListener?.remove() }
              }

              MaterialTheme(colorScheme = lightColorScheme(primary = QdOrange, background = QdBackground, surface = QdCard, onPrimary = Color.White)) {
                  ModalNavigationDrawer(
                      drawerState = drawerState,
                      gesturesEnabled = (currentScreen != AppScreen.SPLASH_ANIMATED_2SEC),
                      drawerContent = {
                          ModalDrawerSheet(modifier = Modifier.width(310.dp), drawerContainerColor = Color.White) {
                              Column(modifier = Modifier.fillMaxSize().padding(20.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      QuickDeliverAppLogo(40.dp)
                                      Text(AppStrings.get("app_name", currentLanguage), fontSize = 18.sp, fontWeight = FontWeight.Black, color = QdOrange)
                                      IconButton(onClick = { scope.launch { drawerState.close() } }) { Icon(Icons.Default.Close, contentDescription = "Close") }
                                  }
                                  Divider(color = QdBorder)
                                  if (!isDriverSession) {
                                      DrawerMenuItem(AppStrings.get("home_tab", currentLanguage), Icons.Default.Home) { scope.launch { drawerState.close() }; currentScreen = AppScreen.HOME_EXPLORE }
                                  }
                                  DrawerMenuItem(AppStrings.get("orders_tab", currentLanguage), Icons.Default.ReceiptLong) { scope.launch { drawerState.close() }; currentScreen = AppScreen.ORDERS_LIST }
                                  DrawerMenuItem(AppStrings.get("profile_tab", currentLanguage), Icons.Default.Person) { scope.launch { drawerState.close() }; currentScreen = AppScreen.PROFILE }
                                  Spacer(modifier = Modifier.weight(1f))
                                  if (!isDriverSession && currentUserUid.isEmpty()) {
                                      Button(onClick = { scope.launch { drawerState.close() }; authUserType = AuthUserType.DRIVER; isDriverAuthRegister = true; currentScreen = AppScreen.AUTH_FLOW }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                                          Text(AppStrings.get("driver_signup", currentLanguage), fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  ) {
                      Scaffold(
                          containerColor = QdBackground,
                          topBar = {
                              if (currentScreen != AppScreen.SPLASH_ANIMATED_2SEC && currentScreen != AppScreen.SPLASH_ONBOARDING) {
                                  TopAppBar(
                                      navigationIcon = { IconButton(onClick = { scope.launch { drawerState.open() } }) { Icon(Icons.Default.Menu, contentDescription = "Menu") } },
                                      title = { Text(AppStrings.get("app_name", currentLanguage), fontSize = 18.sp, fontWeight = FontWeight.Black, color = QdOrange) },
                                      actions = {
                                          TextButton(onClick = { currentLanguage = if (currentLanguage == Language.AR) Language.FR else Language.AR }) {
                                              Text(if (currentLanguage == Language.AR) "FR" else "عربي", fontWeight = FontWeight.Black, color = QdOrange)
                                          }
                                          if (currentUserUid.isNotEmpty()) {
                                              IconButton(onClick = { auth.signOut(); currentUserUid = ""; isDriverSession = false; currentScreen = AppScreen.SPLASH_ONBOARDING }) {
                                                  Icon(Icons.Default.PowerSettingsNew, contentDescription = "Logout", tint = QdRed)
                                              }
                                          }
                                      },
                                      colors = TopAppBarDefaults.topAppBarColors(containerColor = Color.White)
                                  )
                              }
                          },
                          bottomBar = {
                              if (!isDriverSession && currentScreen in listOf(AppScreen.HOME_EXPLORE, AppScreen.ORDERS_LIST, AppScreen.PROFILE)) {
                                  NavigationBar(containerColor = Color.White, tonalElevation = 8.dp) {
                                      NavigationBarItem(selected = currentScreen == AppScreen.HOME_EXPLORE, onClick = { currentScreen = AppScreen.HOME_EXPLORE }, icon = { Icon(Icons.Default.Home, null) }, label = { Text(AppStrings.get("home_tab", currentLanguage)) })
                                      NavigationBarItem(selected = currentScreen == AppScreen.ORDERS_LIST, onClick = { currentScreen = AppScreen.ORDERS_LIST }, icon = { Icon(Icons.Default.ReceiptLong, null) }, label = { Text(AppStrings.get("orders_tab", currentLanguage)) })
                                      NavigationBarItem(selected = currentScreen == AppScreen.ORDER_TRACKING, onClick = { currentScreen = AppScreen.ORDER_TRACKING }, icon = { Icon(Icons.Default.LocationOn, null) }, label = { Text(AppStrings.get("map_tab", currentLanguage)) })
                                      NavigationBarItem(selected = currentScreen == AppScreen.PROFILE, onClick = { currentScreen = AppScreen.PROFILE }, icon = { Icon(Icons.Default.Person, null) }, label = { Text(AppStrings.get("profile_tab", currentLanguage)) })
                                  }
                              }
                          }
                      ) { padding ->
                          Box(modifier = Modifier.fillMaxSize().padding(padding)) {
                              when (currentScreen) {
                                  AppScreen.SPLASH_ANIMATED_2SEC -> SplashAnimated2SecScreen()
                                  AppScreen.SPLASH_ONBOARDING -> SplashScreen(currentLanguage, { authUserType = AuthUserType.CUSTOMER; isDriverAuthRegister = true; currentScreen = AppScreen.AUTH_FLOW }, { authUserType = AuthUserType.CUSTOMER; isDriverAuthRegister = false; currentScreen = AppScreen.AUTH_FLOW })
                                  AppScreen.AUTH_FLOW -> AuthScreen(currentLanguage, authUserType, isDriverAuthRegister, { name, phone, uid, isDriver ->
                                      currentUserName = name; currentUserPhone = phone; currentUserUid = uid; isDriverSession = isDriver
                                      currentScreen = if (isDriver) AppScreen.DRIVER_DASHBOARD else AppScreen.HOME_EXPLORE
                                  }, { currentScreen = AppScreen.SPLASH_ONBOARDING })
                                  AppScreen.HOME_EXPLORE -> {
                                      if (isDriverSession) currentScreen = AppScreen.DRIVER_DASHBOARD
                                      else HomeScreen(currentLanguage, "العفرون (البليدة)", allStores, searchQuery, { searchQuery = it }, activeCategoryFilter, { activeCategoryFilter = it }, isOrderNowExpanded, { isOrderNowExpanded = !isOrderNowExpanded }, { currentSelectedStore = it; cartItems.clear(); currentScreen = AppScreen.STORE_MENU }, { showCustomOrderDialog = true })
                                  }
                                  AppScreen.STORE_MENU -> StoreMenuScreen(currentLanguage, currentSelectedStore, cartItems, { item ->
                                      val exist = cartItems.find { it.item.id == item.id }
                                      if (exist != null) exist.quantity++ else cartItems.add(CartItem(item, 1))
                                  }, { item ->
                                      val exist = cartItems.find { it.item.id == item.id }
                                      if (exist != null) { if (exist.quantity > 1) exist.quantity-- else cartItems.remove(exist) }
                                  }, { showCustomOrderDialog = true }, { currentScreen = AppScreen.HOME_EXPLORE }, { currentScreen = AppScreen.CONFIRM_ORDER })
                                  AppScreen.CONFIRM_ORDER -> ConfirmOrderScreen(currentLanguage, currentSelectedStore, selectedAddress, cartItems, userLat, userLng, { currentScreen = AppScreen.CHOOSE_ADDRESS }, { currentScreen = AppScreen.STORE_MENU }, { gPrice, dFee, dist, note ->
                                      val orderMap = hashMapOf("restaurant" to currentSelectedStore.nameAr, "customerAddress" to selectedAddress, "goodsPrice" to gPrice, "deliveryFee" to dFee, "distanceKm" to dist, "price" to (gPrice + dFee), "status" to "pending", "customerId" to currentUserUid, "customerName" to currentUserName, "customerPhone" to currentUserPhone, "note" to note)
                                      db.collection("orders").add(orderMap)
                                      cartItems.clear()
                                      currentScreen = AppScreen.ORDER_TRACKING
                                  })
                                  AppScreen.ORDER_TRACKING -> {
                                      val runningOrder = activeOrders.lastOrNull() ?: ActiveOrder(restaurant = currentSelectedStore.nameAr, address = selectedAddress)
                                      OrderTrackingScreen(currentLanguage, runningOrder, { currentScreen = AppScreen.HOME_EXPLORE }, { currentChatOrderId = runningOrder.id; showChatModal = true }, { if (runningOrder.id.isNotBlank()) db.collection("orders").document(runningOrder.id).update("status", "completed") }, { if (runningOrder.id.isNotBlank()) db.collection("orders").document(runningOrder.id).delete(); currentScreen = AppScreen.HOME_EXPLORE })
                                  }
                                  AppScreen.ORDERS_LIST -> OrdersListScreen(currentLanguage, activeOrders) { currentScreen = AppScreen.ORDER_TRACKING }
                                  AppScreen.CHOOSE_ADDRESS -> ChooseAddressScreen(currentLanguage, selectedAddress, { selectedAddress = it; currentScreen = AppScreen.CONFIRM_ORDER }, { currentScreen = AppScreen.CONFIRM_ORDER })
                                  AppScreen.PROFILE -> ProfileScreen(currentLanguage, currentUserName, currentUserPhone, { showEditPhoneDialog = true }, { auth.signOut(); currentUserUid = ""; isDriverSession = false; currentScreen = AppScreen.SPLASH_ONBOARDING })
                                  AppScreen.DRIVER_DASHBOARD -> DriverDashboardScreen(currentLanguage, currentUserName, driverEarnings, driverCompletedCount, driverDebt, activeOrders, { ord, status -> db.collection("orders").document(ord.id).update("status", status) }, { ord -> db.collection("orders").document(ord.id).update("status", "delivered") }, { ord -> currentChatOrderId = ord.id; showChatModal = true }, { showPayDebtDialog = true })
                              }

                              if (showCustomOrderDialog) {
                                  CustomOrderDialog({ showCustomOrderDialog = false }) { storeName, items, totalEstimated ->
                                      val summary = items.joinToString(" + ") { "${it.itemName} (x${it.quantity})" }
                                      cartItems.add(CartItem(MenuItem("c_${System.currentTimeMillis()}", "$storeName: $summary", "Commande", "طلب خاص", "Spécial", totalEstimated, "📝", "custom"), 1))
                                      showCustomOrderDialog = false
                                  }
                              }
                              if (showPayDebtDialog) PayDebtDialog(driverDebt) { showPayDebtDialog = false }
                              incomingDriverAlertOrder?.let { inc ->
                                  DriverIncomingOrderDialog(currentLanguage, inc, {
                                      db.collection("orders").document(inc.id).update(mapOf("status" to "accepted", "driverName" to currentUserName, "driverPhone" to currentUserPhone))
                                      incomingDriverAlertOrder = null
                                  }, { incomingDriverAlertOrder = null })
                              }
                              if (showChatModal) {
                                  ChatModalDialog(currentUserUid, liveChatMessages, { txt ->
                                      if (currentChatOrderId.isNotBlank()) {
                                          db.collection("orders").document(currentChatOrderId).collection("messages").add(mapOf("sender" to currentUserUid, "senderName" to (if (isDriverSession) "عامل التوصيل" else currentUserName), "text" to txt, "time" to "12:00", "timestamp" to com.google.firebase.firestore.FieldValue.serverTimestamp()))
                                      }
                                  }, { showChatModal = false })
                              }
                              if (showEditPhoneDialog) EditPhoneDialog(currentUserPhone, { showEditPhoneDialog = false }) { newPhone -> currentUserPhone = newPhone; if (currentUserUid.isNotEmpty()) db.collection("users").document(currentUserUid).update("phoneNumber", newPhone); showEditPhoneDialog = false }
                          }
                      }
                  }
              }
          }

