                              storesList.add(StoreItem("2", "مطعم السلطان للشواء", 36.4675, 2.6280))
                              storesList.add(StoreItem("3", "طاكوس الأصيل", 36.4660, 2.6250))
                          }
                      }
                  }
              }

              LaunchedEffect(auth.currentUser) {
                  val user = auth.currentUser
                  if (user != null) {
                      currentUserUid = user.uid
                      try {
                          val userDoc = db.collection("users").document(user.uid).get().await()
                          if (userDoc.exists()) {
