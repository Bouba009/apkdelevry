          package com.elaffroun.delivery

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import com.google.firebase.auth.ktx.auth
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.ktx.firestore
          import com.google.firebase.ktx.Firebase

          class DeliveryBackgroundService : Service() {
              private var ordersListener: ListenerRegistration? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  DeliveryNotificationHelper.initChannels(this)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification = createServiceNotification()
                  startForeground(999, notification)
                  startListeningToOrders()
                  return START_STICKY
              }

              private fun createServiceNotification(): Notification {
                  val intent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  return NotificationCompat.Builder(this, DeliveryNotificationHelper.CHANNEL_STATUS_ID)
                      .setContentTitle("el affroun delevry قيد التشغيل")
                      .setContentText("المراقبة الحية للطلبات والمسارات نشطة في الخلفية")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }

              private fun startListeningToOrders() {
                  val db = Firebase.firestore

                  ordersListener?.remove()
                  ordersListener = db.collection("orders")
                      .whereEqualTo("status", "pending")
                      .addSnapshotListener { snapshots, e ->
                          if (e != null || snapshots == null) return@addSnapshotListener
                          for (dc in snapshots.documentChanges) {
                              if (dc.type == DocumentChange.Type.ADDED) {
                                  val restaurant = dc.document.getString("restaurant") ?: "متجر"
                                  val price = dc.document.getLong("price") ?: 0L
                                  DeliveryNotificationHelper.sendOrderAlert(
                                      this,
                                      "طلب جديد وارد الآن! 🛵",
                                      "من: $restaurant - التوصيل: $price دج. اضغط للموافقة!"
                                  )
                                  SoundHelper.playNotificationTone()
                              }
                          }
                      }
              }

              override fun onDestroy() {
                  ordersListener?.remove()
                  super.onDestroy()
              }
          }
