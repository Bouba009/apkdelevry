name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android Licenses & Setup SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Scaffold Complete Native Project
        run: |
          mkdir -p .gradle
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ElaffrounDelivery"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">العفرون أونلاين ديليفري</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ElaffrounDelivery" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FF7E00</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.elaffroun.delivery"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.elaffroun.delivery"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  debug {
                      isDebuggable = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.google.android.gms:play-services-location:21.2.0")
          }
          EOF

          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ElaffrounDelivery">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:theme="@style/Theme.ElaffrounDelivery">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/java/com/elaffroun/delivery
          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/MainActivity.kt
          package com.elaffroun.delivery

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import androidx.core.content.ContextCompat
          import com.google.android.gms.location.LocationServices
          import kotlin.math.*

          val PrimaryColor = Color(0xFFFF7E00.toInt())
          val PrimaryDarkColor = Color(0xFFE06B00.toInt())
          val AppDarkBackground = Color(0xFF0D0D11.toInt())
          val CardDarkBackground = Color(0xFF16161E.toInt())
          val CardBorderDark = Color(0xFF262630.toInt())
          val AccentGreen = Color(0xFF10B981.toInt())
          val AccentRed = Color(0xFFEF4444.toInt())
          val AccentBlue = Color(0xFF3B82F6.toInt())

          data class StoreItem(val id: String, val name: String, val lat: Double, val lng: Double)
          data class OrderProduct(val name: String, val qty: Int)
          data class ChatMessage(val sender: String, val text: String, val time: String)
          data class Order(
              val id: String,
              val restaurant: String,
              val customerAddress: String,
              val price: Int,
              val items: List<OrderProduct>,
              val note: String,
              val status: String,
              val driverName: String = "",
              val driverPhone: String = "",
              val storeLat: Double = 36.4686,
              val storeLng: Double = 2.6288,
              val custLat: Double = 36.4686,
              val custLng: Double = 2.6288
          )

          enum class AppScreen { LANDING, AUTH, CUSTOMER_DASHBOARD, DRIVER_DASHBOARD, ADMIN_PANEL }
          enum class UserRole { CUSTOMER, DRIVER, ADMIN }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      ElaffrounAppRoot()
                  }
              }
          }

          fun calculateDeliveryPrice(distKm: Double): Int {
              val blocks = ceil(distKm / 0.5).toInt()
              val price = blocks * 50
              return if (price < 50) 50 else price
          }

          fun getDistanceInKm(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
              val r = 6371.0
              val dLat = Math.toRadians(lat2 - lat1)
              val dLon = Math.toRadians(lon2 - lon1)
              val a = sin(dLat / 2.0).pow(2.0) +
                      cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) *
                      sin(dLon / 2.0).pow(2.0)
              val c = 2.0 * atan2(sqrt(a), sqrt(1.0 - a))
              return r * c
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ElaffrounAppRoot() {
              val context = LocalContext.current
              var isDarkMode by remember { mutableStateOf(true) }
              var currentScreen by remember { mutableStateOf(AppScreen.LANDING) }
              var userRole by remember { mutableStateOf(UserRole.CUSTOMER) }
              var userLoggedIn by remember { mutableStateOf(false) }
              var currentUserName by remember { mutableStateOf("") }
              var currentUserPhone by remember { mutableStateOf("") }

              val initialStores = remember {
                  mutableStateListOf(
                      StoreItem("1", "بيتزا هاوس العفرون", 36.4690, 2.6295),
                      StoreItem("2", "مطعم السلطان للشواء", 36.4675, 2.6280),
                      StoreItem("3", "فاست فود السعادة", 36.4710, 2.6320),
                      StoreItem("4", "طاكوس وحلويات الأصيل", 36.4660, 2.6250)
                  )
              }

              val activeOrders = remember { mutableStateListOf<Order>() }
              val chatMessages = remember { mutableStateListOf<ChatMessage>() }
              var pendingIncomingOrder by remember { mutableStateOf<Order?>(null) }

              var showOrderDialog by remember { mutableStateOf(false) }
              var showHistoryDialog by remember { mutableStateOf(false) }
              var showRatingDialog by remember { mutableStateOf(false) }
              var showChatDialog by remember { mutableStateOf(false) }
              var showInfoDialog by remember { mutableStateOf(false) }
              var infoDialogTitle by remember { mutableStateOf("") }
              var infoDialogMessage by remember { mutableStateOf("") }

              var driverEarnings by remember { mutableStateOf(0) }
              var driverCompletedCount by remember { mutableStateOf(0) }
              var driverDebt by remember { mutableStateOf(0) }

              var currentLatitude by remember { mutableStateOf(36.4686) }
              var currentLongitude by remember { mutableStateOf(2.6288) }
              var isGpsDetected by remember { mutableStateOf(false) }

              val fusedLocationClient = remember { LocationServices.getFusedLocationProviderClient(context) }
              val locationPermissionLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.RequestMultiplePermissions()
              ) { permissions ->
                  val fine = permissions[Manifest.permission.ACCESS_FINE_LOCATION] ?: false
                  val coarse = permissions[Manifest.permission.ACCESS_COARSE_LOCATION] ?: false
                  if (fine || coarse) {
                      try {
                          fusedLocationClient.lastLocation.addOnSuccessListener { loc ->
                              if (loc != null) {
                                  currentLatitude = loc.latitude
                                  currentLongitude = loc.longitude
                                  isGpsDetected = true
                              }
                          }
                      } catch (e: Exception) {
                          // Handle safely
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  val fineGranted = ContextCompat.checkSelfPermission(
                      context, Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED
                  if (fineGranted) {
                      try {
                          fusedLocationClient.lastLocation.addOnSuccessListener { loc ->
                              if (loc != null) {
                                  currentLatitude = loc.latitude
                                  currentLongitude = loc.longitude
                                  isGpsDetected = true
                              }
                          }
                      } catch (e: Exception) {
                          // Ignore failure
                      }
                  } else {
                      locationPermissionLauncher.launch(
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          )
                      )
                  }
              }

              val colorScheme = if (isDarkMode) {
                  darkColorScheme(
                      primary = PrimaryColor,
                      background = AppDarkBackground,
                      surface = CardDarkBackground,
                      onPrimary = Color.White,
                      onBackground = Color.White,
                      onSurface = Color.White
                  )
              } else {
                  lightColorScheme(
                      primary = PrimaryColor,
                      background = Color(0xFFF8FAFC.toInt()),
                      surface = Color.White,
                      onPrimary = Color.White,
                      onBackground = Color(0xFF0F172A.toInt()),
                      onSurface = Color(0xFF0F172A.toInt())
                  )
              }

              MaterialTheme(colorScheme = colorScheme) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = MaterialTheme.colorScheme.background
                  ) {
                      Column(modifier = Modifier.fillMaxSize()) {
                          TopAppBar(
                              title = {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .size(36.dp)
                                              .clip(CircleShape)
                                              .background(PrimaryColor),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Icon(
                                              imageVector = Icons.Default.TwoWheeler,
                                              contentDescription = "Logo",
                                              tint = Color.White,
                                              modifier = Modifier.size(20.dp)
                                          )
                                      }
                                      Text(
                                          text = "العفرون ديليفري",
                                          fontSize = 17.sp,
                                          fontWeight = FontWeight.Black,
                                          color = PrimaryColor
                                      )
                                  }
                              },
                              actions = {
                                  IconButton(onClick = { isDarkMode = !isDarkMode }) {
                                      Icon(
                                          imageVector = if (isDarkMode) Icons.Default.LightMode else Icons.Default.DarkMode,
                                          contentDescription = "Theme",
                                          tint = if (isDarkMode) Color.Yellow else MaterialTheme.colorScheme.onSurface
                                      )
                                  }
                                  if (userLoggedIn) {
                                      IconButton(onClick = {
                                          userLoggedIn = false
                                          currentUserName = ""
                                          currentUserPhone = ""
                                          currentScreen = AppScreen.LANDING
                                      }) {
                                          Icon(
                                              imageVector = Icons.Default.ExitToApp,
                                              contentDescription = "Logout",
                                              tint = AccentRed
                                          )
                                      }
                                  }
                              },
                              colors = TopAppBarDefaults.topAppBarColors(
                                  containerColor = MaterialTheme.colorScheme.surface
                              )
                          )

                          Box(modifier = Modifier.weight(1f)) {
                              when (currentScreen) {
                                  AppScreen.LANDING -> {
                                      LandingScreen(
                                          onOrderNow = {
                                              userRole = UserRole.CUSTOMER
                                              currentScreen = AppScreen.AUTH
                                          },
                                          onJoinDriver = {
                                              userRole = UserRole.DRIVER
                                              currentScreen = AppScreen.AUTH
                                          },
                                          onOpenAdmin = {
                                              currentScreen = AppScreen.AUTH
                                              userRole = UserRole.ADMIN
                                          }
                                      )
                                  }
                                  AppScreen.AUTH -> {
                                      AuthScreen(
                                          role = userRole,
                                          onLoginSuccess = { name, phone ->
                                              currentUserName = name
                                              currentUserPhone = phone
                                              userLoggedIn = true
                                              currentScreen = when (userRole) {
                                                  UserRole.CUSTOMER -> AppScreen.CUSTOMER_DASHBOARD
                                                  UserRole.DRIVER -> AppScreen.DRIVER_DASHBOARD
                                                  UserRole.ADMIN -> AppScreen.ADMIN_PANEL
                                              }
                                          },
                                          onCancel = { currentScreen = AppScreen.LANDING }
                                      )
                                  }
                                  AppScreen.CUSTOMER_DASHBOARD -> {
                                      CustomerDashboard(
                                          userName = currentUserName,
                                          activeOrders = activeOrders,
                                          onOpenNewOrder = { showOrderDialog = true },
                                          onOpenHistory = { showHistoryDialog = true },
                                          onOpenChat = { showChatDialog = true },
                                          onConfirmDelivered = { order ->
                                              val idx = activeOrders.indexOfFirst { it.id == order.id }
                                              if (idx != -1) {
                                                  activeOrders[idx] = order.copy(status = "completed")
                                              }
                                              showRatingDialog = true
                                          },
                                          onCancelOrder = { order ->
                                              activeOrders.removeAll { it.id == order.id }
                                          }
                                      )
                                  }
                                  AppScreen.DRIVER_DASHBOARD -> {
                                      DriverDashboard(
                                          driverName = currentUserName,
                                          driverPhone = currentUserPhone,
                                          activeOrders = activeOrders,
                                          earnings = driverEarnings,
                                          completedCount = driverCompletedCount,
                                          debt = driverDebt,
                                          onAcceptOrder = { order ->
                                              val idx = activeOrders.indexOfFirst { it.id == order.id }
                                              if (idx != -1) {
                                                  activeOrders[idx] = order.copy(
                                                      status = "accepted",
                                                      driverName = currentUserName,
                                                      driverPhone = currentUserPhone
                                                  )
                                              }
                                              pendingIncomingOrder = null
                                          },
                                          onUpdateStatus = { order, newStatus ->
                                              val idx = activeOrders.indexOfFirst { it.id == order.id }
                                              if (idx != -1) {
                                                  activeOrders[idx] = order.copy(status = newStatus)
                                              }
                                          },
                                          onFinishDelivery = { order ->
                                              val idx = activeOrders.indexOfFirst { it.id == order.id }
                                              if (idx != -1) {
                                                  activeOrders[idx] = order.copy(status = "delivered")
                                                  driverEarnings += order.price
                                                  driverCompletedCount += 1
                                                  val dist = getDistanceInKm(
                                                      order.storeLat, order.storeLng,
                                                      order.custLat, order.custLng
                                                  )
                                                  driverDebt += (dist * 10.0).roundToInt()
                                              }
                                          },
                                          onOpenChat = { showChatDialog = true },
                                          onOpenHistory = { showHistoryDialog = true }
                                      )
                                  }
                                  AppScreen.ADMIN_PANEL -> {
                                      AdminPanelScreen(
                                          stores = initialStores,
                                          orders = activeOrders,
                                          onAddStore = { name, lat, lng ->
                                              initialStores.add(
                                                  StoreItem((initialStores.size + 1).toString(), name, lat, lng)
                                              )
                                          },
                                          onBackToHome = { currentScreen = AppScreen.LANDING }
                                      )
                                  }
                              }

                              pendingIncomingOrder?.let { incoming ->
                                  DriverIncomingOrderModal(
                                      order = incoming,
                                      onAccept = {
                                          val idx = activeOrders.indexOfFirst { it.id == incoming.id }
                                          if (idx != -1) {
                                              activeOrders[idx] = incoming.copy(
                                                  status = "accepted",
                                                  driverName = currentUserName,
                                                  driverPhone = currentUserPhone
                                              )
                                          }
                                          pendingIncomingOrder = null
                                      },
                                      onReject = {
                                          pendingIncomingOrder = null
                                      }
                                  )
                              }

                              if (showOrderDialog) {
                                  CreateOrderDialog(
                                      stores = initialStores,
                                      userLat = currentLatitude,
                                      userLng = currentLongitude,
                                      onDismiss = { showOrderDialog = false },
                                      onSubmitOrder = { newOrder ->
                                          activeOrders.add(newOrder)
                                          pendingIncomingOrder = newOrder
                                          showOrderDialog = false
                                      }
                                  )
                              }

                              if (showHistoryDialog) {
                                  HistoryDialog(
                                      orders = activeOrders,
                                      onDismiss = { showHistoryDialog = false }
                                  )
                              }

                              if (showRatingDialog) {
                                  RatingDialog(
                                      onDismiss = { showRatingDialog = false },
                                      onRated = {
                                          showRatingDialog = false
                                          infoDialogTitle = "شكراً لتقييمك"
                                          infoDialogMessage = "تم تسجيل تقييمك لعامل التوصيل بنجاح لمساعدتنا على تحسين الخدمة."
                                          showInfoDialog = true
                                      }
                                  )
                              }

                              if (showChatDialog) {
                                  ChatDialog(
                                      senderRole = if (userRole == UserRole.CUSTOMER) "الزبون" else "السائق",
                                      messages = chatMessages,
                                      onSendMessage = { text ->
                                          val time = "الآن"
                                          val sender = if (userRole == UserRole.CUSTOMER) "الزبون" else "السائق"
                                          chatMessages.add(ChatMessage(sender, text, time))
                                      },
                                      onDismiss = { showChatDialog = false }
                                  )
                              }

                              if (showInfoDialog) {
                                  AlertDialog(
                                      onDismissRequest = { showInfoDialog = false },
                                      title = { Text(text = infoDialogTitle, fontWeight = FontWeight.Bold) },
                                      text = { Text(text = infoDialogMessage, fontSize = 13.sp) },
                                      confirmButton = {
                                          TextButton(onClick = { showInfoDialog = false }) {
                                              Text(text = "حسناً", color = PrimaryColor, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LandingScreen(
              onOrderNow: () -> Unit,
              onJoinDriver: () -> Unit,
              onOpenAdmin: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Box(
                      modifier = Modifier
                          .size(110.dp)
                          .clip(CircleShape)
                          .background(PrimaryColor),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(
                          imageVector = Icons.Default.TwoWheeler,
                          contentDescription = "Logo",
                          tint = Color.White,
                          modifier = Modifier.size(60.dp)
                      )
                  }

                  Spacer(modifier = Modifier.height(24.dp))

                  Text(
                      text = "العفرون أونلاين ديليفري",
                      fontSize = 26.sp,
                      fontWeight = FontWeight.Black,
                      color = PrimaryColor,
                      textAlign = TextAlign.Center
                  )

                  Spacer(modifier = Modifier.height(10.dp))

                  Text(
                      text = "المنصة الأحدث لتتبع وتوصيل طلباتك في العفرون وضواحيها بكل سلاسة، أمان وسرعة حقيقية.",
                      fontSize = 14.sp,
                      textAlign = TextAlign.Center,
                      color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.75f),
                      lineHeight = 22.sp
                  )

                  Spacer(modifier = Modifier.height(36.dp))

                  Button(
                      onClick = onOrderNow,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(54.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = PrimaryColor)
                  ) {
                      Icon(imageVector = Icons.Default.ShoppingBag, contentDescription = null)
                      Spacer(modifier = Modifier.width(8.dp))
                      Text(text = "اطلب الآن (زبون)", fontWeight = FontWeight.Bold, fontSize = 15.sp)
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  OutlinedButton(
                      onClick = onJoinDriver,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(54.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.outlinedButtonColors(contentColor = PrimaryColor)
                  ) {
                      Icon(imageVector = Icons.Default.DeliveryDining, contentDescription = null)
                      Spacer(modifier = Modifier.width(8.dp))
                      Text(text = "انضم كعامل توصيل", fontWeight = FontWeight.Bold, fontSize = 15.sp)
                  }

                  Spacer(modifier = Modifier.height(28.dp))

                  TextButton(onClick = onOpenAdmin) {
                      Text(
                          text = "دخول بوابة الإدارة",
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.5f),
                          fontSize = 12.sp
                      )
                  }
              }
          }

          @Composable
          fun AuthScreen(
              role: UserRole,
              onLoginSuccess: (name: String, phone: String) -> Unit,
              onCancel: () -> Unit
          ) {
              var isRegisterMode by remember { mutableStateOf(false) }
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var confirmPassword by remember { mutableStateOf("") }
              var termsAccepted by remember { mutableStateOf(false) }
              var ageAccepted by remember { mutableStateOf(false) }
              var errorMessage by remember { mutableStateOf("") }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  item {
                      Text(
                          text = if (role == UserRole.ADMIN) "تسجيل دخول الإدارة"
                          else if (isRegisterMode) "إنشاء حساب جديد" else "تسجيل الدخول",
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Black,
                          color = PrimaryColor
                      )

                      Text(
                          text = when (role) {
                              UserRole.CUSTOMER -> "بوابة حسابات الزبائن"
                              UserRole.DRIVER -> "بوابة عمال التوصيل"
                              UserRole.ADMIN -> "تحقق رقمي محمي للإدارة"
                          },
                          fontSize = 12.sp,
                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f),
                          modifier = Modifier.padding(top = 4.dp, bottom = 20.dp)
                      )

                      if (isRegisterMode) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("الاسم الكامل") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = phone,
                              onValueChange = { phone = it },
                              label = { Text("رقم الهاتف") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                      }

                      OutlinedTextField(
                          value = email,
                          onValueChange = { email = it },
                          label = { Text(if (role == UserRole.ADMIN) "اسم المستخدم" else "البريد الإلكتروني") },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedTextField(
                          value = password,
                          onValueChange = { password = it },
                          label = { Text("كلمة المرور") },
                          visualTransformation = PasswordVisualTransformation(),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      if (isRegisterMode) {
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = confirmPassword,
                              onValueChange = { confirmPassword = it },
                              label = { Text("تأكيد كلمة المرور") },
                              visualTransformation = PasswordVisualTransformation(),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(14.dp))

                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Checkbox(checked = termsAccepted, onCheckedChange = { termsAccepted = it })
                              Text(
                                  text = "أوافق على سياسة الاستخدام والأسعار (50 دج / 500م)",
                                  fontSize = 11.sp,
                                  lineHeight = 16.sp
                              )
                          }

                          if (role == UserRole.DRIVER) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Checkbox(checked = ageAccepted, onCheckedChange = { ageAccepted = it })
                                  Text(
                                      text = "أصرح أن عمري فوق 18 سنة وألتزم بسداد ديون المنصة",
                                      fontSize = 11.sp,
                                      lineHeight = 16.sp
                                  )
                              }
                          }
                      }

                      if (errorMessage.isNotEmpty()) {
                          Text(
                              text = errorMessage,
                              color = AccentRed,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(vertical = 8.dp)
                          )
                      }

                      Spacer(modifier = Modifier.height(18.dp))

                      Button(
                          onClick = {
                              errorMessage = ""
                              if (role == UserRole.ADMIN) {
                                  if (email == "admin009" && password == "abobob123") {
                                      onLoginSuccess("المسؤول العام", "0555000000")
                                  } else {
                                      errorMessage = "بيانات الإدارة غير صحيحة"
                                  }
                                  return@Button
                              }

                              if (isRegisterMode) {
                                  if (name.isBlank() || phone.isBlank() || email.isBlank() || password.isBlank()) {
                                      errorMessage = "يرجى ملء جميع الحقول المطلوبة"
                                      return@Button
                                  }
                                  if (password != confirmPassword) {
                                      errorMessage = "كلمتا المرور غير متطابقتين"
                                      return@Button
                                  }
                                  if (!termsAccepted) {
                                      errorMessage = "يجب الموافقة على شروط الاستخدام"
                                      return@Button
                                  }
                                  if (role == UserRole.DRIVER && !ageAccepted) {
                                      errorMessage = "يجب تأكيد السن فوق 18 سنة"
                                      return@Button
                                  }
                                  onLoginSuccess(name, phone)
                              } else {
                                  if (email.isBlank() || password.isBlank()) {
                                      errorMessage = "يرجى إدخال البريد وكلمة المرور"
                                      return@Button
                                  }
                                  val fallbackName = if (role == UserRole.DRIVER) "سائق العفرون" else "زبون العفرون"
                                  val fallbackPhone = "0555123456"
                                  onLoginSuccess(fallbackName, fallbackPhone)
                              }
                          },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(50.dp),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = PrimaryColor)
                      ) {
                          Text(
                              text = if (isRegisterMode) "تسجيل حساب جديد" else "تسجيل الدخول",
                              fontWeight = FontWeight.Bold,
                              fontSize = 14.sp
                          )
                      }

                      if (role != UserRole.ADMIN) {
                          TextButton(onClick = { isRegisterMode = !isRegisterMode }) {
                              Text(
                                  text = if (isRegisterMode) "لديك حساب بالفعل؟ سجل دخولك" else "ليس لديك حساب؟ أنشئ حسابك الآن",
                                  fontSize = 12.sp,
                                  color = PrimaryColor
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedButton(
                          onClick = onCancel,
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Text(text = "إلغاء والعودة للرئيسية", fontSize = 13.sp)
                      }
                  }
              }
          }

