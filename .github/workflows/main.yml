                          Button(
                              onClick = { onConfirmOrder(deliveryFee, orderNote) },
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(54.dp),
                              shape = RoundedCornerShape(16.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
