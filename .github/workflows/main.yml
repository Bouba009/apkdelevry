          @Composable
          fun SplashAnimated2SecScreen() {
              Box(modifier = Modifier.fillMaxSize().background(Color.White), contentAlignment = Alignment.Center) {
                  AsyncImage(model = REMOTE_SPLASH_IMG, contentDescription = "QuickDeliver", contentScale = ContentScale.Fit, modifier = Modifier.fillMaxSize())
              }
          }

          @Composable
          fun BeautifulVoyagerRoadMap(centerLat: Double, centerLng: Double, destinationLat: Double, destinationLng: Double) {
              val context = LocalContext.current
              var roadWaypoints by remember { mutableStateOf<List<GeoPoint>>(emptyList()) }
              LaunchedEffect(centerLat, centerLng, destinationLat, destinationLng) {
                  roadWaypoints = MapUtils.fetchOsrmRoadPath(centerLat, centerLng, destinationLat, destinationLng)
              }
              AndroidView(
                  modifier = Modifier.fillMaxSize(),
                  factory = { ctx ->
                      MapView(ctx).apply {
                          setTileSource(MapUtils.FreeOfficialMapnikTileSource)
                          setMultiTouchControls(true)
                          controller.setZoom(15.2)
                          controller.setCenter(GeoPoint(centerLat, centerLng))
                      }
                  },
                  update = { mapView ->
                      mapView.overlays.clear()
                      val userMarker = Marker(mapView).apply { position = GeoPoint(centerLat, centerLng); setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM); icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#1E2024"), "🏠") }
                      val storeMarker = Marker(mapView).apply { position = GeoPoint(destinationLat, destinationLng); setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM); icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF5E00"), "🍴") }
                      mapView.overlays.add(userMarker)
                      mapView.overlays.add(storeMarker)
                      if (roadWaypoints.isNotEmpty()) {
                          val polyline = Polyline(mapView).apply { roadWaypoints.forEach { addPoint(it) }; outlinePaint.color = android.graphics.Color.parseColor("#FF5E00"); outlinePaint.strokeWidth = 12f }
                          mapView.overlays.add(polyline)
                      }
                      mapView.invalidate()
                  }
              )
          }

          @Composable
          fun HomeScreen(
              lang: Language, selectedCity: String, stores: List<StoreItem>, searchQuery: String, onSearchQueryChange: (String) -> Unit,
              activeCategory: String, onCategorySelect: (String) -> Unit, isOrderNowExpanded: Boolean, onOrderNowClick: () -> Unit,
              onSelectStore: (StoreItem) -> Unit, onCustomOrderClick: () -> Unit
          ) {
              val pulseAnim = rememberInfiniteTransition(label = "CustomOrderPulse")
              val customBtnScale by pulseAnim.animateFloat(initialValue = 0.98f, targetValue = 1.03f, animationSpec = infiniteRepeatable(animation = tween(900, easing = FastOutSlowInEasing), repeatMode = RepeatMode.Reverse), label = "Scale")
              val filtered = stores.filter { (activeCategory == "all" || it.category == activeCategory) && (searchQuery.isBlank() || it.nameAr.contains(searchQuery, true)) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item { Spacer(modifier = Modifier.height(6.dp)); Text(selectedCity, fontWeight = FontWeight.Bold, fontSize = 16.sp) }
