                          }
                      }
                  }
                  if (isOrderNowExpanded) {
                      item {
                          Card(modifier = Modifier.fillMaxWidth().scale(customBtnScale).shadow(8.dp, RoundedCornerShape(20.dp)).clickable { onCustomOrderClick() }, shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color.Transparent)) {
                              Box(modifier = Modifier.fillMaxWidth().background(Brush.horizontalGradient(listOf(Color(0xFFFF5E00), Color(0xFFFF8A00)))).padding(16.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(AppStrings.get("custom_order_title", lang), color = Color.White, fontWeight = FontWeight.Black, fontSize = 16.sp)
                                          Text(AppStrings.get("custom_order_sub", lang), color = Color.White.copy(alpha = 0.9f), fontSize = 11.sp)
                                      }
                                      Box(modifier = Modifier.clip(RoundedCornerShape(10.dp)).background(Color.White).padding(horizontal = 10.dp, vertical = 6.dp)) {
                                          Text(AppStrings.get("custom_order_btn", lang), color = QdOrange, fontWeight = FontWeight.Black, fontSize = 11.sp)
                                      }
                                  }
                              }
                          }
                      }
                      item { OutlinedTextField(value = searchQuery, onValueChange = onSearchQueryChange, placeholder = { Text(AppStrings.get("search_placeholder", lang)) }, leadingIcon = { Icon(Icons.Default.Search, null, tint = QdOrange) }, modifier = Modifier.fillMaxWidth().height(50.dp), shape = RoundedCornerShape(12.dp), singleLine = true) }
                      item {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              CategoryItem(Icons.Default.Apps, AppStrings.get("cat_all", lang), activeCategory == "all") { onCategorySelect("all") }
                              CategoryItem(Icons.Default.Restaurant, AppStrings.get("cat_restaurants", lang), activeCategory == "restaurant") { onCategorySelect("restaurant") }
                              CategoryItem(Icons.Default.ShoppingCart, AppStrings.get("cat_grocery", lang), activeCategory == "grocery") { onCategorySelect("grocery") }
                              CategoryItem(Icons.Default.AddBox, AppStrings.get("cat_pharmacy", lang), activeCategory == "pharmacy") { onCategorySelect("pharmacy") }
                          }
                      }
                      items(filtered) { store ->
                          Card(modifier = Modifier.fillMaxWidth().clickable { onSelectStore(store) }, shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color.White), border = CardDefaults.outlinedCardBorder()) {
