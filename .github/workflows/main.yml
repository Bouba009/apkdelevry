          fun calculateDeliveryFee(distKm: Double): Int {
              val blocks = ceil(distKm / 0.5).toInt()
              val fee = blocks * 50
              return if (fee < 50) 50 else fee
          }

          fun getDistanceInKm(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
              val r = 6371.0
              val dLat = Math.toRadians(lat2 - lat1)
              val dLon = Math.toRadians(lon2 - lon1)
              val a = sin(dLat / 2.0).pow(2.0) + cos(Math.toRadians(lat1)) * cos(Math.toRadians(lat2)) * sin(dLon / 2.0).pow(2.0)
              return r * (2.0 * atan2(sqrt(a), sqrt(1.0 - a)))
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun QuickDeliverUltimateApp() {
              val context = LocalContext.current
              val auth = remember { Firebase.auth }
              val db = remember { Firebase.firestore }
              val scope = rememberCoroutineScope()
              val drawerState = rememberDrawerState(initialValue = DrawerValue.Closed)

              var currentLanguage by remember { mutableStateOf(Language.AR) }
              var currentScreen by remember { mutableStateOf(AppScreen.SPLASH_ANIMATED_2SEC) }
              var authUserType by remember { mutableStateOf(AuthUserType.CUSTOMER) }
              var isDriverAuthRegister by remember { mutableStateOf(false) }

              var currentUserName by remember { mutableStateOf("") }
              var currentUserPhone by remember { mutableStateOf("") }
              var currentUserUid by remember { mutableStateOf(auth.currentUser?.uid ?: "") }
              var isDriverSession by remember { mutableStateOf(false) }

              LaunchedEffect(Unit) {
                  delay(2000)
                  if (auth.currentUser != null) {
                      currentUserUid = auth.currentUser!!.uid
                      db.collection("users").document(currentUserUid).get()
                          .addOnSuccessListener { doc ->
                              if (doc.exists()) {
                                  currentUserName = doc.getString("name") ?: ""
                                  currentUserPhone = doc.getString("phoneNumber") ?: ""
                                  isDriverSession = (doc.getString("role") == "driver")
                                  currentScreen = if (isDriverSession) AppScreen.DRIVER_DASHBOARD else AppScreen.HOME_EXPLORE
                              } else {
                                  currentScreen = AppScreen.HOME_EXPLORE
                              }
                          }
                          .addOnFailureListener { currentScreen = AppScreen.HOME_EXPLORE }
                  } else {
                      currentScreen = AppScreen.SPLASH_ONBOARDING
                  }
              }

              var userLat by remember { mutableStateOf(36.4686) }
              var userLng by remember { mutableStateOf(2.6288) }
              var selectedAddress by remember { mutableStateOf("حي النصر، العفرون") }

              val allStores = remember {
                  mutableStateListOf(
                      StoreItem("1", "بيتزا هاوس العفرون", "Pizza House", "restaurant", "4.8", "20-35 min", "🍕", 36.4690, 2.6295,
                          listOf(
                              MenuItem("p1", "بيتزا مارغريتا", "Pizza Margherita", "صلصة طماطم وجبنة موزاريلا", "Tomate et mozzarella", 600, "🍕", "Pizzas"),
                              MenuItem("p2", "برغر دجاج كرسبي", "Burger Crispy", "دجاج مقرمش مع جبنة شيدر", "Poulet pané", 550, "🍔", "Burgers")
                          )
                      ),
                      StoreItem("4", "سوبرماركت النصر", "Supermarché En-Nasr", "grocery", "4.9", "15-30 min", "🧺", 36.4710, 2.6310,
                          listOf(MenuItem("g1", "حليب بودرة 500غ", "Lait 500g", "حليب عالي الجودة ومغذي", "Lait entier", 420, "🥛", "Épicerie"))
                      ),
                      StoreItem("5", "صيدلية الصحة المركزية", "Pharmacie Centrale", "pharmacy", "4.9", "10-20 min", "💊", 36.4680, 2.6270,
                          listOf(MenuItem("m1", "باراسيتامول 1000 ملغ", "Paracétamol", "مسكن ومضاد للحمى والصداع", "Antalgique", 180, "💊", "Médicaments"))
                      )
                  )
              }

              var currentSelectedStore by remember { mutableStateOf(allStores.first()) }
              val cartItems = remember { mutableStateListOf<CartItem>() }
              var searchQuery by remember { mutableStateOf("") }
              var activeCategoryFilter by remember { mutableStateOf("all") }
              var isOrderNowExpanded by remember { mutableStateOf(false) }

              val activeOrders = remember { mutableStateListOf<ActiveOrder>() }
              var currentChatOrderId by remember { mutableStateOf("") }
              val liveChatMessages = remember { mutableStateListOf<ChatMessage>() }

              var showChatModal by remember { mutableStateOf(false) }
              var showCustomOrderDialog by remember { mutableStateOf(false) }
              var showPayDebtDialog by remember { mutableStateOf(false) }
              var showEditPhoneDialog by remember { mutableStateOf(false) }

              var driverEarnings by remember { mutableStateOf(0) }
              var driverCompletedCount by remember { mutableStateOf(0) }
              var driverDebt by remember { mutableStateOf(0) }
              var incomingDriverAlertOrder by remember { mutableStateOf<ActiveOrder?>(null) }

              val fusedClient = remember { LocationServices.getFusedLocationProviderClient(context) }
              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { permissions ->
                  if (permissions[Manifest.permission.ACCESS_FINE_LOCATION] == true) {
                      try {
                          fusedClient.getCurrentLocation(Priority.PRIORITY_HIGH_ACCURACY, null).addOnSuccessListener { loc ->
                              if (loc != null) { userLat = loc.latitude; userLng = loc.longitude }
                          }
                      } catch (e: Exception) {}
                  }
              }

              LaunchedEffect(Unit) {
                  val perms = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  permLauncher.launch(perms.toTypedArray())
              }

              DisposableEffect(currentUserUid, isDriverSession) {
                  var listener: ListenerRegistration? = null
                  val ordersQuery = if (isDriverSession) db.collection("orders")
                  else if (currentUserUid.isNotEmpty()) db.collection("orders").whereEqualTo("customerId", currentUserUid)
                  else db.collection("orders")

                  listener = ordersQuery.addSnapshotListener { snapshot, error ->
                      if (error != null || snapshot == null) return@addSnapshotListener
                      activeOrders.clear()
                      for (doc in snapshot.documents) {
                          val gPrice = doc.getLong("goodsPrice")?.toInt() ?: 0
                          val dFee = doc.getLong("deliveryFee")?.toInt() ?: (doc.getLong("price")?.toInt() ?: 50)
                          val distKm = doc.getDouble("distanceKm") ?: 1.0
                          val tPrice = doc.getLong("price")?.toInt() ?: (gPrice + dFee)

                          val order = ActiveOrder(
                              id = doc.id,
                              restaurant = doc.getString("restaurant") ?: "",
                              address = doc.getString("customerAddress") ?: "",
                              goodsPrice = gPrice,
                              deliveryFee = dFee,
                              distanceKm = distKm,
                              totalPrice = tPrice,
                              status = doc.getString("status") ?: "pending",
                              driverName = doc.getString("driverName") ?: "",
                              driverPhone = doc.getString("driverPhone") ?: "",
                              customerId = doc.getString("customerId") ?: "",
                              customerName = doc.getString("customerName") ?: "",
                              customerPhone = doc.getString("customerPhone") ?: "",
                              itemsSummary = doc.getString("itemsSummary") ?: "",
                              note = doc.getString("note") ?: "",
                              storeLat = doc.getDouble("storeLat") ?: 36.4690,
                              storeLng = doc.getDouble("storeLng") ?: 2.6295,
                              custLat = doc.getDouble("lat") ?: 36.4686,
                              custLng = doc.getDouble("lng") ?: 2.6288
                          )
                          activeOrders.add(order)

                          if (isDriverSession && incomingDriverAlertOrder?.id == order.id && order.status != "pending") {
                              incomingDriverAlertOrder = null
                          }

                          if (isDriverSession && order.status == "pending" && incomingDriverAlertOrder == null) {
                              incomingDriverAlertOrder = order
                              SoundHelper.triggerBackgroundNotification(context, order.id, order.restaurant, order.goodsPrice, order.deliveryFee, order.distanceKm, order.address)
                              SoundHelper.playUrgentIphoneLikeTone()
                          }
                          if (!isDriverSession && order.status == "received") SoundHelper.playArrivalTone()
                      }

                      if (isDriverSession) {
                          val completed = activeOrders.filter { it.driverPhone.isNotBlank() && it.driverPhone == currentUserPhone && (it.status == "delivered" || it.status == "completed") }
                          driverCompletedCount = completed.size
                          driverEarnings = completed.sumOf { it.deliveryFee }
                          driverDebt = (completed.sumOf { it.distanceKm } * 10.0).roundToInt()
                      }
                  }
                  onDispose { listener?.remove() }
              }

              DisposableEffect(currentChatOrderId) {
                  var chatListener: ListenerRegistration? = null
                  if (currentChatOrderId.isNotBlank()) {
                      chatListener = db.collection("orders").document(currentChatOrderId).collection("messages").orderBy("timestamp")
                          .addSnapshotListener { snap, _ ->
                              if (snap != null) {
                                  liveChatMessages.clear()
                                  for (mDoc in snap.documents) {
                                      liveChatMessages.add(ChatMessage(mDoc.getString("sender") ?: "", mDoc.getString("senderName") ?: "", mDoc.getString("text") ?: "", mDoc.getString("time") ?: ""))
                                  }
                              }
                          }
                  }
                  onDispose { chatListener?.remove() }
              }

              MaterialTheme(colorScheme = lightColorScheme(primary = QdOrange, background = QdBackground, surface = QdCard, onPrimary = Color.White)) {
                  ModalNavigationDrawer(
                      drawerState = drawerState,
                      gesturesEnabled = (currentScreen != AppScreen.SPLASH_ANIMATED_2SEC),
                      drawerContent = {
                          ModalDrawerSheet(modifier = Modifier.width(310.dp), drawerContainerColor = Color.White) {
                              Column(modifier = Modifier.fillMaxSize().padding(20.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      QuickDeliverAppLogo(36.dp)
                                      Text(AppStrings.get("app_name", currentLanguage), fontSize = 18.sp, fontWeight = FontWeight.Black, color = QdOrange)
                                      IconButton(onClick = { scope.launch { drawerState.close() } }) { Icon(Icons.Default.Close, contentDescription = "Close") }
                                  }
                                  Divider(color = QdBorder)
                                  if (!isDriverSession) {
                                      DrawerMenuItem(AppStrings.get("home_tab", currentLanguage), Icons.Default.Home) { scope.launch { drawerState.close() }; currentScreen = AppScreen.HOME_EXPLORE }
                                  }
                                  DrawerMenuItem(AppStrings.get("orders_tab", currentLanguage), Icons.Default.ReceiptLong) { scope.launch { drawerState.close() }; currentScreen = AppScreen.ORDERS_LIST }
                                  DrawerMenuItem(AppStrings.get("profile_tab", currentLanguage), Icons.Default.Person) { scope.launch { drawerState.close() }; currentScreen = AppScreen.PROFILE }
                                  Spacer(modifier = Modifier.weight(1f))
                                  if (!isDriverSession && currentUserUid.isEmpty()) {
                                      Button(onClick = { scope.launch { drawerState.close() }; authUserType = AuthUserType.DRIVER; isDriverAuthRegister = true; currentScreen = AppScreen.AUTH_FLOW }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                                          Text(AppStrings.get("driver_signup", currentLanguage), fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                      }
                  ) {
                      Scaffold(
                          containerColor = QdBackground,
                          topBar = {
                              if (currentScreen != AppScreen.SPLASH_ANIMATED_2SEC && currentScreen != AppScreen.SPLASH_ONBOARDING) {
                                  TopAppBar(
                                      navigationIcon = { IconButton(onClick = { scope.launch { drawerState.open() } }) { Icon(Icons.Default.Menu, contentDescription = "Menu") } },
                                      title = { Text(AppStrings.get("app_name", currentLanguage), fontSize = 18.sp, fontWeight = FontWeight.Black, color = QdOrange) },
                                      actions = {
                                          TextButton(onClick = { currentLanguage = if (currentLanguage == Language.AR) Language.FR else Language.AR }) {
                                              Text(if (currentLanguage == Language.AR) "FR" else "عربي", fontWeight = FontWeight.Black, color = QdOrange)
                                          }
                                          if (currentUserUid.isNotEmpty()) {
                                              IconButton(onClick = { auth.signOut(); currentUserUid = ""; isDriverSession = false; currentScreen = AppScreen.SPLASH_ONBOARDING }) {
                                                  Icon(Icons.Default.PowerSettingsNew, contentDescription = "Logout", tint = QdRed)
                                              }
                                          }
                                      },
                                      colors = TopAppBarDefaults.topAppBarColors(containerColor = Color.White)
                                  )
                              }
                          },
                          bottomBar = {
                              if (!isDriverSession && currentScreen in listOf(AppScreen.HOME_EXPLORE, AppScreen.ORDERS_LIST, AppScreen.PROFILE)) {
                                  NavigationBar(containerColor = Color.White) {
                                      NavigationBarItem(selected = currentScreen == AppScreen.HOME_EXPLORE, onClick = { currentScreen = AppScreen.HOME_EXPLORE }, icon = { Icon(Icons.Default.Home, null) }, label = { Text(AppStrings.get("home_tab", currentLanguage)) })
                                      NavigationBarItem(selected = currentScreen == AppScreen.ORDERS_LIST, onClick = { currentScreen = AppScreen.ORDERS_LIST }, icon = { Icon(Icons.Default.ReceiptLong, null) }, label = { Text(AppStrings.get("orders_tab", currentLanguage)) })
                                      NavigationBarItem(selected = currentScreen == AppScreen.ORDER_TRACKING, onClick = { currentScreen = AppScreen.ORDER_TRACKING }, icon = { Icon(Icons.Default.LocationOn, null) }, label = { Text(AppStrings.get("map_tab", currentLanguage)) })
                                      NavigationBarItem(selected = currentScreen == AppScreen.PROFILE, onClick = { currentScreen = AppScreen.PROFILE }, icon = { Icon(Icons.Default.Person, null) }, label = { Text(AppStrings.get("profile_tab", currentLanguage)) })
                                  }
                              }
                          }
                      ) { padding ->
                          Box(modifier = Modifier.fillMaxSize().padding(padding)) {
                              when (currentScreen) {
                                  AppScreen.SPLASH_ANIMATED_2SEC -> SplashAnimated2SecScreen()
                                  AppScreen.SPLASH_ONBOARDING -> SplashScreen(currentLanguage, { authUserType = AuthUserType.CUSTOMER; isDriverAuthRegister = true; currentScreen = AppScreen.AUTH_FLOW }, { authUserType = AuthUserType.CUSTOMER; isDriverAuthRegister = false; currentScreen = AppScreen.AUTH_FLOW })
                                  AppScreen.AUTH_FLOW -> AuthScreen(currentLanguage, authUserType, isDriverAuthRegister, { name, phone, uid, isDriver ->
                                      currentUserName = name; currentUserPhone = phone; currentUserUid = uid; isDriverSession = isDriver
                                      currentScreen = if (isDriver) AppScreen.DRIVER_DASHBOARD else AppScreen.HOME_EXPLORE
                                  }, { currentScreen = AppScreen.SPLASH_ONBOARDING })
                                  AppScreen.HOME_EXPLORE -> {
                                      if (isDriverSession) currentScreen = AppScreen.DRIVER_DASHBOARD
                                      else HomeScreen(currentLanguage, "العفرون (البليدة)", allStores, searchQuery, { searchQuery = it }, activeCategoryFilter, { activeCategoryFilter = it }, isOrderNowExpanded, { isOrderNowExpanded = !isOrderNowExpanded }, { currentSelectedStore = it; cartItems.clear(); currentScreen = AppScreen.STORE_MENU }, { showCustomOrderDialog = true })
                                  }
                                  AppScreen.STORE_MENU -> StoreMenuScreen(currentLanguage, currentSelectedStore, cartItems, { item ->
                                      val exist = cartItems.find { it.item.id == item.id }
                                      if (exist != null) exist.quantity++ else cartItems.add(CartItem(item, 1))
                                  }, { item ->
                                      val exist = cartItems.find { it.item.id == item.id }
                                      if (exist != null) { if (exist.quantity > 1) exist.quantity-- else cartItems.remove(exist) }
                                  }, { showCustomOrderDialog = true }, { currentScreen = AppScreen.HOME_EXPLORE }, { currentScreen = AppScreen.CONFIRM_ORDER })
                                  AppScreen.CONFIRM_ORDER -> ConfirmOrderScreen(currentLanguage, currentSelectedStore, selectedAddress, cartItems, userLat, userLng, { currentScreen = AppScreen.CHOOSE_ADDRESS }, { currentScreen = AppScreen.STORE_MENU }, { gPrice, dFee, dist, note ->
                                      val orderMap = hashMapOf("restaurant" to currentSelectedStore.nameAr, "customerAddress" to selectedAddress, "goodsPrice" to gPrice, "deliveryFee" to dFee, "distanceKm" to dist, "price" to (gPrice + dFee), "status" to "pending", "customerId" to currentUserUid, "customerName" to currentUserName, "customerPhone" to currentUserPhone, "note" to note)
                                      db.collection("orders").add(orderMap)
                                      cartItems.clear()
                                      currentScreen = AppScreen.ORDER_TRACKING
                                  })
                                  AppScreen.ORDER_TRACKING -> {
                                      val runningOrder = activeOrders.lastOrNull() ?: ActiveOrder(restaurant = currentSelectedStore.nameAr, address = selectedAddress)
                                      OrderTrackingScreen(currentLanguage, runningOrder, { currentScreen = AppScreen.HOME_EXPLORE }, { currentChatOrderId = runningOrder.id; showChatModal = true }, { if (runningOrder.id.isNotBlank()) db.collection("orders").document(runningOrder.id).update("status", "completed") }, { if (runningOrder.id.isNotBlank()) db.collection("orders").document(runningOrder.id).delete(); currentScreen = AppScreen.HOME_EXPLORE })
                                  }
                                  AppScreen.ORDERS_LIST -> OrdersListScreen(currentLanguage, activeOrders) { currentScreen = AppScreen.ORDER_TRACKING }
                                  AppScreen.CHOOSE_ADDRESS -> ChooseAddressScreen(currentLanguage, selectedAddress, { selectedAddress = it; currentScreen = AppScreen.CONFIRM_ORDER }, { currentScreen = AppScreen.CONFIRM_ORDER })
                                  AppScreen.PROFILE -> ProfileScreen(currentLanguage, currentUserName, currentUserPhone, { showEditPhoneDialog = true }, { auth.signOut(); currentUserUid = ""; isDriverSession = false; currentScreen = AppScreen.SPLASH_ONBOARDING })
                                  AppScreen.DRIVER_DASHBOARD -> DriverDashboardScreen(currentLanguage, currentUserName, driverEarnings, driverCompletedCount, driverDebt, activeOrders, { ord, status -> db.collection("orders").document(ord.id).update("status", status) }, { ord -> db.collection("orders").document(ord.id).update("status", "delivered") }, { ord -> currentChatOrderId = ord.id; showChatModal = true }, { showPayDebtDialog = true })
                              }

                              if (showCustomOrderDialog) {
                                  CustomOrderDialog({ showCustomOrderDialog = false }) { item, qty, prc ->
                                      cartItems.add(CartItem(MenuItem("c_${System.currentTimeMillis()}", "$item (طلب مخصص)", "$item", "طلب خاص", "Spécial", prc, "📝", "custom"), qty))
                                      showCustomOrderDialog = false
                                  }
                              }
                              if (showPayDebtDialog) PayDebtDialog(driverDebt) { showPayDebtDialog = false }
                              incomingDriverAlertOrder?.let { inc ->
                                  DriverIncomingOrderDialog(currentLanguage, inc, {
                                      db.collection("orders").document(inc.id).update(mapOf("status" to "accepted", "driverName" to currentUserName, "driverPhone" to currentUserPhone))
                                      incomingDriverAlertOrder = null
                                  }, { incomingDriverAlertOrder = null })
                              }
                              if (showChatModal) {
                                  ChatModalDialog(currentUserUid, liveChatMessages, { txt ->
                                      if (currentChatOrderId.isNotBlank()) {
                                          db.collection("orders").document(currentChatOrderId).collection("messages").add(mapOf("sender" to currentUserUid, "senderName" to (if (isDriverSession) "عامل التوصيل" else currentUserName), "text" to txt, "time" to "12:00", "timestamp" to com.google.firebase.firestore.FieldValue.serverTimestamp()))
                                      }
                                  }, { showChatModal = false })
                              }
                              if (showEditPhoneDialog) EditPhoneDialog(currentUserPhone, { showEditPhoneDialog = false }) { newPhone -> currentUserPhone = newPhone; if (currentUserUid.isNotEmpty()) db.collection("users").document(currentUserUid).update("phoneNumber", newPhone); showEditPhoneDialog = false }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DrawerMenuItem(title: String, icon: ImageVector, onClick: () -> Unit) {
              Row(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).clickable { onClick() }.padding(10.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                  Icon(icon, null, tint = QdOrange, modifier = Modifier.size(22.dp))
                  Text(title, fontSize = 13.sp, fontWeight = FontWeight.SemiBold, color = QdTextDark)
              }
          }

          @Composable
          fun SplashScreen(lang: Language, onStart: () -> Unit, onLogin: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().background(Color.White).padding(28.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.SpaceBetween) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      QuickDeliverAppLogo(size = 90.dp)
                      Spacer(modifier = Modifier.height(16.dp))
                      Text(AppStrings.get("app_name", lang), fontSize = 32.sp, fontWeight = FontWeight.Black, color = QdOrange)
                      Text(AppStrings.get("tagline", lang), fontSize = 15.sp, color = QdTextMuted)
                  }
                  Box(modifier = Modifier.size(240.dp).clip(RoundedCornerShape(20.dp))) {
                      AsyncImage(model = REMOTE_SPLASH_IMG, contentDescription = null, contentScale = ContentScale.Fit, modifier = Modifier.fillMaxSize())
                  }
                  Column(modifier = Modifier.fillMaxWidth()) {
                      Button(onClick = onStart, modifier = Modifier.fillMaxWidth().height(50.dp), shape = RoundedCornerShape(14.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                          Text(AppStrings.get("start_button", lang), fontWeight = FontWeight.Bold, color = Color.White)
                      }
                      Spacer(modifier = Modifier.height(10.dp))
                      TextButton(onClick = onLogin, modifier = Modifier.fillMaxWidth()) { Text(AppStrings.get("login_action", lang), color = QdTextDark) }
                  }
              }
          }

          @Composable
          fun AuthScreen(lang: Language, userType: AuthUserType, initialRegister: Boolean, onSuccess: (String, String, String, Boolean) -> Unit, onCancel: () -> Unit) {
              val context = LocalContext.current
              val auth = Firebase.auth
              val db = Firebase.firestore
              var isRegister by remember { mutableStateOf(initialRegister) }
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var errorMessage by remember { mutableStateOf("") }

              val googleSignInLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == Activity.RESULT_OK) {
                      try {
                          val task = GoogleSignIn.getSignedInAccountFromIntent(res.data)
                          val acct = task.getResult(ApiException::class.java)
                          val cred = GoogleAuthProvider.getCredential(acct.idToken ?: "", null)
                          auth.signInWithCredential(cred).addOnSuccessListener { r ->
                              val uid = r.user?.uid ?: ""
                              db.collection("users").document(uid).set(mapOf("name" to (acct.displayName ?: "User"), "role" to "customer"))
                              onSuccess(acct.displayName ?: "User", "", uid, false)
                          }
                      } catch (e: Exception) {}
                  }
              }

              LazyColumn(modifier = Modifier.fillMaxSize().background(Color.White).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                  item {
                      Text(if (isRegister) AppStrings.get("signup_action", lang) else AppStrings.get("login_action", lang), fontSize = 24.sp, fontWeight = FontWeight.Black, color = QdOrange)
                      Spacer(modifier = Modifier.height(16.dp))
                      if (userType == AuthUserType.CUSTOMER && !isRegister) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              OutlinedButton(onClick = {
                                  val gso = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN).requestIdToken(context.getString(R.string.default_web_client_id)).requestEmail().build()
                                  googleSignInLauncher.launch(GoogleSignIn.getClient(context, gso).signInIntent)
                              }, modifier = Modifier.weight(1f)) { GoogleOfficialLogo(18.dp); Spacer(modifier = Modifier.width(6.dp)); Text("Google") }
                              OutlinedButton(onClick = {
                                  val act = context as? Activity
                                  if (act != null) {
                                      auth.startActivityForSignInWithProvider(act, OAuthProvider.newBuilder("facebook.com").build()).addOnSuccessListener { r ->
                                          onSuccess(r.user?.displayName ?: "Facebook User", "", r.user?.uid ?: "", false)
                                      }
                                  }
                              }, modifier = Modifier.weight(1f)) { FacebookOfficialLogo(18.dp); Spacer(modifier = Modifier.width(6.dp)); Text("Facebook") }
                          }
                          Divider(modifier = Modifier.padding(vertical = 12.dp))
                      }
                      if (isRegister) {
                          OutlinedTextField(value = name, onValueChange = { name = it }, label = { Text("Nom / الاسم") }, modifier = Modifier.fillMaxWidth())
                          Spacer(modifier = Modifier.height(8.dp))
                          OutlinedTextField(value = phone, onValueChange = { phone = it }, label = { Text("Téléphone / الهاتف") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone), modifier = Modifier.fillMaxWidth())
                          Spacer(modifier = Modifier.height(8.dp))
                      }
                      OutlinedTextField(value = email, onValueChange = { email = it }, label = { Text("Email") }, modifier = Modifier.fillMaxWidth())
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(value = password, onValueChange = { password = it }, label = { Text("Mot de passe") }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth())
                      if (errorMessage.isNotEmpty()) { Text(errorMessage, color = QdRed, fontSize = 12.sp, modifier = Modifier.padding(top = 8.dp)) }
                      Spacer(modifier = Modifier.height(16.dp))
                      Button(onClick = {
                          if (email.isBlank() || password.isBlank()) { errorMessage = "يرجى ملء الحقول المطلوبة"; return@Button }
                          val isDriver = (userType == AuthUserType.DRIVER)
                          if (isRegister) {
                              auth.createUserWithEmailAndPassword(email.trim(), password).addOnSuccessListener { cred ->
                                  val uid = cred.user?.uid ?: ""
                                  db.collection("users").document(uid).set(mapOf("name" to name.trim(), "phoneNumber" to phone.trim(), "email" to email.trim(), "role" to if (isDriver) "driver" else "customer"))
                                  onSuccess(name.trim(), phone.trim(), uid, isDriver)
                              }.addOnFailureListener { e -> errorMessage = e.localizedMessage ?: "Erreur" }
                          } else {
                              auth.signInWithEmailAndPassword(email.trim(), password).addOnSuccessListener { cred ->
                                  val uid = cred.user?.uid ?: ""
                                  db.collection("users").document(uid).get().addOnSuccessListener { sn ->
                                      onSuccess(sn.getString("name") ?: "", sn.getString("phoneNumber") ?: "", uid, sn.getString("role") == "driver")
                                  }.addOnFailureListener { onSuccess("", "", uid, false) }
                              }.addOnFailureListener { e -> errorMessage = e.localizedMessage ?: "Erreur" }
                          }
                      }, modifier = Modifier.fillMaxWidth().height(48.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                          Text(if (isRegister) AppStrings.get("signup_action", lang) else AppStrings.get("login_action", lang), fontWeight = FontWeight.Bold)
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                      TextButton(onClick = { isRegister = !isRegister }) { Text(if (isRegister) AppStrings.get("login_action", lang) else AppStrings.get("signup_action", lang), color = QdOrange) }
                      OutlinedButton(onClick = onCancel, modifier = Modifier.fillMaxWidth()) { Text(AppStrings.get("cancel", lang)) }
                  }
              }
          }

          @Composable
          fun StoreMenuScreen(lang: Language, store: StoreItem, cartItems: List<CartItem>, onAddItem: (MenuItem) -> Unit, onRemoveItem: (MenuItem) -> Unit, onCustomOrderClick: () -> Unit, onBack: () -> Unit, onGoToCheckout: () -> Unit) {
              val totalAmount = cartItems.sumOf { it.item.price * it.quantity }
              Scaffold(
                  bottomBar = {
                      if (cartItems.isNotEmpty()) {
                          Button(onClick = onGoToCheckout, modifier = Modifier.fillMaxWidth().padding(14.dp).height(50.dp), shape = RoundedCornerShape(12.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                              Text("${AppStrings.get("view_cart", lang)} ($totalAmount DA)", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              ) { p ->
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(p).padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      item { Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null) }; Text(store.nameAr, fontWeight = FontWeight.Bold, fontSize = 16.sp); Button(onClick = onCustomOrderClick) { Text(AppStrings.get("custom_order_btn", lang), fontSize = 10.sp) } } }
                      items(store.menu) { item ->
                          Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp)) {
                              Row(modifier = Modifier.padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column { Text(item.nameAr, fontWeight = FontWeight.Bold); Text("${item.price} DA", color = QdOrange) }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      IconButton(onClick = { onRemoveItem(item) }) { Icon(Icons.Default.Remove, null) }
                                      Text("${cartItems.find { it.item.id == item.id }?.quantity ?: 0}")
                                      IconButton(onClick = { onAddItem(item) }) { Icon(Icons.Default.Add, null) }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ConfirmOrderScreen(lang: Language, store: StoreItem, address: String, cartItems: List<CartItem>, userLat: Double, userLng: Double, onChangeAddress: () -> Unit, onBack: () -> Unit, onConfirmOrder: (Int, Int, Double, String) -> Unit) {
              var note by remember { mutableStateOf("") }
              val distKm = getDistanceInKm(store.lat, store.lng, userLat, userLng).coerceAtLeast(0.5)
              val dFee = calculateDeliveryFee(distKm)
              val foodSubtotal = cartItems.sumOf { it.item.price * it.quantity }
              Scaffold(
                  bottomBar = {
                      Button(onClick = { onConfirmOrder(foodSubtotal, dFee, distKm, note) }, modifier = Modifier.fillMaxWidth().padding(14.dp).height(50.dp), shape = RoundedCornerShape(12.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                          Text("${AppStrings.get("confirm_command", lang)} (${foodSubtotal + dFee} DA)", fontWeight = FontWeight.Bold)
                      }
                  }
              ) { p ->
                  Column(modifier = Modifier.fillMaxSize().padding(p).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Text(AppStrings.get("confirm_order", lang), fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Card(modifier = Modifier.fillMaxWidth()) { Column(modifier = Modifier.padding(12.dp)) { Text(store.nameAr, fontWeight = FontWeight.Bold); Text(address, color = QdTextMuted) } }
                      OutlinedTextField(value = note, onValueChange = { note = it }, placeholder = { Text(AppStrings.get("note_placeholder", lang)) }, modifier = Modifier.fillMaxWidth())
                      Divider()
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(AppStrings.get("subtotal_meals", lang)); Text("$foodSubtotal DA") }
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text("${AppStrings.get("distance", lang)}: ${"%.1f".format(distKm)} km"); Text("${AppStrings.get("delivery_fee", lang)}: $dFee DA", color = QdOrange, fontWeight = FontWeight.Bold) }
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(AppStrings.get("total", lang), fontWeight = FontWeight.Bold); Text("${foodSubtotal + dFee} DA", fontWeight = FontWeight.Black) }
                  }
              }
          }

