                  ) {
                      Column(modifier = Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("Évaluez votre livraison", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text("Votre avis nous aide à améliorer la qualité de service", fontSize = 11.sp, color = QdTextMuted, textAlign = TextAlign.Center)

                          Spacer(modifier = Modifier.height(16.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              for (i in 1..5) {
                                  IconButton(onClick = { stars = i }) {
                                      Icon(
