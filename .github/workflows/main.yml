          // -------------------------------------------------------------
          // 4. SCREEN: CONFIRMER LA COMMANDE (CONFIRM ORDER)
          // -------------------------------------------------------------
          @Composable
          fun ConfirmOrderScreen(
              store: StoreModel,
              address: String,
              meals: List<OrderProduct>,
