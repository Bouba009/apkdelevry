          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/MainActivity.kt
package com.elaffroun.delivery

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import com.google.firebase.FirebaseApp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        try {
            FirebaseApp.initializeApp(this)
        } catch (e: Exception) {
            e.printStackTrace()
        }

        setContent {
            var currentLang by remember { mutableStateOf(Language.AR) }
            var selectedCity by remember { mutableStateOf("العفرون، البليدة") }
            var searchQuery by remember { mutableStateOf("") }
            var showCustomOrderDialog by remember { mutableStateOf(false) }

            val dummyStores = remember {
                listOf(
                    StoreItem(
                        id = "1",
                        nameAr = "مطعم الأصالة",
                        nameFr = "Restaurant Al Assala",
                        rating = 4.9,
                        time = "20-30 دقيقة",
                        menu = listOf(
                            MenuItem("m1", "ساندويتش شاورما", 350),
                            MenuItem("m2", "بيتزا مارغريتا", 600),
                            MenuItem("m3", "مشروب غازي", 100)
                        )
                    ),
                    StoreItem(
                        id = "2",
                        nameAr = "بيتزا ومأكولات سريعة",
                        nameFr = "Fast Food & Pizza",
                        rating = 4.7,
                        time = "15-25 دقيقة",
                        menu = listOf(
                            MenuItem("m4", "تاكوس دجاج", 500),
                            MenuItem("m5", "برغر كلاسيك", 450)
                        )
                    )
                )
            }

            Surface(modifier = Modifier.fillMaxSize(), color = QdBackground) {
                HomeScreen(
                    lang = currentLang,
                    selectedCity = selectedCity,
                    stores = dummyStores,
                    searchQuery = searchQuery,
                    onSearchQueryChange = { searchQuery = it },
                    onSelectStore = { },
                    onCustomOrderClick = { showCustomOrderDialog = true }
                )

                if (showCustomOrderDialog) {
                    CustomOrderDialog(
                        lang = currentLang,
                        onDismiss = { showCustomOrderDialog = false },
                        onSubmit = { _, _ -> showCustomOrderDialog = false }
                    )
                }
            }
        }
    }
}
