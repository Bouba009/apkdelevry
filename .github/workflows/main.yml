                                      Text("$completed", fontWeight = FontWeight.Black, fontSize = 16.sp, color = Color.White)
                                  }
                              }
                          }

                          Card(
                              modifier = Modifier.weight(1f).shadow(8.dp, RoundedCornerShape(18.dp)).clickable { onPayDebt() },
                              shape = RoundedCornerShape(18.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.Transparent)
                          ) {
                              Box(modifier = Modifier.fillMaxWidth().background(Brush.verticalGradient(listOf(Color(0xFFEF4444), Color(0xFFB91C1C)))).padding(14.dp), contentAlignment = Alignment.Center) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text(AppStrings.get("platform_debt", lang), fontSize = 9.sp, color = Color.White.copy(alpha = 0.9f), fontWeight = FontWeight.Bold)
                                      Spacer(modifier = Modifier.height(4.dp))
                                      Text("$debt DA", fontWeight = FontWeight.Black, fontSize = 15.sp, color = Color.White)
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Button(
                          onClick = onPayDebt,
                          modifier = Modifier.fillMaxWidth().height(46.dp).shadow(4.dp, RoundedCornerShape(14.dp)),
                          shape = RoundedCornerShape(14.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                      ) {
                          Icon(Icons.Default.Payment, null, tint = Color.White, modifier = Modifier.size(18.dp))
                          Spacer(modifier = Modifier.width(8.dp))
                          Text(AppStrings.get("pay_debt_btn", lang), fontSize = 13.sp, fontWeight = FontWeight.Black, color = Color.White)
                      }
                  }

                  item { Text(AppStrings.get("active_delivery", lang), fontWeight = FontWeight.Black, fontSize = 16.sp, color = QdTextDark) }

                  if (cur != null) {
                      item {
                          Card(
                              modifier = Modifier.fillMaxWidth().shadow(6.dp, RoundedCornerShape(20.dp)),
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              shape = RoundedCornerShape(20.dp)
                          ) {
                              Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Text(cur.restaurant, fontWeight = FontWeight.Black, fontSize = 16.sp, color = QdTextDark)
                                  Text("المسافة: ${"%.1f".format(cur.distanceKm)} كم | ربح التوصيل: ${cur.deliveryFee} DA | الإجمالي للتحصيل: ${cur.totalPrice} DA", fontSize = 12.sp, color = QdOrange, fontWeight = FontWeight.Bold)
                                  if (cur.customerPhone.isNotBlank()) {
                                      Row(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(QdOrangeSoft).padding(10.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                          Text("الزبون: ${cur.customerName} (${cur.customerPhone})", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = QdTextDark)
                                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                              IconButton(onClick = { context.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:${cur.customerPhone}"))) }, modifier = Modifier.size(36.dp).clip(CircleShape).background(QdOrange)) { Icon(Icons.Default.Phone, null, tint = Color.White, modifier = Modifier.size(18.dp)) }
                                              IconButton(onClick = { onChat(cur) }, modifier = Modifier.size(36.dp).clip(CircleShape).background(QdOrange)) { Icon(Icons.Default.ChatBubble, null, tint = Color.White, modifier = Modifier.size(18.dp)) }
                                          }
                                      }
                                  }
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Button(onClick = { onUpdate(cur, "to_store") }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(10.dp), colors = ButtonDefaults.buttonColors(containerColor = if (cur.status == "to_store") QdOrange else Color.LightGray.copy(alpha = 0.4f))) { Text("للمحل", fontSize = 10.sp, fontWeight = FontWeight.Bold) }
                                      Button(onClick = { onUpdate(cur, "received") }, modifier = Modifier.weight(1f), shape = RoundedCornerShape(10.dp), colors = ButtonDefaults.buttonColors(containerColor = if (cur.status == "received") QdOrange else Color.LightGray.copy(alpha = 0.4f))) { Text("استلمت", fontSize = 10.sp, fontWeight = FontWeight.Bold) }
                                      Button(onClick = { onFinish(cur) }, modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = QdGreen), shape = RoundedCornerShape(10.dp)) { Text("سلمت", fontSize = 10.sp, fontWeight = FontWeight.Bold, color = Color.White) }
                                  }
                              }
                          }
                      }
                  } else {
                      item {
                          Card(modifier = Modifier.fillMaxWidth().height(120.dp), shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                  Text("في انتظار طلبات توصيل جديدة...", color = QdTextMuted, fontSize = 13.sp)
                              }
                          }
                      }
                  }
                  item { Spacer(modifier = Modifier.height(16.dp)) }
              }
          }

          @Composable
          fun CustomOrderDialog(onDismiss: () -> Unit, onConfirm: (String, List<CustomOrderItem>, Int) -> Unit) {
              var storeName by remember { mutableStateOf("") }
              val itemsList = remember { mutableStateListOf(CustomOrderItem("", 1)) }
              val pulseAnim = rememberInfiniteTransition(label = "AddPlusPulse")
              val plusScale by pulseAnim.animateFloat(initialValue = 0.92f, targetValue = 1.10f, animationSpec = infiniteRepeatable(animation = tween(700, easing = FastOutSlowInEasing), repeatMode = RepeatMode.Reverse), label = "PlusScale")

              Dialog(onDismissRequest = onDismiss) {
                  Card(modifier = Modifier.fillMaxWidth().fillMaxHeight(0.85f).shadow(12.dp, RoundedCornerShape(22.dp)), shape = RoundedCornerShape(22.dp), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                      Column(modifier = Modifier.padding(20.dp)) {
                          Text("طلب مخصص حسب رغبتك ✍️", fontWeight = FontWeight.Black, fontSize = 17.sp, color = QdOrange)
                          Spacer(modifier = Modifier.height(12.dp))
                          OutlinedTextField(value = storeName, onValueChange = { storeName = it }, label = { Text("اسم المتجر أو المطعم") }, placeholder = { Text("مثال: مخبزة البركة، مطعم السلطان...") }, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp))
                          Spacer(modifier = Modifier.height(12.dp))

                          LazyColumn(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(itemsList.indices.toList()) { index ->
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.CenterVertically) {
                                      OutlinedTextField(value = itemsList[index].itemName, onValueChange = { newName -> itemsList[index] = itemsList[index].copy(itemName = newName) }, label = { Text("الطلب ${index + 1}") }, modifier = Modifier.weight(1.5f), shape = RoundedCornerShape(12.dp))
                                      OutlinedTextField(value = itemsList[index].quantity.toString(), onValueChange = { q -> itemsList[index] = itemsList[index].copy(quantity = q.toIntOrNull() ?: 1) }, label = { Text("الكمية") }, modifier = Modifier.weight(0.8f), shape = RoundedCornerShape(12.dp))
                                  }
                              }
                          }

                          Spacer(modifier = Modifier.height(10.dp))
                          Button(onClick = { itemsList.add(CustomOrderItem("", 1)) }, modifier = Modifier.fillMaxWidth().scale(plusScale), colors = ButtonDefaults.buttonColors(containerColor = QdOrangeSoft), shape = RoundedCornerShape(12.dp)) {
                              Icon(Icons.Default.AddCircle, null, tint = QdOrange)
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("إضافة منتج آخر (+)", color = QdOrange, fontWeight = FontWeight.Black)
                          }

                          Spacer(modifier = Modifier.height(12.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              OutlinedButton(onClick = onDismiss, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp)) { Text("إلغاء") }
                              Button(onClick = {
                                  val valid = itemsList.filter { it.itemName.isNotBlank() }
                                  if (valid.isNotEmpty()) onConfirm(storeName.ifBlank { "متجر مخصص" }, valid, valid.size * 250)
                              }, modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = QdOrange), shape = RoundedCornerShape(12.dp)) {
                                  Text("تأكيد الطلب", fontWeight = FontWeight.Black)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DriverIncomingOrderDialog(lang: Language, order: ActiveOrder, onAccept: () -> Unit, onReject: () -> Unit) {
              val pulseAnim = rememberInfiniteTransition(label = "GlassModalPulse")
              val modalScale by pulseAnim.animateFloat(initialValue = 0.97f, targetValue = 1.02f, animationSpec = infiniteRepeatable(animation = tween(600, easing = FastOutSlowInEasing), repeatMode = RepeatMode.Reverse), label = "ModalPulse")

              Dialog(onDismissRequest = onReject) {
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .scale(modalScale)
                          .shadow(20.dp, RoundedCornerShape(26.dp))
                          .border(1.5.dp, Color.White.copy(alpha = 0.9f), RoundedCornerShape(26.dp)),
                      shape = RoundedCornerShape(26.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White.copy(alpha = 0.95f))
                  ) {
                      Column(modifier = Modifier.padding(22.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Box(modifier = Modifier.size(68.dp).clip(CircleShape).background(QdOrangeSoft), contentAlignment = Alignment.Center) {
                              Text("🛵", fontSize = 36.sp)
                          }
                          Text("طلب توصيل جديد متاح الآن !", fontWeight = FontWeight.Black, color = QdOrange, fontSize = 18.sp)
                          Text("المتجر: ${order.restaurant}", fontWeight = FontWeight.Black, fontSize = 15.sp, color = QdTextDark)
                          Text("الوجهة: ${order.address}", color = QdTextMuted, fontSize = 13.sp)
                          Text("المسافة: ${"%.1f".format(order.distanceKm)} كم", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                          Text("ربح التوصيل: ${order.deliveryFee} DA", fontWeight = FontWeight.Black, fontSize = 18.sp, color = QdGreen)
                          Spacer(modifier = Modifier.height(4.dp))

                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              Button(
                                  onClick = onReject,
                                  modifier = Modifier.weight(1f).height(48.dp),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = QdRed)
                              ) {
                                  Text("رفض ✖", color = Color.White, fontWeight = FontWeight.Black)
                              }
                              Button(
                                  onClick = onAccept,
                                  modifier = Modifier.weight(1.2f).height(48.dp),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = QdGreen)
                              ) {
                                  Text("قبول الطلب ✔", color = Color.White, fontWeight = FontWeight.Black)
                              }
                          }
                      }
                  }
              }
          }
