                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text(
                                  text = "كابتن $driverName 🛵",
                                  fontSize = 18.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Text(
                                  text = "جاهز لتلقي طلبات التوصيل",
                                  fontSize = 12.sp,
                                  color = AccentGreen
                              )
                          }
                          IconButton(onClick = onOpenHistory) {
                              Icon(imageVector = Icons.Default.History, contentDescription = "History", tint = PrimaryColor)
                          }
                      }
                  }

                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          StatCard(
                              title = "الأرباح",
                              value = "$earnings دج",
                              color = AccentGreen,
                              icon = Icons.Default.AccountBalanceWallet,
                              modifier = Modifier.weight(1f)
                          )
                          StatCard(
                              title = "المكتملة",
                              value = "$completedCount",
                              color = AccentBlue,
                              icon = Icons.Default.CheckCircle,
                              modifier = Modifier.weight(1f)
                          )
                          StatCard(
                              title = "دين المنصة",
                              value = "$debt دج",
                              color = AccentRed,
                              icon = Icons.Default.MonetizationOn,
                              modifier = Modifier.weight(1f)
                          )
                      }
                  }

                  if (currentDelivery != null) {
                      item {
                          Card(
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(20.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                              border = CardDefaults.outlinedCardBorder()
                          ) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Text(
                                      text = "الطلب النشط حالياً",
                                      fontWeight = FontWeight.Black,
                                      fontSize = 15.sp,
                                      color = PrimaryColor
                                  )
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(text = "المطعم: ${currentDelivery.restaurant}", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                  Text(text = "العنوان: ${currentDelivery.customerAddress}", fontSize = 12.sp)
                                  Text(text = "السعر الإجمالي: ${currentDelivery.price} دج", fontWeight = FontWeight.Bold, fontSize = 13.sp)

                                  Spacer(modifier = Modifier.height(14.dp))

                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                                  ) {
                                      Button(
                                          onClick = { onUpdateStatus(currentDelivery, "to_store") },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(10.dp),
                                          colors = ButtonDefaults.buttonColors(
                                              containerColor = if (currentDelivery.status == "to_store") PrimaryColor else Color.Gray.copy(alpha = 0.2f)
                                          )
                                      ) {
                                          Text(text = "للمطعم", fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                      }

                                      Button(
                                          onClick = { onUpdateStatus(currentDelivery, "received") },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(10.dp),
                                          colors = ButtonDefaults.buttonColors(
                                              containerColor = if (currentDelivery.status == "received") PrimaryColor else Color.Gray.copy(alpha = 0.2f)
                                          )
                                      ) {
                                          Text(text = "استلمت", fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                      }

                                      Button(
                                          onClick = { onFinishDelivery(currentDelivery) },
                                          modifier = Modifier.weight(1f),
                                          shape = RoundedCornerShape(10.dp),
                                          colors = ButtonDefaults.buttonColors(containerColor = AccentGreen)
                                      ) {
                                          Text(text = "تم التسليم", fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }

                                  Spacer(modifier = Modifier.height(10.dp))

                                  Button(
                                      onClick = onOpenChat,
                                      modifier = Modifier.fillMaxWidth(),
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.buttonColors(containerColor = AccentBlue)
                                  ) {
                                      Icon(imageVector = Icons.Default.Chat, contentDescription = null, modifier = Modifier.size(16.dp))
                                      Spacer(modifier = Modifier.width(6.dp))
                                      Text(text = "محادثة الزبون", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  } else {
                      item {
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(160.dp),
                              shape = RoundedCornerShape(20.dp),
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                              border = CardDefaults.outlinedCardBorder()
                          ) {
                              Box(
                                  modifier = Modifier.fillMaxSize(),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      Icon(
                                          imageVector = Icons.Default.NotificationsNone,
                                          contentDescription = null,
                                          tint = PrimaryColor,
                                          modifier = Modifier.size(40.dp)
                                      )
                                      Spacer(modifier = Modifier.height(8.dp))
                                      Text(
                                          text = "لا توجد طلبات جارية الآن. أنت جاهز لاستقبال العروض!",
                                          fontSize = 12.sp,
                                          textAlign = TextAlign.Center,
                                          color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f)
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

