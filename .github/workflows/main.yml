                              Text("Confirmer l'évaluation", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun AddMealModalDialog(
              onDismiss: () -> Unit,
              onAddMeal: (String, Int) -> Unit
          ) {
              var mealName by remember { mutableStateOf("") }
              var qty by remember { mutableStateOf(1) }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text("Ajouter un plat / produit / طرد", fontWeight = FontWeight.Bold, fontSize = 16.sp)

                          OutlinedTextField(
                              value = mealName,
                              onValueChange = { mealName = it },
                              label = { Text("Nom du plat ou colis") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Quantité : $qty", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  IconButton(onClick = { if (qty > 1) qty-- }) {
                                      Icon(Icons.Default.Remove, contentDescription = null)
                                  }
                                  IconButton(onClick = { qty++ }) {
                                      Icon(Icons.Default.Add, contentDescription = null)
                                  }
                              }
                          }

                          Button(
                              onClick = {
                                  if (mealName.isNotBlank()) {
                                      onAddMeal(mealName.trim(), qty)
                                  }
                              },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text("Ajouter à la commande", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

