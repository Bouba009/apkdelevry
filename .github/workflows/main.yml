                  bottomBar = {
                      if (cartItems.isNotEmpty()) {
                          Button(onClick = onGoToCheckout, modifier = Modifier.fillMaxWidth().padding(16.dp).height(52.dp), shape = RoundedCornerShape(14.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                              Text("${AppStrings.get("view_cart", lang)} ($totalAmount DA)", fontWeight = FontWeight.Bold)
                          }
                      }
