                      item { Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null) }; Text(store.nameAr, fontWeight = FontWeight.Black, fontSize = 16.sp); Button(onClick = onCustomOrderClick) { Text(AppStrings.get("custom_order_btn", lang), fontSize = 10.sp) } } }
                      items(store.menu) { item ->
                          Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp), colors = CardDefaults.cardColors(containerColor = Color.White), border = CardDefaults.outlinedCardBorder()) {
                              Row(modifier = Modifier.padding(14.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column { Text(item.nameAr, fontWeight = FontWeight.Bold); Text("${item.price} DA", color = QdOrange, fontWeight = FontWeight.Black) }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      IconButton(onClick = { onRemoveItem(item) }) { Icon(Icons.Default.Remove, null) }
                                      Text("${cartItems.find { it.item.id == item.id }?.quantity ?: 0}", fontWeight = FontWeight.Bold)
                                      IconButton(onClick = { onAddItem(item) }) { Icon(Icons.Default.Add, null) }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ConfirmOrderScreen(lang: Language, store: StoreItem, address: String, cartItems: List<CartItem>, userLat: Double, userLng: Double, onChangeAddress: () -> Unit, onBack: () -> Unit, onConfirmOrder: (Int, Int, Double, String) -> Unit) {
              var note by remember { mutableStateOf("") }
              val distKm = getDistanceInKm(store.lat, store.lng, userLat, userLng).coerceAtLeast(0.5)
              val dFee = calculateDeliveryFee(distKm)
              val foodSubtotal = cartItems.sumOf { it.item.price * it.quantity }
              val total = foodSubtotal + dFee

              Scaffold(
                  bottomBar = {
                      Button(onClick = { onConfirmOrder(foodSubtotal, dFee, distKm, note) }, modifier = Modifier.fillMaxWidth().padding(16.dp).height(54.dp), shape = RoundedCornerShape(16.dp), colors = ButtonDefaults.buttonColors(containerColor = QdOrange)) {
                          Text("${AppStrings.get("confirm_command", lang)} ($total DA)", fontWeight = FontWeight.Black)
                      }
                  }
              ) { p ->
                  Column(modifier = Modifier.fillMaxSize().padding(p).padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null) }; Text(AppStrings.get("confirm_order", lang), fontSize = 18.sp, fontWeight = FontWeight.Black) }
                      Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = QdOrangeSoft)) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text("المتجر: ${store.nameAr}", fontWeight = FontWeight.Black)
                              Text("العنوان: $address", color = QdTextDark, fontSize = 12.sp)
                          }
                      }
                      OutlinedTextField(value = note, onValueChange = { note = it }, placeholder = { Text(AppStrings.get("note_placeholder", lang)) }, modifier = Modifier.fillMaxWidth())
                      Divider()
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(AppStrings.get("subtotal_meals", lang)); Text("$foodSubtotal DA", fontWeight = FontWeight.Bold) }
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text("${AppStrings.get("distance", lang)}: ${"%.1f".format(distKm)} km"); Text("${AppStrings.get("delivery_fee", lang)}: $dFee DA", color = QdOrange, fontWeight = FontWeight.Black) }
                      Divider()
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(AppStrings.get("total", lang), fontWeight = FontWeight.Black, fontSize = 17.sp); Text("$total DA", fontWeight = FontWeight.Black, fontSize = 18.sp, color = QdOrange) }
                  }
              }
          }

          @Composable
          fun OrdersListScreen(lang: Language, orders: List<ActiveOrder>, onSelect: () -> Unit) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(orders) { ord ->
                      Card(modifier = Modifier.fillMaxWidth().clickable { onSelect() }, shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color.White), border = CardDefaults.outlinedCardBorder()) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text(ord.restaurant, fontWeight = FontWeight.Black)
                              Text("المسافة: ${"%.1f".format(ord.distanceKm)} كم • التوصيل: ${ord.deliveryFee} DA • الإجمالي: ${ord.totalPrice} DA", fontSize = 12.sp, color = QdTextMuted)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChooseAddressScreen(lang: Language, current: String, onSelect: (String) -> Unit, onBack: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null) }
                  Text(AppStrings.get("choose_address", lang), fontWeight = FontWeight.Black, fontSize = 18.sp)
                  Button(onClick = { onSelect("حي النصر، العفرون (GPS)") }, modifier = Modifier.fillMaxWidth()) { Text("حي النصر، العفرون (GPS)") }
                  Button(onClick = { onSelect("وسط مدينة العفرون") }, modifier = Modifier.fillMaxWidth()) { Text("وسط مدينة العفرون") }
              }
          }

          @Composable
          fun ProfileScreen(lang: Language, name: String, phone: String, onEditPhone: () -> Unit, onLogout: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Text(AppStrings.get("my_profile", lang), fontWeight = FontWeight.Black, fontSize = 20.sp)
                  Card(modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color.White), border = CardDefaults.outlinedCardBorder()) {
                      Row(modifier = Modifier.padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Column { Text(name, fontWeight = FontWeight.Black); Text(phone, color = QdTextMuted) }
                          IconButton(onClick = onEditPhone) { Icon(Icons.Default.Edit, null, tint = QdOrange) }
                      }
                  }
                  OutlinedButton(onClick = onLogout, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp)) { Text(AppStrings.get("logout", lang), color = QdRed, fontWeight = FontWeight.Black) }
              }
          }

          @Composable fun PayDebtDialog(amount: Int, onDismiss: () -> Unit) { Dialog(onDismissRequest = onDismiss) { Card { Column(modifier = Modifier.padding(16.dp)) { Text("ديون المنصة المستحقة: $amount DA", fontWeight = FontWeight.Black); Button(onClick = onDismiss, modifier = Modifier.fillMaxWidth()) { Text("حسناً") } } } } }
          @Composable fun ChatModalDialog(uid: String, msgs: List<ChatMessage>, onSend: (String) -> Unit, onDismiss: () -> Unit) {
              var txt by remember { mutableStateOf("") }
              Dialog(onDismissRequest = onDismiss) {
                  Card(modifier = Modifier.fillMaxWidth().fillMaxHeight(0.72f), shape = RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                      Column(modifier = Modifier.padding(14.dp)) {
                          LazyColumn(modifier = Modifier.weight(1f)) { items(msgs) { Text("${it.senderName}: ${it.text}") } }
                          Row { OutlinedTextField(value = txt, onValueChange = { txt = it }, modifier = Modifier.weight(1f)); IconButton(onClick = { onSend(txt); txt = "" }) { Icon(Icons.Default.Send, null, tint = QdOrange) } }
                      }
                  }
              }
          }
          @Composable fun EditPhoneDialog(p: String, onDismiss: () -> Unit, onSave: (String) -> Unit) {
              var ph by remember { mutableStateOf(p) }
              Dialog(onDismissRequest = onDismiss) { Card { Column(modifier = Modifier.padding(16.dp)) { OutlinedTextField(value = ph, onValueChange = { ph = it }); Button(onClick = { onSave(ph) }, modifier = Modifier.fillMaxWidth()) { Text("حفظ") } } } }
          }
          EOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickDeliver-Production-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

