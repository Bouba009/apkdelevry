          // -------------------------------------------------------------
          // 5. SCREEN: SUIVI DE COMMANDE (DRIVER INFO HIDDEN UNTIL ACCEPTED)
          // -------------------------------------------------------------
          @Composable
          fun OrderTrackingScreen(
              order: ActiveOrder,
              userLat: Double,
              userLng: Double,
              onBack: () -> Unit,
              onOpenChat: () -> Unit,
              onConfirmDelivered: () -> Unit,
              onCancelOrder: () -> Unit
          ) {
              val context = LocalContext.current
              var roadWaypoints by remember { mutableStateOf<List<GeoPoint>>(emptyList()) }

              // لا تظهر معلومات عامل التوصيل الا بعد قبول الطلب
              val isDriverAssigned = order.status in listOf("accepted", "to_store", "received", "delivered", "completed") && order.driverPhone.isNotBlank()

              LaunchedEffect(order) {
                  roadWaypoints = MapUtils.fetchOsrmRoadPath(order.storeLat, order.storeLng, order.custLat, order.custLng)
              }

              Box(modifier = Modifier.fillMaxSize()) {
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          MapView(ctx).apply {
                              setTileSource(TileSourceFactory.MAPNIK)
                              setMultiTouchControls(true)
                              controller.setZoom(15.2)
                              controller.setCenter(GeoPoint(order.custLat, order.custLng))
                          }
                      },
                      update = { mapView ->
                          mapView.overlays.clear()

                          val userMarker = Marker(mapView).apply {
                              position = GeoPoint(order.custLat, order.custLng)
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = "موقعك"
                              icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#1E2024"), "🏠")
                          }
                          mapView.overlays.add(userMarker)

                          val restMarker = Marker(mapView).apply {
                              position = GeoPoint(order.storeLat, order.storeLng)
                              setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                              title = order.restaurant
                              icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF5E00"), "🍴")
                          }
                          mapView.overlays.add(restMarker)

                          if (roadWaypoints.isNotEmpty()) {
                              val polyline = Polyline(mapView).apply {
                                  roadWaypoints.forEach { addPoint(it) }
                                  outlinePaint.color = android.graphics.Color.parseColor("#FF5E00")
                                  outlinePaint.strokeWidth = 14f
                              }
                              mapView.overlays.add(polyline)

                              if (isDriverAssigned) {
                                  val midPoint = roadWaypoints[roadWaypoints.size / 2]
                                  val driverMarker = Marker(mapView).apply {
                                      position = midPoint
                                      setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                                      title = order.driverName
                                      icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF5E00"), "🛵")
                                  }
                                  mapView.overlays.add(driverMarker)
                              }
                          }
                          mapView.invalidate()
                      }
                  )

                  // Top Status Float Card
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 20.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(
                              onClick = onBack,
                              modifier = Modifier
                                  .size(40.dp)
                                  .clip(CircleShape)
                                  .background(Color.White)
                                  .shadow(4.dp, CircleShape)
                          ) {
                              Icon(Icons.Default.ArrowBack, contentDescription = "Retour", tint = QdTextDark)
                          }
                          Spacer(modifier = Modifier.width(12.dp))
                          Text(text = "تتبع الطلب مباشرة", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = QdTextDark)
                      }

                      Spacer(modifier = Modifier.height(14.dp))

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(18.dp),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          elevation = CardDefaults.cardElevation(6.dp)
                      ) {
                          Row(
                              modifier = Modifier.padding(14.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(14.dp)
                          ) {
                              Box(
                                  modifier = Modifier
                                      .size(46.dp)
                                      .clip(CircleShape)
                                      .background(QdOrangeSoft),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(text = if (order.category == "سلع وبضائع") "📦" else "🍔", fontSize = 24.sp)
                              }
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = if (!isDriverAssigned) "جاري البحث عن عامل توصيل قريب... ⏳" else "طلبك قيد التوصيل الآن",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 13.sp,
                                      color = if (!isDriverAssigned) QdOrange else QdGreen
                                  )
                                  Text(text = "الحالة: ${order.status} • السعر: ${order.price} دج", fontSize = 11.sp, color = QdTextMuted)
                              }
                              if (order.status == "received" || order.status == "delivered") {
                                  Button(
                                      onClick = onConfirmDelivered,
                                      colors = ButtonDefaults.buttonColors(containerColor = QdGreen),
                                      shape = RoundedCornerShape(10.dp),
                                      contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp)
                                  ) {
                                      Text("استلمت", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  }
                              } else if (!isDriverAssigned) {
                                  TextButton(onClick = onCancelOrder) {
                                      Text("إلغاء", color = QdRed, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }

                  // Bottom Driver Card (ONLY SHOWN AFTER DRIVER ACCEPTS)
                  Card(
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .fillMaxWidth()
                          .padding(16.dp),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White),
                      elevation = CardDefaults.cardElevation(8.dp)
                  ) {
                      if (isDriverAssigned) {
                          Row(
                              modifier = Modifier.padding(16.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(12.dp)
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .size(48.dp)
                                          .clip(CircleShape)
                                          .background(QdOrangeSoft),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(text = "👨‍✈️", fontSize = 26.sp)
                                  }
                                  Column {
                                      Text(text = order.driverName, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Text(text = "★ 4.9 • دراجة نارية معتمدة", fontSize = 11.sp, color = QdTextMuted)
                                      Text(text = "الهاتف: ${order.driverPhone}", fontSize = 11.sp, color = QdGreen, fontWeight = FontWeight.Bold)
                                  }
                              }

                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  IconButton(
                                      onClick = {
                                          val dialIntent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:${order.driverPhone}"))
                                          context.startActivity(dialIntent)
                                      },
                                      modifier = Modifier
                                          .size(42.dp)
                                          .clip(CircleShape)
                                          .background(QdOrange)
                                  ) {
                                      Icon(Icons.Default.Phone, contentDescription = null, tint = Color.White, modifier = Modifier.size(20.dp))
                                  }
                                  IconButton(
                                      onClick = onOpenChat,
                                      modifier = Modifier
                                          .size(42.dp)
                                          .clip(CircleShape)
                                          .background(QdOrange)
                                  ) {
                                      Icon(Icons.Default.ChatBubble, contentDescription = null, tint = Color.White, modifier = Modifier.size(20.dp))
                                  }
                              }
                          }
                      } else {
                          // Placeholder when waiting for driver acceptance
                          Row(
                              modifier = Modifier.padding(16.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              CircularProgressIndicator(color = QdOrange, modifier = Modifier.size(24.dp))
                              Column {
                                  Text("بانتظار قبول السائق للطلب...", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                  Text("لن تظهر بيانات وهاتف السائق إلا بعد تأكيده للرحلة.", fontSize = 11.sp, color = QdTextMuted)
                              }
                          }
                      }
                  }
              }
          }

          // -------------------------------------------------------------
          // 6. SCREEN: MES COMMANDES (ORDERS LIST)
          // -------------------------------------------------------------
          @Composable
          fun OrdersListScreen(
              orders: List<ActiveOrder>,
              onSelectOrder: () -> Unit
          ) {
              var selectedFilter by remember { mutableStateOf(0) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(horizontal = 20.dp)
              ) {
                  Spacer(modifier = Modifier.height(14.dp))
                  Text(text = "Mes commandes / طلباتي", fontSize = 20.sp, fontWeight = FontWeight.Black)
                  Spacer(modifier = Modifier.height(14.dp))

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceAround
                  ) {
                      FilterTab(label = "En cours", selected = selectedFilter == 0, onClick = { selectedFilter = 0 })
                      FilterTab(label = "Terminées", selected = selectedFilter == 1, onClick = { selectedFilter = 1 })
                      FilterTab(label = "Annulées", selected = selectedFilter == 2, onClick = { selectedFilter = 2 })
                  }

                  Divider(color = QdBorder, modifier = Modifier.padding(top = 10.dp))
                  Spacer(modifier = Modifier.height(14.dp))

                  val filtered = when (selectedFilter) {
                      0 -> orders.filter { it.status in listOf("pending", "accepted", "to_store", "received", "delivered") }
                      1 -> orders.filter { it.status == "completed" }
                      else -> emptyList()
                  }

                  LazyColumn(
                      verticalArrangement = Arrangement.spacedBy(14.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      if (filtered.isEmpty()) {
                          item {
                              Box(modifier = Modifier.fillMaxWidth().padding(top = 40.dp), contentAlignment = Alignment.Center) {
                                  Text("لا توجد طلبات في هذا القسم حالياً", color = QdTextMuted, fontSize = 13.sp)
                              }
                          }
                      } else {
                          items(filtered) { ord ->
                              OrderListItem(
                                  name = ord.restaurant,
                                  date = "الطلب #${ord.id.takeLast(4)}",
                                  price = "${ord.price} DA",
