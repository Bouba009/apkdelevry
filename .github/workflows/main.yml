              val (title, text) = when (type) {
                  "privacy" -> "سياسة الخصوصية" to "نحن نلتزم بحماية بياناتك وموقعك الجغرافي واستخدامه حصراً لتوجيه مسار التوصيل بينك وبين المطعم والسائق."
                  "about" -> "من نحن" to "منصة el affroun delevry هي منصة رقمية محلية مخصصة لمدينة العفرون وضواحيها لتوصيل الطعام، الأدوية، والسلع والطرود بأعلى درجات السرعة والأمان."
                  "contact" -> "اتصل بنا" to "هاتف الدعم الفني: 0555-555-555\nالبريد الإلكتروني: support@elaffroun-delevry.com"
                  else -> "سياسة التوصيل والأسعار" to "تسعيرة التوصيل لدينا واضحة وشفافة: 50 دج لكل 500 متر بناءً على المسار الحقيقي على الخارطة."
              }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text(title, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = QdOrange)
                          Text(text, fontSize = 13.sp, color = QdTextDark, lineHeight = 20.sp)
                          Button(
                              onClick = onDismiss,
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                          ) {
                              Text("حسناً")
                          }
                      }
                  }
              }
