          package com.elaffroun.delivery

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlin.math.exp
          import kotlin.math.sin

          object SoundHelper {
              fun playNotificationTone() {
                  CoroutineScope(Dispatchers.IO).launch {
                      playHarmonicTone(1046.50, 150)
                      delay(35)
                      playHarmonicTone(1318.51, 230)
                  }
              }

              fun playArrivalTone() {
                  CoroutineScope(Dispatchers.IO).launch {
                      playHarmonicTone(880.00, 110)
                      delay(25)
                      playHarmonicTone(1174.66, 110)
                      delay(25)
                      playHarmonicTone(1760.00, 300)
                  }
              }

              private fun playHarmonicTone(freqOfTone: Double, durationMs: Int) {
                  try {
                      val sampleRate = 44100
                      val numSamples = durationMs * sampleRate / 1000
                      val soundData = DoubleArray(numSamples)
                      val generatedSnd = ByteArray(2 * numSamples)

                      for (i in 0 until numSamples) {
                          val t = i.toDouble() / sampleRate
                          val decay = exp(-4.2 * t / (durationMs / 1000.0))
                          val wave = sin(2.0 * Math.PI * freqOfTone * t) +
                                  0.25 * sin(4.0 * Math.PI * freqOfTone * t)
                          soundData[i] = wave * decay * 0.75
                      }

                      var idx = 0
                      for (dVal in soundData) {
                          val valShort = (dVal.coerceIn(-1.0, 1.0) * 32767).toInt().toShort()
                          generatedSnd[idx++] = (valShort.toInt() and 0x00ff).toByte()
                          generatedSnd[idx++] = ((valShort.toInt() and 0xff00) ushr 8).toByte()
                      }

                      val audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_NOTIFICATION_COMMUNICATION_INSTANT)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build()
                          )
                          .setBufferSizeInBytes(generatedSnd.size)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      audioTrack.write(generatedSnd, 0, generatedSnd.size)
                      audioTrack.play()
                  } catch (e: Exception) {
                      // Handled safely
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/elaffroun/delivery/MapUtils.kt
          package com.elaffroun.delivery

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.maplibre.android.geometry.LatLng
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          object MapUtils {
              fun createCustomBitmap(
                  bgColor: Int,
                  symbol: String,
                  sizePx: Int = 110
              ): Bitmap {
                  val bitmap = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)

                  val shadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.parseColor("#33000000")
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f + 4f, sizePx / 2f - 4f, shadowPaint)

                  val outerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 6f, outerCirclePaint)

                  val innerCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = bgColor
                  }
                  canvas.drawCircle(sizePx / 2f, sizePx / 2f - 4f, sizePx / 2f - 14f, innerCirclePaint)

                  val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.WHITE
                      textSize = sizePx * 0.44f
                      textAlign = Paint.Align.CENTER
                  }
                  val yPos = (canvas.height / 2f - 4f) - ((textPaint.descent() + textPaint.ascent()) / 2f)
                  canvas.drawText(symbol, sizePx / 2f, yPos, textPaint)

                  return bitmap
              }

              suspend fun fetchOsrmRoadPath(
                  startLat: Double, startLng: Double,
                  endLat: Double, endLng: Double
              ): List<LatLng> = withContext(Dispatchers.IO) {
                  val servers = listOf(
                      "https://router.project-osrm.org",
                      "https://routing.openstreetmap.de/routed-car"
                  )

                  for (baseUrl in servers) {
                      val points = mutableListOf<LatLng>()
                      try {
                          val urlString = "$baseUrl/route/v1/driving/$startLng,$startLat;$endLng,$endLat?overview=full&geometries=geojson"
                          val url = URL(urlString)
                          val connection = url.openConnection() as HttpURLConnection
                          connection.connectTimeout = 7000
                          connection.readTimeout = 7000
                          connection.requestMethod = "GET"
                          connection.setRequestProperty("User-Agent", "QuickDeliver/6.0")

                          if (connection.responseCode == HttpURLConnection.HTTP_OK) {
                              val reader = BufferedReader(InputStreamReader(connection.inputStream))
                              val response = reader.use { it.readText() }
                              val json = JSONObject(response)
                              val routes = json.optJSONArray("routes")
                              if (routes != null && routes.length() > 0) {
                                  val geometry = routes.getJSONObject(0).getJSONObject("geometry")
                                  val coords = geometry.getJSONArray("coordinates")
                                  for (i in 0 until coords.length()) {
                                      val pair = coords.getJSONArray(i)
                                      val lng = pair.getDouble(0)
                                      val lat = pair.getDouble(1)
                                      points.add(LatLng(lat, lng))
                                  }
                                  if (points.isNotEmpty()) {
                                      return@withContext points
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // Try next mirror
                      }
                  }

                  val fallback = mutableListOf<LatLng>()
                  fallback.add(LatLng(startLat, startLng))
                  fallback.add(LatLng((startLat + endLat) / 2.0, (startLng + endLng) / 2.0))
                  fallback.add(LatLng(endLat, endLng))
                  fallback
              }
          }
          EOF

