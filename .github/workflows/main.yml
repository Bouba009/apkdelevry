                          Text("🛵 طلب توصيل جديد عاجل!", fontWeight = FontWeight.Black, fontSize = 17.sp, color = QdOrange)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text("من: ${order.restaurant}", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                          Text("إلى: ${order.address}", fontSize = 12.sp, color = QdTextMuted)
                          Text("السعر الإجمالي: ${order.price} DA", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = QdGreen)
                          Spacer(modifier = Modifier.height(16.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              OutlinedButton(onClick = onReject, modifier = Modifier.weight(1f), shape = RoundedCornerShape(12.dp)) {
