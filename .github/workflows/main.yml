                      cubicTo(w * 0.58f, h * 0.24f, w * 0.61f, h * 0.20f, w * 0.72f, h * 0.20f)
                      lineTo(w * 0.72f, h * 0.08f)
                      cubicTo(w * 0.64f, h * 0.07f, w * 0.54f, h * 0.07f, w * 0.47f, h * 0.14f)
                      cubicTo(w * 0.40f, h * 0.20f, w * 0.42f, h * 0.29f, w * 0.42f, h * 0.40f)
                      lineTo(w * 0.32f, h * 0.40f)
