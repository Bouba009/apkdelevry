                      Card(modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text(if (order.driverName.isNotBlank()) AppStrings.get("order_on_the_way", lang) else AppStrings.get("order_waiting_driver", lang), fontWeight = FontWeight.Bold)
                              Text("المسافة: ${"%.1f".format(order.distanceKm)} كم | التوصيل: ${order.deliveryFee} DA | الإجمالي: ${order.totalPrice} DA")
