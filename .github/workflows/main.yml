              }

              // Driver Business Stats (10 DA/km platform debt, 1000 DA limit)
              var driverEarnings by remember { mutableStateOf(0) }
              var driverCompletedCount by remember { mutableStateOf(0) }
              var driverDebt by remember { mutableStateOf(0) }
              var incomingDriverAlertOrder by remember { mutableStateOf<ActiveOrder?>(null) }

              // GPS Location Permission
              val fusedClient = remember { LocationServices.getFusedLocationProviderClient(context) }
              val permLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.RequestMultiplePermissions()
              ) { permissions ->
                  if (permissions[Manifest.permission.ACCESS_FINE_LOCATION] == true) {
                      try {
                          fusedClient.getCurrentLocation(Priority.PRIORITY_HIGH_ACCURACY, null)
                              .addOnSuccessListener { loc ->
                                  if (loc != null) {
                                      userLat = loc.latitude
                                      userLng = loc.longitude
                                  }
                              }
                      } catch (e: Exception) {
                          // Handled safely
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  val permissionsNeeded = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  permLauncher.launch(permissionsNeeded.toTypedArray())

                  // Load dynamic stores from Firestore if available
                  db.collection("stores").addSnapshotListener { snap, _ ->
                      if (snap != null && !snap.isEmpty) {
                          availableStores.clear()
                          for (doc in snap.documents) {
                              availableStores.add(
                                  RestaurantItem(
                                      id = doc.id,
                                      name = doc.getString("name") ?: "متجر العفرون",
                                      rating = "4.8",
                                      time = "20-30 min",
                                      emoji = "🍲",
                                      lat = doc.getDouble("lat") ?: 36.4686,
                                      lng = doc.getDouble("lng") ?: 2.6288
                                  )
                              )
                          }
                      }
                  }
              }

              // Sync Active Orders Realtime from Firestore
              DisposableEffect(currentUserUid, isDriverSession) {
                  var listener: ListenerRegistration? = null
                  val ordersQuery = if (isDriverSession) {
                      db.collection("orders")
                  } else if (currentUserUid.isNotEmpty()) {
                      db.collection("orders").whereEqualTo("customerId", currentUserUid)
                  } else {
                      db.collection("orders")
                  }

                  listener = ordersQuery.addSnapshotListener { snapshot, error ->
                      if (error != null || snapshot == null) return@addSnapshotListener
                      activeOrders.clear()
                      for (doc in snapshot.documents) {
                          val rawItems = doc.get("items") as? List<Map<String, Any>> ?: emptyList()
                          val parsedItems = rawItems.map {
                              OrderProduct(
                                  name = it["name"] as? String ?: "",
                                  qty = (it["qty"] as? Long)?.toInt() ?: 1
                              )
                          }
                          val order = ActiveOrder(
                              id = doc.id,
                              restaurant = doc.getString("restaurant") ?: "",
                              address = doc.getString("customerAddress") ?: "",
                              price = doc.getLong("price")?.toInt() ?: 50,
                              status = doc.getString("status") ?: "pending",
                              driverName = doc.getString("driverName") ?: "",
                              driverPhone = doc.getString("driverPhone") ?: "",
                              customerId = doc.getString("customerId") ?: "",
                              customerName = doc.getString("customerName") ?: "",
                              customerPhone = doc.getString("customerPhone") ?: "",
                              items = parsedItems,
                              note = doc.getString("note") ?: "",
                              storeLat = doc.getDouble("storeLat") ?: 36.4690,
                              storeLng = doc.getDouble("storeLng") ?: 2.6295,
                              custLat = doc.getDouble("lat") ?: 36.4686,
                              custLng = doc.getDouble("lng") ?: 2.6288
                          )
                          activeOrders.add(order)

                          // Trigger chimes / notifications
                          if (isDriverSession && order.status == "pending" && incomingDriverAlertOrder == null) {
                              incomingDriverAlertOrder = order
                              SoundHelper.playNotificationTone()
                          }
                          if (!isDriverSession && order.status == "received") {
                              SoundHelper.playArrivalTone()
                          }
                      }

                      if (isDriverSession) {
                          val completed = activeOrders.filter { it.driverPhone == currentUserPhone && (it.status == "delivered" || it.status == "completed") }
                          driverCompletedCount = completed.size
                          driverEarnings = completed.sumOf { it.price }
                          val totalKm = completed.sumOf { getDistanceInKm(it.storeLat, it.storeLng, it.custLat, it.custLng) }
                          driverDebt = (totalKm * 10.0).roundToInt()
                      }
                  }

                  onDispose { listener?.remove() }
              }

              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = QdOrange,
                      background = QdBackground,
                      surface = QdCard,
                      onPrimary = Color.White,
                      onBackground = QdTextDark,
                      onSurface = QdTextDark
                  )
              ) {
                  Scaffold(
                      containerColor = QdBackground,
                      bottomBar = {
                          if (currentScreen in listOf(AppScreen.HOME_EXPLORE, AppScreen.ORDERS_LIST, AppScreen.PROFILE, AppScreen.DRIVER_DASHBOARD)) {
                              NavigationBar(
                                  containerColor = Color.White,
                                  tonalElevation = 6.dp,
                                  modifier = Modifier.border(1.dp, QdBorder, RoundedCornerShape(topStart = 16.dp, topEnd = 16.dp))
                              ) {
                                  NavigationBarItem(
                                      selected = (currentScreen == AppScreen.HOME_EXPLORE),
                                      onClick = { currentScreen = AppScreen.HOME_EXPLORE },
                                      icon = { Icon(Icons.Default.Home, contentDescription = "Accueil") },
                                      label = { Text("Accueil", fontSize = 11.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = QdOrange,
                                          selectedTextColor = QdOrange,
                                          unselectedIconColor = QdTextMuted,
                                          unselectedTextColor = QdTextMuted,
                                          indicatorColor = Color.Transparent
                                      )
                                  )
                                  NavigationBarItem(
                                      selected = (currentScreen == AppScreen.ORDERS_LIST),
                                      onClick = { currentScreen = AppScreen.ORDERS_LIST },
                                      icon = { Icon(Icons.Default.ReceiptLong, contentDescription = "Commandes") },
                                      label = { Text("Commandes", fontSize = 11.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = QdOrange,
                                          selectedTextColor = QdOrange,
                                          unselectedIconColor = QdTextMuted,
                                          unselectedTextColor = QdTextMuted,
                                          indicatorColor = Color.Transparent
                                      )
                                  )
                                  NavigationBarItem(
                                      selected = (currentScreen == AppScreen.ORDER_TRACKING),
                                      onClick = { currentScreen = AppScreen.ORDER_TRACKING },
                                      icon = { Icon(Icons.Default.LocationOn, contentDescription = "Carte") },
                                      label = { Text("Carte", fontSize = 11.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = QdOrange,
                                          selectedTextColor = QdOrange,
                                          unselectedIconColor = QdTextMuted,
                                          unselectedTextColor = QdTextMuted,
                                          indicatorColor = Color.Transparent
                                      )
                                  )
                                  NavigationBarItem(
                                      selected = (currentScreen == AppScreen.PROFILE || currentScreen == AppScreen.DRIVER_DASHBOARD),
                                      onClick = {
                                          currentScreen = if (isDriverSession) AppScreen.DRIVER_DASHBOARD else AppScreen.PROFILE
                                      },
                                      icon = { Icon(Icons.Default.Person, contentDescription = "Profil") },
                                      label = { Text(if (isDriverSession) "Livreur" else "Profil", fontSize = 11.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = QdOrange,
                                          selectedTextColor = QdOrange,
                                          unselectedIconColor = QdTextMuted,
                                          unselectedTextColor = QdTextMuted,
                                          indicatorColor = Color.Transparent
                                      )
                                  )
                              }
                          }
                      }
                  ) { padding ->
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(padding)
                      ) {
                          when (currentScreen) {
                              AppScreen.SPLASH_ONBOARDING -> {
                                  SplashScreen(
                                      onStart = {
                                          authUserType = AuthUserType.CUSTOMER
                                          currentScreen = AppScreen.AUTH_FLOW
                                      },
                                      onLogin = {
                                          authUserType = AuthUserType.CUSTOMER
                                          currentScreen = AppScreen.AUTH_FLOW
                                      }
                                  )
                              }
                              AppScreen.AUTH_FLOW -> {
                                  AuthScreen(
                                      userType = authUserType,
                                      onSuccess = { name, phone, uid, isDriver ->
                                          currentUserName = name
                                          currentUserPhone = phone
                                          currentUserUid = uid
                                          isDriverSession = isDriver
                                          currentScreen = if (isDriver) AppScreen.DRIVER_DASHBOARD else AppScreen.HOME_EXPLORE
                                      },
                                      onCancel = { currentScreen = AppScreen.SPLASH_ONBOARDING }
                                  )
                              }
                              AppScreen.HOME_EXPLORE -> {
                                  HomeScreen(
                                      selectedCity = "العفرون (Blida)",
                                      stores = availableStores,
                                      onSelectRestaurant = { rest ->
                                          selectedRestaurant = rest
                                          currentScreen = AppScreen.CONFIRM_ORDER
                                      },
                                      onOrderBannerClick = { currentScreen = AppScreen.CONFIRM_ORDER }
                                  )
                              }
                              AppScreen.CONFIRM_ORDER -> {
                                  ConfirmOrderScreen(
                                      restaurant = selectedRestaurant,
                                      address = selectedAddress,
                                      meals = orderedMeals,
                                      userLat = userLat,
                                      userLng = userLng,
                                      onAddMeal = { showAddMealDialog = true },
                                      onChangeAddress = { currentScreen = AppScreen.CHOOSE_ADDRESS },
                                      onBack = { currentScreen = AppScreen.HOME_EXPLORE },
                                      onConfirmOrder = { deliveryFee, note ->
                                          SoundHelper.playNotificationTone()
                                          val orderMap = hashMapOf(
                                              "restaurant" to selectedRestaurant.name,
                                              "customerAddress" to selectedAddress,
                                              "price" to (deliveryFee + 450),
                                              "status" to "pending",
                                              "customerId" to currentUserUid,
                                              "customerName" to currentUserName,
                                              "customerPhone" to currentUserPhone,
                                              "storeLat" to selectedRestaurant.lat,
                                              "storeLng" to selectedRestaurant.lng,
                                              "lat" to userLat,
                                              "lng" to userLng,
                                              "note" to note,
                                              "items" to orderedMeals.map { mapOf("name" to it.name, "qty" to it.qty) },
                                              "createdAt" to java.text.SimpleDateFormat("yyyy-MM-dd HH:mm", java.util.Locale.getDefault()).format(java.util.Date())
                                          )
                                          db.collection("orders").add(orderMap)
                                          currentScreen = AppScreen.ORDER_TRACKING
                                      }
                                  )
                              }
                              AppScreen.ORDER_TRACKING -> {
                                  val runningOrder = activeOrders.lastOrNull {
                                      it.status in listOf("pending", "accepted", "to_store", "received", "delivered")
                                  } ?: activeOrders.firstOrNull() ?: ActiveOrder(
                                      id = "1001",
                                      restaurant = selectedRestaurant.name,
                                      address = selectedAddress,
                                      price = 250,
                                      status = "En livraison",
                                      driverName = "عامل توصيل العفرون",
                                      driverPhone = "0555123456",
                                      storeLat = selectedRestaurant.lat,
                                      storeLng = selectedRestaurant.lng,
                                      custLat = userLat,
                                      custLng = userLng
                                  )

                                  OrderTrackingScreen(
                                      order = runningOrder,
                                      userLat = userLat,
                                      userLng = userLng,
                                      onBack = { currentScreen = AppScreen.HOME_EXPLORE },
                                      onOpenChat = { showChatModal = true },
                                      onConfirmDelivered = {
                                          db.collection("orders").document(runningOrder.id)
                                              .update("status", "completed")
                                          SoundHelper.playArrivalTone()
                                          showRatingModal = true
                                      },
                                      onCancelOrder = {
                                          db.collection("orders").document(runningOrder.id).delete()
                                          currentScreen = AppScreen.HOME_EXPLORE
                                      }
                                  )
                              }
                              AppScreen.ORDERS_LIST -> {
                                  OrdersListScreen(
                                      orders = activeOrders,
                                      onSelectOrder = { currentScreen = AppScreen.ORDER_TRACKING }
                                  )
                              }
                              AppScreen.CHOOSE_ADDRESS -> {
                                  ChooseAddressScreen(
                                      currentSelected = selectedAddress,
                                      onSelect = {
                                          selectedAddress = it
                                          currentScreen = AppScreen.CONFIRM_ORDER
                                      },
                                      onBack = { currentScreen = AppScreen.CONFIRM_ORDER }
                                  )
                              }
                              AppScreen.PROFILE -> {
                                  ProfileScreen(
                                      name = currentUserName,
                                      phone = currentUserPhone,
                                      onBecomeDriver = { currentScreen = AppScreen.BECOME_DRIVER },
                                      onOpenPolicy = { policyType -> showPolicyModal = policyType },
                                      onOpenReport = { showReportModal = true },
                                      onOpenAdmin = { currentScreen = AppScreen.ADMIN_PANEL },
                                      onLogout = {
                                          auth.signOut()
                                          currentUserUid = ""
                                          isDriverSession = false
                                          currentScreen = AppScreen.SPLASH_ONBOARDING
                                      }
                                  )
                              }
                              AppScreen.BECOME_DRIVER -> {
                                  BecomeDriverScreen(
                                      onBack = { currentScreen = AppScreen.PROFILE },
                                      onRegisterDriver = {
                                          authUserType = AuthUserType.DRIVER
                                          currentScreen = AppScreen.AUTH_FLOW
                                      }
                                  )
                              }
                              AppScreen.DRIVER_DASHBOARD -> {
                                  DriverDashboardScreen(
                                      driverName = currentUserName,
                                      earnings = driverEarnings,
                                      completedCount = driverCompletedCount,
                                      debt = driverDebt,
                                      activeOrders = activeOrders,
                                      onUpdateStatus = { ord, status ->
                                          db.collection("orders").document(ord.id).update("status", status)
                                      },
                                      onFinishOrder = { ord ->
                                          db.collection("orders").document(ord.id).update("status", "delivered")
                                          SoundHelper.playArrivalTone()
                                      },
                                      onOpenChat = { showChatModal = true },
                                      onSwitchToCustomer = {
                                          isDriverSession = false
                                          currentScreen = AppScreen.HOME_EXPLORE
                                      }
                                  )
                              }
                              AppScreen.ADMIN_PANEL -> {
                                  AdminPanelScreen(
                                      stores = availableStores,
                                      orders = activeOrders,
                                      onAddStore = { storeName, lat, lng ->
                                          val sMap = hashMapOf("name" to storeName, "lat" to lat, "lng" to lng)
                                          db.collection("stores").add(sMap)
                                      },
                                      onBack = { currentScreen = AppScreen.PROFILE }
                                  )
                              }
                          }

                          // Incoming Delivery Call Overlay Modal for Drivers
                          incomingDriverAlertOrder?.let { incOrder ->
                              DriverIncomingOrderDialog(
                                  order = incOrder,
                                  onAccept = {
                                      db.collection("orders").document(incOrder.id).update(
                                          mapOf(
                                              "status" to "accepted",
                                              "driverName" to currentUserName,
                                              "driverPhone" to currentUserPhone
                                          )
                                      )
                                      incomingDriverAlertOrder = null
                                  },
                                  onReject = {
                                      incomingDriverAlertOrder = null
                                  }
                              )
                          }

                          if (showChatModal) {
                              ChatModalDialog(
                                  messages = chatMessages,
                                  onSendMessage = { text ->
                                      chatMessages.add(ChatMessage(if (isDriverSession) "driver" else "customer", text, "الآن"))
                                  },
                                  onDismiss = { showChatModal = false }
                              )
                          }

                          if (showRatingModal) {
                              RatingModalDialog(
                                  onDismiss = { showRatingModal = false },
                                  onRated = {
                                      showRatingModal = false
                                      currentScreen = AppScreen.ORDERS_LIST
                                  }
                              )
                          }

                          if (showAddMealDialog) {
                              AddMealModalDialog(
                                  onDismiss = { showAddMealDialog = false },
                                  onAddMeal = { mealName, qty ->
                                      orderedMeals.add(OrderProduct(mealName, qty))
                                      showAddMealDialog = false
                                  }
                              )
                          }

                          if (showReportModal) {
                              ReportIncidentDialog(
                                  onDismiss = { showReportModal = false },
                                  onSubmit = { reason ->
                                      val repMap = hashMapOf(
                                          "reporter" to currentUserName,
                                          "phone" to currentUserPhone,
                                          "reason" to reason,
                                          "date" to java.text.SimpleDateFormat("yyyy-MM-dd HH:mm", java.util.Locale.getDefault()).format(java.util.Date())
                                      )
                                      db.collection("reports").add(repMap)
                                      showReportModal = false
                                  }
                              )
                          }

                          showPolicyModal?.let { pType ->
                              PolicyInfoDialog(
                                  type = pType,
                                  onDismiss = { showPolicyModal = null }
                              )
                          }
                      }
                  }
              }
          }

          // -------------------------------------------------------------
          // 1. SCREEN: SPLASH ONBOARDING (Screen 1 in mockup)
          // -------------------------------------------------------------
          @Composable
          fun SplashScreen(
              onStart: () -> Unit,
              onLogin: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(horizontal = 28.dp, vertical = 24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Spacer(modifier = Modifier.height(20.dp))

                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      QuickDeliverLogoGraphic(size = 110.dp)
                      Spacer(modifier = Modifier.height(18.dp))
                      Text(
                          text = "QuickDeliver",
                          fontSize = 32.sp,
                          fontWeight = FontWeight.Black,
                          color = QdOrange
                      )
                      Spacer(modifier = Modifier.height(6.dp))
                      Text(
                          text = "Vos commandes,\nnotre priorité !",
                          fontSize = 17.sp,
                          fontWeight = FontWeight.Medium,
                          textAlign = TextAlign.Center,
                          color = QdTextDark,
                          lineHeight = 24.sp
                      )
                  }

                  Box(
                      modifier = Modifier
                          .size(240.dp)
                          .clip(CircleShape)
                          .background(Color(0xFFFFF6F0.toInt())),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(text = "🛵", fontSize = 110.sp)
                  }

                  Column(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Button(
                          onClick = onStart,
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(54.dp),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrange)
                      ) {
                          Text(text = "Commencer", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = Color.White)
                      }
                      Spacer(modifier = Modifier.height(14.dp))
                      Text(
                          text = "Se connecter",
                          fontSize = 14.sp,
                          fontWeight = FontWeight.SemiBold,
                          color = QdTextDark,
                          modifier = Modifier
                              .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) { onLogin() }
                              .padding(8.dp)
                      )
                  }
              }
          }

          // -------------------------------------------------------------
          // 2. SCREEN: AUTH FLOW (Email, Google, Facebook & Driver Verification)
          // -------------------------------------------------------------
          @Composable
          fun AuthScreen(
              userType: AuthUserType,
              onSuccess: (name: String, phone: String, uid: String, isDriver: Boolean) -> Unit,
              onCancel: () -> Unit
          ) {
              val auth = Firebase.auth
              val db = Firebase.firestore

              var isRegisterMode by remember { mutableStateOf(userType == AuthUserType.DRIVER) }
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var termsAccepted by remember { mutableStateOf(false) }
              var ageAccepted by remember { mutableStateOf(false) }
              var errorMessage by remember { mutableStateOf("") }
              var isLoading by remember { mutableStateOf(false) }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  item {
                      Text(
                          text = if (isRegisterMode) "Créer un compte" else "Connexion",
                          fontSize = 24.sp,
                          fontWeight = FontWeight.Black,
                          color = QdOrange
                      )

                      Text(
                          text = when (userType) {
                              AuthUserType.DRIVER -> "Espace Livreur - El Affroun (50 DA / 500m)"
                              AuthUserType.ADMIN -> "Portail Administration Sécurisé"
                              AuthUserType.CUSTOMER -> "Commandez rapidement vos plats et courses"
                          },
                          fontSize = 12.sp,
                          color = QdTextMuted,
                          modifier = Modifier.padding(top = 4.dp, bottom = 20.dp)
                      )

                      if (userType == AuthUserType.CUSTOMER && !isRegisterMode) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              OutlinedButton(
                                  onClick = {
                                      onSuccess("زبون عبر Google", "0555123456", "google_dummy_uid", false)
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Text("Google", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                              OutlinedButton(
                                  onClick = {
                                      onSuccess("زبون عبر Facebook", "0555654321", "fb_dummy_uid", false)
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Text("Facebook", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                          Spacer(modifier = Modifier.height(14.dp))
                          Divider(color = QdBorder)
                          Spacer(modifier = Modifier.height(14.dp))
                      }

                      if (isRegisterMode) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("الاسم الكامل") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = phone,
                              onValueChange = { phone = it },
                              label = { Text("رقم الهاتف") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                      }

                      OutlinedTextField(
                          value = email,
                          onValueChange = { email = it },
                          label = { Text("البريد الإلكتروني") },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedTextField(
                          value = password,
                          onValueChange = { password = it },
                          label = { Text("كلمة المرور") },
                          visualTransformation = PasswordVisualTransformation(),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      if (isRegisterMode) {
                          Spacer(modifier = Modifier.height(12.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = termsAccepted, onCheckedChange = { termsAccepted = it })
                              Text("أوافق على شروط الخدمة وتعرفات التوصيل (50 دج / 500م)", fontSize = 11.sp, color = QdTextDark)
                          }
                          if (userType == AuthUserType.DRIVER) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(checked = ageAccepted, onCheckedChange = { ageAccepted = it })
                                  Text("أؤكد أن عمري فوق 18 سنة وألتزم بسداد ديون المنصة (10دج/كم)", fontSize = 11.sp, color = QdTextDark)
                              }
                          }
                      }

                      if (errorMessage.isNotEmpty()) {
                          Text(errorMessage, color = QdRed, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                      }

                      Spacer(modifier = Modifier.height(18.dp))

                      Button(
                          onClick = {
                              errorMessage = ""
                              if (email.isBlank() || password.isBlank()) {
                                  errorMessage = "يرجى ملء جميع الحقول"
                                  return@Button
                              }
                              isLoading = true
                              val isDriver = (userType == AuthUserType.DRIVER)
                              if (isRegisterMode) {
                                  auth.createUserWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          val userMap = hashMapOf(
                                              "name" to name.trim(),
                                              "phoneNumber" to phone.trim(),
                                              "email" to email.trim(),
                                              "role" to if (isDriver) "driver" else "customer",
                                              "debt" to 0
                                          )
                                          db.collection("users").document(uid).set(userMap)
                                              .addOnSuccessListener {
                                                  isLoading = false
                                                  onSuccess(name.trim(), phone.trim(), uid, isDriver)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "حدث خطأ أثناء التسجيل"
                                      }
                              } else {
                                  auth.signInWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          db.collection("users").document(uid).get()
                                              .addOnSuccessListener { snap ->
                                                  isLoading = false
                                                  val fetchedName = snap.getString("name") ?: "مستخدم"
                                                  val fetchedPhone = snap.getString("phoneNumber") ?: "0555555555"
                                                  val role = snap.getString("role") ?: "customer"
                                                  onSuccess(fetchedName, fetchedPhone, uid, role == "driver")
                                              }
                                              .addOnFailureListener {
                                                  isLoading = false
                                                  onSuccess("مستخدم", "0555555555", uid, false)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "فشل تسجيل الدخول"
                                      }
                              }
                          },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrange),
                          enabled = !isLoading
                      ) {
                          if (isLoading) {
                              CircularProgressIndicator(color = Color.White, modifier = Modifier.size(24.dp))
                          } else {
                              Text(if (isRegisterMode) "S'inscrire" else "Se connecter", fontWeight = FontWeight.Bold, fontSize = 15.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(10.dp))
                      TextButton(onClick = { isRegisterMode = !isRegisterMode }) {
                          Text(if (isRegisterMode) "Vous avez déjà un compte ? Se connecter" else "Pas de compte ? S'inscrire", color = QdOrange, fontSize = 12.sp)
                      }
                      OutlinedButton(onClick = onCancel, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp)) {
                          Text("Annuler", color = QdTextDark)
                      }
                  }
              }
          }

