                          position = GeoPoint(centerLat, centerLng)
                          setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                          icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#0F172A"), "ðŸ ")
                      }
                      val storeMarker = Marker(mapView).apply {
                          position = GeoPoint(destinationLat, destinationLng)
                          setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                          icon = MapUtils.createCustomPin(context, android.graphics.Color.parseColor("#FF6B00"), "ðŸ´")
                      }
                      mapView.overlays.add(userMarker)
                      mapView.overlays.add(storeMarker)
                      if (roadWaypoints.isNotEmpty()) {
                          val polyline = Polyline(mapView).apply {
                              roadWaypoints.forEach { addPoint(it) }
                              outlinePaint.color = android.graphics.Color.parseColor("#FF6B00")
                              outlinePaint.strokeWidth = 14f
                          }
                          mapView.overlays.add(polyline)
                      }
                      mapView.invalidate()
                  }
              )
          }

