                                              val orderMap = hashMapOf(
                                                  "restaurant" to selectedRestaurant.name,
                                                  "customerAddress" to selectedAddress,
                                                  "price" to (deliveryFee + 450),
                                                  "status" to "pending",
                                                  "customerId" to currentUserUid,
                                                  "customerName" to currentUserName,
                                                  "customerPhone" to currentUserPhone,
                                                  "storeLat" to selectedRestaurant.lat,
                                                  "storeLng" to selectedRestaurant.lng,
                                                  "lat" to userLat,
                                                  "lng" to userLng,
                                                  "note" to note,
                                                  "items" to orderedMeals.map { mapOf("name" to it.name, "qty" to it.qty) },
                                                  "createdAt" to java.text.SimpleDateFormat("yyyy-MM-dd HH:mm", java.util.Locale.getDefault()).format(java.util.Date())
                                              )
                                              db.collection("orders").add(orderMap)
                                              currentScreen = AppScreen.ORDER_TRACKING
                                          }
                                      )
                                  }
                                  AppScreen.ORDER_TRACKING -> {
                                      val runningOrder = activeOrders.lastOrNull {
                                          it.status in listOf("pending", "accepted", "to_store", "received", "delivered")
                                      } ?: activeOrders.firstOrNull() ?: ActiveOrder(
                                          id = "1001",
                                          restaurant = selectedRestaurant.name,
                                          address = selectedAddress,
                                          price = 250,
                                          status = "En livraison",
                                          driverName = "Kader",
                                          driverPhone = "0555123456",
                                          storeLat = selectedRestaurant.lat,
                                          storeLng = selectedRestaurant.lng,
                                          custLat = userLat,
                                          custLng = userLng
                                      )

                                      OrderTrackingScreen(
                                          lang = currentLanguage,
                                          order = runningOrder,
                                          userLat = userLat,
                                          userLng = userLng,
                                          onBack = { currentScreen = AppScreen.HOME_EXPLORE },
                                          onOpenChat = { showChatModal = true },
                                          onConfirmDelivered = {
                                              db.collection("orders").document(runningOrder.id)
                                                  .update("status", "completed")
                                              SoundHelper.playArrivalTone()
                                              showRatingModal = true
                                          },
                                          onCancelOrder = {
                                              db.collection("orders").document(runningOrder.id).delete()
                                              currentScreen = AppScreen.HOME_EXPLORE
                                          }
                                      )
                                  }
                                  AppScreen.ORDERS_LIST -> {
                                      OrdersListScreen(
                                          lang = currentLanguage,
                                          orders = activeOrders,
                                          onSelectOrder = { currentScreen = AppScreen.ORDER_TRACKING }
                                      )
                                  }
                                  AppScreen.CHOOSE_ADDRESS -> {
                                      ChooseAddressScreen(
                                          lang = currentLanguage,
                                          currentSelected = selectedAddress,
                                          onSelect = {
                                              selectedAddress = it
                                              currentScreen = AppScreen.CONFIRM_ORDER
                                          },
                                          onBack = { currentScreen = AppScreen.CONFIRM_ORDER }
                                      )
                                  }
                                  AppScreen.PROFILE -> {
                                      ProfileScreen(
                                          lang = currentLanguage,
                                          name = currentUserName,
                                          phone = currentUserPhone,
                                          onBecomeDriver = {
                                              authUserType = AuthUserType.DRIVER
                                              isDriverAuthRegister = true
                                              currentScreen = AppScreen.AUTH_FLOW
                                          },
                                          onOpenPolicy = { policyType -> showPolicyModal = policyType },
                                          onOpenReport = { showReportModal = true },
                                          onLogout = {
                                              auth.signOut()
                                              currentUserUid = ""
                                              isDriverSession = false
                                              currentScreen = AppScreen.SPLASH_ONBOARDING
                                          }
                                      )
                                  }
                                  AppScreen.DRIVER_DASHBOARD -> {
                                      DriverDashboardScreen(
                                          lang = currentLanguage,
                                          driverName = currentUserName,
                                          earnings = driverEarnings,
                                          completedCount = driverCompletedCount,
                                          debt = driverDebt,
                                          activeOrders = activeOrders,
                                          onUpdateStatus = { ord, status ->
                                              db.collection("orders").document(ord.id).update("status", status)
                                          },
                                          onFinishOrder = { ord ->
                                              db.collection("orders").document(ord.id).update("status", "delivered")
                                              SoundHelper.playArrivalTone()
                                          },
                                          onOpenChat = { showChatModal = true },
                                          onSwitchToCustomer = {
                                              isDriverSession = false
                                              currentScreen = AppScreen.HOME_EXPLORE
                                          }
                                      )
                                  }
                              }

                              incomingDriverAlertOrder?.let { incOrder ->
                                  DriverIncomingOrderDialog(
                                      lang = currentLanguage,
                                      order = incOrder,
                                      onAccept = {
                                          db.collection("orders").document(incOrder.id).update(
                                              mapOf(
                                                  "status" to "accepted",
                                                  "driverName" to currentUserName,
                                                  "driverPhone" to currentUserPhone
                                              )
                                          )
                                          incomingDriverAlertOrder = null
                                      },
                                      onReject = {
                                          incomingDriverAlertOrder = null
                                      }
                                  )
                              }

                              if (showChatModal) {
                                  ChatModalDialog(
                                      messages = chatMessages,
                                      onSendMessage = { text ->
                                          chatMessages.add(ChatMessage(if (isDriverSession) "driver" else "customer", text, "12:00"))
                                      },
                                      onDismiss = { showChatModal = false }
                                  )
                              }

                              if (showRatingModal) {
                                  RatingModalDialog(
                                      onDismiss = { showRatingModal = false },
                                      onRated = {
                                          showRatingModal = false
                                          currentScreen = AppScreen.ORDERS_LIST
                                      }
                                  )
                              }

                              if (showAddMealDialog) {
                                  AddMealModalDialog(
                                      onDismiss = { showAddMealDialog = false },
                                      onAddMeal = { mealName, qty ->
                                          orderedMeals.add(OrderProduct(mealName, qty))
                                          showAddMealDialog = false
                                      }
                                  )
                              }

                              if (showReportModal) {
                                  ReportIncidentDialog(
                                      onDismiss = { showReportModal = false },
                                      onSubmit = { reason ->
                                          val repMap = hashMapOf(
                                              "reporter" to currentUserName,
                                              "phone" to currentUserPhone,
                                              "reason" to reason,
                                              "date" to java.text.SimpleDateFormat("yyyy-MM-dd HH:mm", java.util.Locale.getDefault()).format(java.util.Date())
                                          )
                                          db.collection("reports").add(repMap)
                                          showReportModal = false
                                      }
                                  )
                              }

                              showPolicyModal?.let { pType ->
                                  PolicyInfoDialog(
                                      type = pType,
                                      lang = currentLanguage,
                                      onDismiss = { showPolicyModal = null }
                                  )
                              }
                          }
                      }
                  }
              }
          }

