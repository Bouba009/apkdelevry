          @Composable
          fun ChatModalDialog(
              messages: List<ChatMessage>,
              onSendMessage: (String) -> Unit,
              onDismiss: () -> Unit
          ) {
              var textInput by remember { mutableStateOf("") }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .fillMaxHeight(0.72f),
                      shape = RoundedCornerShape(22.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White)
                  ) {
                      Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("محادثة مباشرة مع السائق/الزبون", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              IconButton(onClick = onDismiss) {
                                  Icon(Icons.Default.Close, contentDescription = "Fermer")
                              }
                          }

                          LazyColumn(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(messages) { msg ->
                                  val isMe = msg.sender == "customer"
                                  Column(modifier = Modifier.fillMaxWidth(), horizontalAlignment = if (isMe) Alignment.End else Alignment.Start) {
                                      Box(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(12.dp))
                                              .background(if (isMe) QdOrange else Color(0xFFF1F2F4.toInt()))
                                              .padding(horizontal = 12.dp, vertical = 8.dp)
                                      ) {
                                          Text(msg.text, color = if (isMe) Color.White else QdTextDark, fontSize = 12.sp)
                                      }
                                      Text(msg.time, fontSize = 9.sp, color = QdTextMuted, modifier = Modifier.padding(horizontal = 4.dp))
                                  }
                              }
                          }

                          Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = textInput,
                                  onValueChange = { textInput = it },
                                  placeholder = { Text("اكتب رسالتك هنا...", fontSize = 11.sp) },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              )
                              IconButton(
                                  onClick = {
                                      if (textInput.isNotBlank()) {
                                          onSendMessage(textInput.trim())
                                          textInput = ""
                                      }
                                  }
                              ) {
                                  Icon(Icons.Default.Send, contentDescription = "Envoyer", tint = QdOrange)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun RatingModalDialog(
              onDismiss: () -> Unit,
              onRated: () -> Unit
          ) {
              var stars by remember { mutableStateOf(5) }

              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(22.dp),
