                                  Text(store.emoji, fontSize = 32.sp)
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(store.nameAr, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                                      Text("${store.menu.size} منتجات • ${store.rating} ★ • ${store.time}", fontSize = 11.sp, color = QdTextMuted)
