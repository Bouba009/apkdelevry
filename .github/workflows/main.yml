                                  IconButton(onClick = { context.startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:${order.driverPhone}"))) }) { Icon(Icons.Default.Phone, null, tint = QdOrange) }
                                  IconButton(onClick = onOpenChat) { Icon(Icons.Default.ChatBubble, null, tint = QdOrange) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DriverDashboardScreen(
              lang: Language, driverName: String, earnings: Int, completed: Int, debt: Int,
              activeOrders: List<ActiveOrder>, onUpdate: (ActiveOrder, String) -> Unit, onFinish: (ActiveOrder) -> Unit,
              onChat: (ActiveOrder) -> Unit, onPayDebt: () -> Unit
