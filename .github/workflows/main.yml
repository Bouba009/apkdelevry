          @Composable
          fun CategoryItem(icon: ImageVector, label: String, selected: Boolean, onClick: () -> Unit) {
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.clickable { onClick() }) {
                  Box(modifier = Modifier.size(48.dp).clip(RoundedCornerShape(14.dp)).background(if (selected) QdOrange else QdOrangeSoft), contentAlignment = Alignment.Center) {
                      Icon(icon, null, tint = if (selected) Color.White else QdOrange, modifier = Modifier.size(24.dp))
                  }
