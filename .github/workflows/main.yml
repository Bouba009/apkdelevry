          // -------------------------------------------------------------
          // 2. SCREEN: AUTH FLOW
          // -------------------------------------------------------------
          @Composable
          fun AuthScreen(
              lang: Language,
              userType: AuthUserType,
              initialRegister: Boolean,
              onSuccess: (name: String, phone: String, uid: String, isDriver: Boolean) -> Unit,
              onCancel: () -> Unit
          ) {
              val auth = Firebase.auth
              val db = Firebase.firestore

              var isRegisterMode by remember { mutableStateOf(initialRegister) }
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var termsAccepted by remember { mutableStateOf(false) }
              var errorMessage by remember { mutableStateOf("") }
              var isLoading by remember { mutableStateOf(false) }

              LazyColumn(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.White)
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  item {
                      Text(
                          text = if (isRegisterMode) AppStrings.get("signup_action", lang) else AppStrings.get("login_action", lang),
                          fontSize = 24.sp,
                          fontWeight = FontWeight.Black,
                          color = QdOrange
                      )

                      Text(
                          text = if (userType == AuthUserType.DRIVER) AppStrings.get("driver_tab", lang) else AppStrings.get("tagline", lang),
                          fontSize = 12.sp,
                          color = QdTextMuted,
                          modifier = Modifier.padding(top = 4.dp, bottom = 20.dp)
                      )

                      if (userType == AuthUserType.CUSTOMER && !isRegisterMode) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              OutlinedButton(
                                  onClick = {
                                      onSuccess("Client Google", "0555123456", "google_uid", false)
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Text("Google", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                              OutlinedButton(
                                  onClick = {
                                      onSuccess("Client Facebook", "0555654321", "fb_uid", false)
                                  },
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Text("Facebook", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                          Spacer(modifier = Modifier.height(14.dp))
                          Divider(color = QdBorder)
                          Spacer(modifier = Modifier.height(14.dp))
                      }

                      if (isRegisterMode) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("Nom / الاسم") },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = phone,
                              onValueChange = { phone = it },
                              label = { Text("Téléphone / الهاتف") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(12.dp)
                          )
                          Spacer(modifier = Modifier.height(10.dp))
                      }

                      OutlinedTextField(
                          value = email,
                          onValueChange = { email = it },
                          label = { Text("Email / البريد") },
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      Spacer(modifier = Modifier.height(10.dp))

                      OutlinedTextField(
                          value = password,
                          onValueChange = { password = it },
                          label = { Text("Mot de passe / كلمة المرور") },
                          visualTransformation = PasswordVisualTransformation(),
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(12.dp)
                      )

                      if (isRegisterMode) {
                          Spacer(modifier = Modifier.height(12.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(checked = termsAccepted, onCheckedChange = { termsAccepted = it })
                              Text(AppStrings.get("shipping_policy", lang) + " (50 DA / 500m)", fontSize = 11.sp, color = QdTextDark)
                          }
                      }

                      if (errorMessage.isNotEmpty()) {
                          Text(errorMessage, color = QdRed, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                      }

                      Spacer(modifier = Modifier.height(18.dp))

                      Button(
                          onClick = {
                              errorMessage = ""
                              if (email.isBlank() || password.isBlank()) {
                                  errorMessage = "Champs requis manquants"
                                  return@Button
                              }
                              isLoading = true
                              val isDriver = (userType == AuthUserType.DRIVER)
                              if (isRegisterMode) {
                                  auth.createUserWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          val userMap = hashMapOf(
                                              "name" to name.trim(),
                                              "phoneNumber" to phone.trim(),
                                              "email" to email.trim(),
                                              "role" to if (isDriver) "driver" else "customer",
                                              "debt" to 0
                                          )
                                          db.collection("users").document(uid).set(userMap)
                                              .addOnSuccessListener {
                                                  isLoading = false
                                                  onSuccess(name.trim(), phone.trim(), uid, isDriver)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "Erreur"
                                      }
                              } else {
                                  auth.signInWithEmailAndPassword(email.trim(), password)
                                      .addOnSuccessListener { cred ->
                                          val uid = cred.user?.uid ?: ""
                                          db.collection("users").document(uid).get()
                                              .addOnSuccessListener { snap ->
                                                  isLoading = false
                                                  val fetchedName = snap.getString("name") ?: "User"
                                                  val fetchedPhone = snap.getString("phoneNumber") ?: "0555555555"
                                                  val role = snap.getString("role") ?: "customer"
                                                  onSuccess(fetchedName, fetchedPhone, uid, role == "driver")
                                              }
                                              .addOnFailureListener {
                                                  isLoading = false
                                                  onSuccess("User", "0555555555", uid, false)
                                              }
                                      }
                                      .addOnFailureListener { e ->
                                          isLoading = false
                                          errorMessage = e.localizedMessage ?: "Erreur"
                                      }
                              }
                          },
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp),
                          shape = RoundedCornerShape(16.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = QdOrange),
                          enabled = !isLoading
                      ) {
                          if (isLoading) {
                              CircularProgressIndicator(color = Color.White, modifier = Modifier.size(24.dp))
                          } else {
                              Text(if (isRegisterMode) AppStrings.get("signup_action", lang) else AppStrings.get("login_action", lang), fontWeight = FontWeight.Bold, fontSize = 15.sp)
                          }
                      }

                      Spacer(modifier = Modifier.height(10.dp))
                      TextButton(onClick = { isRegisterMode = !isRegisterMode }) {
                          Text(if (isRegisterMode) AppStrings.get("login_action", lang) else AppStrings.get("signup_action", lang), color = QdOrange, fontSize = 12.sp)
                      }
                      OutlinedButton(onClick = onCancel, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp)) {
                          Text(AppStrings.get("cancel", lang), color = QdTextDark)
                      }
                  }
              }
          }

