          package com.elaffroun.delivery

          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import com.google.firebase.auth.ktx.auth
          import com.google.firebase.firestore.ktx.firestore
          import com.google.firebase.ktx.Firebase

          class NotificationActionReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val orderId = intent.getStringExtra("order_id") ?: return
                  val action = intent.action
                  val notificationId = intent.getIntExtra("notification_id", 1001)

                  val notificationManager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  notificationManager.cancel(notificationId)

                  if (action == "ACTION_ACCEPT_ORDER") {
                      val auth = Firebase.auth
                      val db = Firebase.firestore
                      val currentUid = auth.currentUser?.uid ?: ""

                      if (currentUid.isNotEmpty()) {
                          db.collection("users").document(currentUid).get().addOnSuccessListener { doc ->
                              val dName = doc.getString("name") ?: "Ø¹Ø§Ù…Ù„ ØªÙˆØµÙŠÙ„ Ù…Ø¹ØªÙ…Ø¯"
                              val dPhone = doc.getString("phoneNumber") ?: ""
                              db.collection("orders").document(orderId).update(
                                  mapOf(
                                      "status" to "accepted",
                                      "driverName" to dName,
                                      "driverPhone" to dPhone
                                  )
                              )
                          }
                      }

                      val launchIntent = Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("open_order_id", orderId)
                      }
                      context.startActivity(launchIntent)
                  }
              }
          }
