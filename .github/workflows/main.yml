                  it.status in listOf("pending", "accepted", "to_store", "received", "delivered")
              }

              Scaffold(
                  floatingActionButton = {
                      Column(
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                          horizontalAlignment = Alignment.End
                      ) {
                          if (currentRunningOrder != null && currentRunningOrder.status != "pending") {
                              FloatingActionButton(
                                  onClick = { onOpenChat(currentRunningOrder.id) },
                                  containerColor = AccentBlue,
                                  contentColor = Color.White,
                                  shape = CircleShape
                              ) {
                                  Icon(imageVector = Icons.Default.Chat, contentDescription = "Chat")
                              }
                          }

                          ExtendedFloatingActionButton(
                              onClick = onOpenNewOrder,
                              containerColor = PrimaryColor,
                              contentColor = Color.White,
                              shape = RoundedCornerShape(22.dp)
                          ) {
                              Icon(imageVector = Icons.Default.AddShoppingCart, contentDescription = null)
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(text = "اطلب الآن", fontWeight = FontWeight.Black)
                          }
                      }
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .padding(16.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text(
                                  text = "أهلاً بك، $userName 👋",
                                  fontSize = 18.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Text(
                                  text = "بوابة الزبائن - التوصيل المباشر في العفرون",
                                  fontSize = 12.sp,
                                  color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.6f)
                              )
                          }
                          IconButton(onClick = onOpenHistory) {
                              Icon(
                                  imageVector = Icons.Default.History,
                                  contentDescription = "History",
                                  tint = PrimaryColor
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(16.dp))

                      if (currentRunningOrder != null) {
                          ActiveOrderBanner(
                              order = currentRunningOrder,
                              onConfirmDelivered = { onConfirmDelivered(currentRunningOrder) },
                              onCancel = { onCancelOrder(currentRunningOrder) }
                          )
                          Spacer(modifier = Modifier.height(16.dp))
                      }

                      Card(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f),
                          shape = RoundedCornerShape(26.dp),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          border = CardDefaults.outlinedCardBorder()
                      ) {
                          RealtimeMapView(
                              centerLat = userLat,
                              centerLng = userLng,
                              destinationLat = currentRunningOrder?.storeLat,
                              destinationLng = currentRunningOrder?.storeLng
                          )
                      }
                  }
              }
          }

          @Composable
          fun ActiveOrderBanner(
              order: Order,
              onConfirmDelivered: () -> Unit,
              onCancel: () -> Unit
          ) {
              val context = LocalContext.current
              val statusBg = when (order.status) {
                  "pending" -> AccentRed
                  "accepted" -> AccentBlue
                  "to_store" -> Color(0xFFF59E0B.toInt())
                  "received" -> PrimaryColor
                  "delivered" -> AccentGreen
                  else -> CardDarkBackground
              }

              val statusText = when (order.status) {
                  "pending" -> "جاري البحث عن عامل توصيل قريب... ⏳"
                  "accepted" -> "تم قبول طلبك بواسطة ${order.driverName} ✅"
                  "to_store" -> "${order.driverName}: في الطريق للمحل لاستلام طلبك 🏃‍♂️"
                  "received" -> "${order.driverName}: تم استلام الطلب وبطريقي إليك 🛵"
                  "delivered" -> "وصلت طلبيتك بنجاح! يرجى تأكيد الاستلام 🎁"
                  else -> "حالة الطلب غير معروفة"
              }

              Card(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(18.dp),
                  colors = CardDefaults.cardColors(containerColor = statusBg)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(14.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = "رقم الطلب #${order.id.takeLast(4)}",
                              fontWeight = FontWeight.Bold,
                              fontSize = 12.sp,
                              color = Color.White.copy(alpha = 0.85f)
                          )
                          Text(
                              text = "${order.price} دج",
                              fontWeight = FontWeight.Black,
                              fontSize = 15.sp,
                              color = Color.White
                          )
                      }

                      Spacer(modifier = Modifier.height(6.dp))

                      Text(
                          text = statusText,
                          color = Color.White,
                          fontWeight = FontWeight.ExtraBold,
                          fontSize = 13.sp
                      )

                      Spacer(modifier = Modifier.height(10.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          if (order.driverPhone.isNotBlank() && order.status != "pending") {
                              Button(
                                  onClick = {
                                      val intent = Intent(Intent.ACTION_DIAL).apply {
                                          data = Uri.parse("tel:${order.driverPhone}")
                                      }
                                      context.startActivity(intent)
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color.White),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.Phone,
                                      contentDescription = null,
                                      tint = Color.Black,
                                      modifier = Modifier.size(16.dp)
                                  )
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text(text = "اتصال", color = Color.Black, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }

                          if (order.status == "delivered") {
                              Button(
                                  onClick = onConfirmDelivered,
                                  colors = ButtonDefaults.buttonColors(containerColor = AccentGreen),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier.weight(1.5f)
                              ) {
                                  Text(text = "تأكيد الاستلام والتقييم", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }

                          if (order.status == "pending") {
                              Button(
                                  onClick = onCancel,
                                  colors = ButtonDefaults.buttonColors(containerColor = Color.White.copy(alpha = 0.2f)),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Text(text = "إلغاء الطلب", color = Color.White, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

