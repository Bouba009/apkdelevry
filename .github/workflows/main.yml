                                  fontSize = 11.sp,
                                  color = QdOrange,
                                  fontWeight = FontWeight.SemiBold,
                                  modifier = Modifier.clickable { onAddMeal() }
                              )
                          }
                      }

                      // Delivery Address
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(16.dp))
                              .background(QdBackground)
                              .padding(14.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(38.dp)
                                  .clip(CircleShape)
                                  .background(QdOrange.copy(alpha = 0.12f)),
